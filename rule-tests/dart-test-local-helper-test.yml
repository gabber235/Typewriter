id: dart-test-local-helper
valid:
  # The entry point, test data as constants and values, and declarations inside a test case.
  - |
    const _ready = PanelLocation.component(Text("Startup ready"));

    void main() {
      final failures = ["The trace exporter is unreachable"];
      for (final failure in failures) {
        testWidgets("Retry recovers an unreachable dependency at startup", (tester) async {
          Future<void> retry(Panel panel) => panel.tapOn(panel.labeled("Retry"));
          final panel = await tester.pumpPanel([signedIn(ada)], at: _ready);
          await retry(panel);
          expect(panel.shows("Startup ready"), isTrue);
        });
      }
    }
  # A scenario keeps its own local function values.
  - |
    void main() {
      scenario("a publish shows the new content", (panel) async {
        final publish = () => panel.tapOn(panel.labeled("Publish"));
        await publish();
      });
    }
  # A case pumping the panel directly, and test data built by calls on a value.
  - |
    final _data = [signedIn(ada), withPages(["intro"])];
    final _names = _data.map((piece) => piece.name).toList();

    void main() {
      testWidgets("startup shows the panel", (tester) async {
        final pump = tester.pumpPanel(_data, at: _ready);
        final panel = await pump.then((panel) => panel);
        expect(panel.shows("Startup ready"), isTrue);
      });
    }
  # A host driven journey runs its steps from the entry point, page steps through its support.
  - |
    Future<void> main() => journey("AUTH-2", "a user signs in", Demonstrates.happyPath, (user) async {
      await user.provider.endsSessionDuring(() async {
        await user.tap("Logout");
      });
      await until("Authentik asks for the user", user.provider.asksForUser);
    });
  # A journey keeps its own local functions inside its body.
  - |
    Future<void> main() => journey("AUTH-2", "a user signs in", Demonstrates.happyPath, (user) async {
      Future<void> signOut() async {
        await user.tap(user.username);
        await user.tap("Logout");
      }
      await user.provider.endsSessionDuring(signOut);
    });
  # A case runner the rule has never heard of keeps its own local functions.
  - |
    void main() {
      story("a story renders its empty state", (tester) async {
        Future<void> open() => tester.pumpPanel([]);
        await open();
      });
    }
  # A case named by a variable, one case per fixture, keeps its own local functions.
  - |
    void main() {
      for (final fixture in fixtures) {
        final id = fixture["id"]! as String;
        test(id, () {
          Object? owner(Map<String, Object?> fixture) => fixture["owner"];
          expect(owner(fixture), isNotNull);
        });
      }
    }
invalid:
  # A host driven journey's page step as a top level function.
  - |
    Future<void> main() => journey("AUTH-2", "a user signs in", Demonstrates.happyPath, (user) async {
      await _type(user, "input[name=uidField]", user.username);
    });

    Future<void> _type(Journey user, String selector, String text) async {}
  # A top level pump helper.
  - |
    Future<Panel> _pumpReady(WidgetTester tester) => tester.pumpPanel([signedIn(ada)], at: _ready);

    void main() {
      testWidgets("startup shows the panel", (tester) async {
        final panel = await _pumpReady(tester);
        expect(panel.shows("Startup ready"), isTrue);
      });
    }
  # A fake declared in the test file.
  - |
    class _FakeClock implements Clock {
      @override
      DateTime now() => DateTime(2026);
    }

    void main() {
      test("expiry uses the clock", () {});
    }
  # An extension adding a driver action.
  - |
    extension on Panel {
      Future<void> retry() => tapOn(labeled("Retry"));
    }

    void main() {}
  # A top level getter computing a fixture.
  - |
    List<StartupDependency> get _dependencies => StartupDependency.values;

    void main() {}
  # A top level value holding a function.
  - |
    final _signIn = (WidgetTester tester) async {
      return tester.pumpPanel([signedIn(ada)]);
    };

    void main() {}
  # A local function in `main`, shared by several cases.
  - |
    void main() {
      Future<Panel> pumpReady(WidgetTester tester) => tester.pumpPanel([signedIn(ada)], at: _ready);

      testWidgets("startup shows the panel", (tester) async {
        await pumpReady(tester);
      });
    }
  # A function value in a group, outside every case.
  - |
    void main() {
      group("startup", () {
        final pumpReady = (WidgetTester tester) async {
          return tester.pumpPanel([signedIn(ada)]);
        };
        testWidgets("shows the panel", (tester) async {
          await pumpReady(tester);
        });
      });
    }
  # A top level function value whose arrow body ends in a call.
  - |
    final _signIn = (WidgetTester tester) => tester.pumpPanel([signedIn(ada)]);

    void main() {}
  # A local function value in `main` whose arrow body ends in a call.
  - |
    void main() {
      final signIn = (WidgetTester tester) => tester.pumpPanel([signedIn(ada)]);
      testWidgets("startup shows the panel", (tester) async {
        await signIn(tester);
      });
    }
  # A function value in a group whose arrow body ends in a member access.
  - |
    void main() {
      group("startup", () {
        final ready = (Panel panel) => panel.labeled("Retry").first;
        testWidgets("shows the panel", (tester) async {});
      });
    }
  # A helper in a closure that only wraps cases is outside every case.
  - |
    void main() {
      ["light", "dark"].forEach((theme) {
        Future<void> open(WidgetTester tester) => tester.pumpPanel([]);
        testWidgets("the panel opens in $theme", (tester) async => open(tester));
      });
    }
  # A call with a string and a body that is a group still collects cases only.
  - |
    void main() {
      group("startup", () {
        Future<void> open(WidgetTester tester) => tester.pumpPanel([]);
        testWidgets("shows the panel", (tester) async => open(tester));
      });
    }
