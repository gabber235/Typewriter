# docs/drive/game-verification/record.yaml: the working state of the in-game verification framework.
# Spike details: docs/design/game-verification/README.md and spikes/. Prototype code: git 86724c794
# (spikes J, K, N) and 9c9275f22 (earlier spikes). Old plan drafts (input only, git ignored):
# docs/plans/game-verification/ (design.md, directions.md, research-*.md, decisions/*.yaml).
goal: Prove what a player experiences in a real Minecraft client, as tests that run on every pull request, built in full before L3.

pieces:
  - id: paper-topology
    status: figuring-out
    open: How to make a restart requirement cheap, since restarts dominate suite time (P7 T1 faster boot, T2 checkpoint and restore)
    tries:
      - id: d1-one-client
        what: One client runs requirements in sequence
        taught: Simple, but the throughput is that of a single client
        state: dropped
        why: The pool of 4 warm clients was decided for group behaviour and throughput
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: d2-shared-paper
        what: Several clients run separate requirements on one Paper
        taught: Scales linearly when gated; wrong verdicts came only from broadcast chat and titles, fixed by per player effects and regions 1024 blocks apart. Tick rate, main thread lag and coverage still leak between attempts
        state: working
        evidence: [docs/design/game-verification/spikes/d-clients.md, CI runs 42184657603 42187755498]
      - id: d3-paper-per-group
        what: One Paper per few clients
        taught: The only way to isolate tick rate, main thread lag and coverage; best throughput was 2 Papers with 4 clients each
        state: working
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: shared-stepped-paper
        parent: d2-shared-paper
        what: Every attempt shares one Paper whose next tick waits for every claimed client and every claimed player's work
        taught: >-
          P1: 14 to 17 s per 1,000 requirements without restarts, 0 wrong verdicts in 36,000. One
          attempt's async work holds every attempt's tick (about 100 ms per attempt hit). Needs a fence,
          regions and approximate coverage. Lessons: count only acks of ticks after the stimulus (a stale
          ack passed a broken requirement), switch the client clock on the render thread.
        state: picked
        why: Picked by the developer from P1
        evidence: [docs/plans/game-verification/decisions/step-driver.yaml, "branch proto/gv-topology 1ec7bef6f: prototypes/game-verification/RESULTS.md", CI run 42345155973]
      - id: paper-per-attempt
        parent: d3-paper-per-group
        what: 4 long lived Papers, one per running attempt, wiped and reused; clients move for a group claim
        taught: >-
          P1: 2.3 times faster than shared with no groups and no restarts (6 s per 1,000), but every group
          claim moves clients (0.33 to 0.95 s each, holding that Paper): +390% at 10% groups, +777% at
          30%. Restart boots compete with three busy Papers: +41% at 1% restarts. An idle stepped Paper
          needs a keepalive tick or the watchdog stops it.
        state: dropped
        why: 41 to 777% slower once groups or restarts appear
        evidence: ["branch proto/gv-topology 1ec7bef6f: prototypes/game-verification/RESULTS.md", CI runs 42345155973 42339156447]
      - id: fresh-paper-per-attempt
        parent: d3-paper-per-group
        what: A fresh Paper per requirement, booted ahead while others run
        taught: P1 computed it. A boot costs 22 to 39 CPU s, so 1,000 requirements take 1.5 to 2.8 hours on 4 vCPU; matching shared would need about 850 booters
        state: dropped
        why: Hours per 1,000 requirements
        evidence: [docs/design/game-verification/spikes/k-restarts.md, docs/design/game-verification/spikes/c-speed.md]
      - id: k-own-paper-for-restarts
        what: A requirement that kills Paper runs on a Paper of its own
        taught: >-
          A kill drops every client on that Paper. P1: at 1% restart requirements, restarts are 82 to 89%
          of suite time (boot 8 to 14 s each, CPU bound, so parallel boots do not help); the other 990
          requirements finish in 20 to 27 s. AppCDS needs -XX:+AllowArchivingWithJavaAgent with the agent
        state: picked
        why: Decided by the developer from spike K
        evidence: [docs/design/game-verification/spikes/k-restarts.md, CI run 42345155973]
      - id: faster-boot
        parent: k-own-paper-for-restarts
        what: Cut Paper's boot with Java 25's AOT cache, AppCDS with the agent, a slim world and only needed plugins
        taught: Not tried
        state: trying
        evidence: []
      - id: checkpoint-restore
        parent: k-own-paper-for-restarts
        what: Restore a snapshot of a booted, empty Paper instead of booting
        taught: Not tried
        state: trying
        evidence: []

  - id: stepped-ticks
    status: figuring-out
    open: Stepping is proven for one subject. How it behaves with several attempts depends on paper-topology
    tries:
      - id: c2-faster-rate
        what: Run Paper faster than 20 TPS
        taught: Rate is server wide, and a tick window shrinks with the rate while wall clock async work does not
        state: dropped
        why: Replaced by stepped ticks
        evidence: [docs/design/game-verification/spikes/c-speed.md, docs/design/game-verification/spikes/d-clients.md]
      - id: wall-clock-fail-rule
        what: Fail only when the window barrier arrived and the player's counted work is quiet, at a fixed rate
        taught: Correct, but kept wall clock in the rule
        state: dropped
        why: Stepped ticks carry the rule inside the step
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: n1-vanilla-freeze
        what: Paper's tick manager frozen and stepped
        taught: Plugin tasks, players and the block break clock keep running on wall clock
        state: dropped
        why: Not a real freeze
        evidence: [docs/design/game-verification/spikes/n-stepped-ticks.md]
      - id: n2-step-agent
        what: A Java agent makes Paper's main loop wait for a permit; the client moves one tick per step ping
        taught: Exact windows, async work passes with no wall clock window, hung work fails at the 1 s limit, a few ms per requirement. Packet limiter, read timeout and watchdog must be relaxed
        state: picked
        why: Decided by the developer, as an agent on the stock Paper jar
        evidence: [docs/design/game-verification/spikes/n-stepped-ticks.md, CI runs 42304863563 42310014228]

  - id: perception
    status: figuring-out
    open: The live stream to the test JVM was never built (the spikes judged traces afterwards); its size and the HUD element names on drawn text are unmeasured
    tries:
      - id: a1-client-state
        what: Read the client's state
        taught: Many false positives on lying scenes
        state: dropped
        why: Only arranges scenes and names causes
        evidence: [docs/design/game-verification/spikes/a-observers.md]
      - id: a3-pixels
        what: Pixels in a region
        taught: Good for frames and goldens, weak as a verdict
        state: dropped
        why: Kept for goldens only
        evidence: [docs/design/game-verification/spikes/a-observers.md]
      - id: a2-drawn-plus-a4-visible
        what: "Seen means drawn legibly plus owns visible pixels"
        taught: Every verdict right on the lying battery, gated or rendered; new kinds cost no observer code
        state: picked
        why: The only honest pair
        evidence: [docs/design/game-verification/spikes/a-observers.md]

  - id: readiness-and-done
    status: figuring-out
    open: Which side counts Typewriter's work for the done signal (Paper only, or Paper plus a test side hook); decided with layers 3 and 6
    tries:
      - id: e-bare-barrier-and-chunk-signals
        what: A bare echo barrier, or chunk and mesh signals
        taught: A bare barrier is wrong when effects are delayed; chunk signals fire early
        state: dropped
        why: Wrong verdicts
        evidence: [docs/design/game-verification/spikes/e-readiness.md]
      - id: e3t-window-barrier
        what: Read the fact every client loop, pass when it holds, fail at a barrier after the window in ticks
        taught: No wrong verdicts; a pass costs nothing beyond the truth
        state: picked
        evidence: [docs/design/game-verification/spikes/e-readiness.md, CI run 42174196154]
      - id: per-subject-work
        what: Engine and realm count work per player; the step waits until it is quiet; hung work is reported after 1 s and never cancelled
        taught: Replaces server wide quiet and counted dispatchers
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/d-clients.md, docs/design/game-verification/spikes/i-coverage.md]

  - id: input
    status: figuring-out
    open: Moving XTest from the runner into the client mod (through Java's foreign function API) is untried
    tries:
      - id: j-packets-and-game-actions
        what: Send packets, or call the game's own actions
        taught: Packets miss aim and get kicked when walking; game actions never match typed tab completion
        state: dropped
        why: Not what a player does
        evidence: [docs/design/game-verification/spikes/j-input.md]
      - id: j-window-events
        what: Real window events (XTest on Linux, SDL queue push on the Mac)
        taught: Same server events as direct handler calls on all 17 inputs, gated or rendered; typed suggestions sometimes get no reply
        state: picked
        evidence: [docs/design/game-verification/spikes/j-input.md, CI runs 42211818480 42215647584 42218505138]

  - id: client-pool
    status: figuring-out
    open: How a claim moves clients between Papers depends on paper-topology
    tries:
      - id: fresh-client-per-requirement
        what: Boot a client per requirement
        taught: A boot costs far more than a requirement
        state: dropped
        why: Unaffordable
        evidence: [docs/design/game-verification/spikes/s0-real-client-on-paper.md, docs/design/game-verification/spikes/c-speed.md]
      - id: fresh-identity
        what: A new player identity per requirement
        taught: Leaked nothing but costs a join per requirement
        state: dropped
        why: Replaced by the full wipe
        evidence: [docs/design/game-verification/spikes/k-restarts.md]
      - id: full-wipe
        what: Wipe all 17 kinds of player state between requirements, on warm clients
        taught: Leaked nothing; the obvious partial wipe leaked 11 kinds
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/k-restarts.md, CI run 42235574190]
      - id: leave-like-pause-menu
        what: Reconnect by leaving like the pause menu, then joining
        taught: The earlier client side close made Paper keep the old player for about 30 s
        state: picked
        evidence: [docs/design/game-verification/spikes/k-restarts.md]

  - id: requirement-shape
    status: figuring-out
    open: How several test compilations (modules, later extensions) share one warm pool, since one JVM takes one testBalloon compilation; IDE single runs unchecked
    tries:
      - id: fabric-client-gametest
        what: Fabric's client game test API as the runner
        taught: Test code runs inside one client, sequentially, against an in process server; no external server API
        state: dropped
        why: Conflicts with real Paper, several clients and a test JVM
        evidence: [docs/design/game-verification/research/real-client-precedent.md]
      - id: g2-await-and-g3-timeline-only
        what: Await style, or judge only the recorded timeline afterwards
        taught: Await silently grows limits; timeline only waits its whole recording on every pass
        state: dropped
        evidence: [docs/design/game-verification/spikes/g-requirement-shape.md]
      - id: g1-windows-plus-timeline
        what: Every check in a within(n.ticks) window from the last stimulus; order and gaps from the timeline
        taught: Fits one mechanism, the streamed perception with the barrier inside it
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/g-requirement-shape.md]
      - id: root-compilation
        parent: runner-c-testballoon
        what: One root compilation reads every module's gameTest folder
        taught: P2 proved 200 tests, one JVM, one scheduler; works only inside one Gradle build, so not for extensions built elsewhere
        state: working
        evidence: ["branch proto/gv-testballoon: services/prototypes/gv-testballoon/evidence/root"]
      - id: classloader-per-compilation
        parent: runner-c-testballoon
        what: One JVM loads each compilation in its own class loader and runs testBalloon per loader; scheduler and pool in the shared parent loader
        taught: Not tried
        state: trying
        evidence: []
      - id: pool-process
        parent: runner-c-testballoon
        what: The warm pool and scheduler run as their own process; every test JVM (module, extension, IDE run) submits to it
        taught: Not tried; would also let an IDE run reuse warm clients instead of booting them
        state: trying
        evidence: []
      - id: runner-a-and-b
        what: Tests in a pool (A), or requirement values run by the framework (B)
        taught: A shows flaky as green; B loses the IDE gutter and test filters
        state: dropped
        evidence: [docs/plans/game-verification/directions.md]
      - id: runner-c-testballoon
        what: Declared in testBalloon with a needs header; a framework scheduler runs, retries and reports
        taught: >-
          P2: works. 200 mirror tests submit at once (1.08 of ideal), flaky shows as failed, --tests
          selects before submission (testBalloon path syntax), finish runs after every test. One JVM
          holds one test compilation only (fixed JvmEntryPoint class name), so every module's
          requirements must compile together. A failure in finish is silent in testBalloon; xtask
          must gate on TestRun being written. The flaky error must carry the body's frame first.
        state: picked
        why: Decided by the developer
        evidence: [docs/plans/game-verification/directions.md, "branch proto/gv-testballoon 7a77e7ba3: services/prototypes/gv-testballoon/FINDINGS.md"]

  - id: video
    status: figuring-out
    open: Rendering several frames per stepped tick (Frames.Motion) was never tried; video and stepping both drive the client clock
    tries:
      - id: b2-window-capture
        what: Capture the window
        taught: Up to 16 frames off, no sync
        state: dropped
        evidence: [docs/design/game-verification/spikes/b-video.md]
      - id: b3-packet-replay
        what: Record packets, render offline on demand
        taught: Not worth building
        state: dropped
        evidence: [docs/design/game-verification/spikes/b-video.md]
      - id: b1-readback-demo-rerun
        what: In client readback to ffmpeg, recorded in a demo rerun, never in the gated suite
        taught: Clip lines up with facts; same verdict in every rerun
        state: picked
        evidence: [docs/design/game-verification/spikes/b-video.md, CI run 42111131229]

  - id: goldens
    status: figuring-out
    open: CI setup cost of the devenv e2e shell (300 to 480 s per job on an uncached branch)
    tries:
      - id: tolerant-compare
        what: SSIM, blur or threshold comparison
        taught: Every tolerant method missed a colour off by 3
        state: dropped
        evidence: [docs/design/game-verification/spikes/f-goldens.md]
      - id: devenv-mesa
        parent: exact-on-pinned-runner
        what: The same goldens on devenv's Mesa 26.2.5
        taught: >-
          P5: one hash per scene across 6 CPU models on Vulkan and 4 on OpenGL, 0 differing identical
          pairs, every small break caught. The Mesa upgrade changed all 18 goldens (off by 1 level at
          far edges), so upgrades rebuild goldens as decided. The profile also needs libglvnd and the X
          libraries; building the devenv shell cost 300 to 480 s per job without the Nix cache.
        state: working
        evidence: ["branch proto/gv-goldens 82b1cdf0a: prototypes/game-verification/RESULTS.md", CI runs 42343076555 42344338415]
      - id: exact-on-pinned-runner
        what: Exact comparison, approved from the runner's own frames, hash in the repo and PNG on the evidence branch
        taught: Zero differing pixels across repeats and CPU models with the knobs on
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/f-goldens.md]

  - id: coverage
    status: figuring-out
    open: Attribution with several attempts on one Paper is approximate; exact with a Paper per attempt (paper-topology)
    tries:
      - id: plain-or-tcp-dump
        what: Dump after each requirement, or over TCP
        taught: Late work goes to the wrong requirement; TCP costs 41 ms
        state: dropped
        evidence: [docs/design/game-verification/spikes/i-coverage.md]
      - id: i3-read-reset-in-plugin
        what: JaCoCo limited to plugin classes, read and reset inside the plugin after work is idle
        taught: Correct attribution at no measurable cost
        state: picked
        evidence: [docs/design/game-verification/spikes/i-coverage.md, CI run 42162248604]

  - id: results-and-ci
    status: figuring-out
    open: none beyond the pieces above; the TestRun additions follow from them
    tries:
      - id: xtask-reruns
        what: Let xtask rerun failed requirements as for other suites
        taught: Each rerun would boot the clients again (results.rs:174)
        state: dropped
        why: Retries run inside the test JVM on warm clients
        evidence: [docs/plans/game-verification/research-xtask.md]
      - id: free-runner
        what: The free GitHub runner, 4 vCPU, software rendering
        taught: Holds the gated clients with the same throughput as the Mac
        state: picked
        evidence: [docs/design/game-verification/spikes/h-ci-runner.md]

  - id: build
    status: figuring-out
    open: Which of P3's build file fixes to adopt, and how CI caches Loom (about 700 MB) and the patched Paper (about 216 MB)
    tries:
      - id: one-services-build
        what: Loom client mod, patched Paper jar, framework plugin, agent and gameTest all inside the services Gradle build
        taught: >-
          P3: works, no included build, configuration time unchanged (new projects 31 ms), configuration
          cache holds. Needed three existing build file changes: run-task in build-logic (detekt puts an
          old kotlinx-serialization on every project's parent loader, and two run-paper projects clash),
          Kover must skip gameTest (koverVerify depends on every Test task), coverage-merge must add only
          Kover projects. Patching Paper stays in check while the plugin compiles against it.
        state: working
        evidence: ["branch proto/gv-build abad68436: services/playtest/FINDINGS.md, services/playtest/evidence/"]

decided:
  - id: real-clients-only
    what: Real clients only, no packet level tier; stimuli are player input or API, not chat commands; full suite on every pull request
  - id: framework-holds-no-typewriter
    what: The framework holds no Typewriter code and may later move out
  - id: tick-clock
    what: Cinematics, sequences and engine step timing count ticks, not wall clock; each engine keeps a live StepClock per step
  - id: groups-and-pool
    what: Group behaviour must be testable, and requirements share a pool of 4 warm clients
  - id: full-wipe
    what: Each requirement gets a full wipe of its player; the realm gets a general purge of a subject's data
  - id: runner-steps-ticks
    what: The test runner decides when a tick happens, as a Java agent on the stock Paper jar
  - id: retries
    what: A failed requirement is retried later, up to 3 times; a pass on a retry is flaky and blocks the pull request like every suite; lossy inputs may repeat inside the window
  - id: full-framework-first
    what: The full framework is built first, before L3
  - id: per-subject-done
    what: Done and fail signals use a per subject view; hung work is reported by a 1 s wall clock limit, never cancelled
  - id: clips
    what: Video clips go to failing requirements plus requirements the pull request touches, from coverage
  - id: goldens
    what: A frame that differs from its golden fails; goldens are exact on the pinned runner; the repo holds a hash, the PNG lives on the evidence branch; approve takes the PR's CI frames
    why: Mesa or Minecraft upgrades rebuild the goldens in the weekly upgrade pull request
  - id: windows
    what: Requirements are G1 windows plus the recorded timeline; a window counts from the last action or probe call
  - id: never-needs-positive
    what: never checks are broad, and a requirement needs one positive check
  - id: test-jvm
    what: Requirement code runs in a test JVM; the client streams what its player perceived
  - id: testballoon-runner
    what: Requirements are declared in testBalloon with a needs header; the framework scheduler runs them and writes TestRun
  - id: one-gametest-task
    what: One root gameTest task runs every module's requirements in one JVM; cargo xtask e2e game runs it
  - id: topology-by-speed
    what: Prototype both topologies, then decide. The prototypes report how much slower each is at 1,000 to 2,000 tests; 10% slower is fine, 20% is already rough, over 50% is probably a no go
    why: Thousands of small tests; slow feedback makes every later drive worse over time
  - id: all-prototypes-in-waves
    what: Run all proposed prototypes (P1 to P5), just not all at the same time
  - id: p6-pool-process
    what: Prototype a separate pool process that every test JVM (modules, extensions, IDE runs) submits to, faked without Minecraft
  - id: shared-topology
    what: "A: shared stepped Paper"
    why: P1, a Paper per attempt is 41 to 777% slower once groups or restarts appear
  - id: p7-restart-tries
    what: Prototype T1 faster boot and T2 checkpoint and restore for restart requirements
  - id: tests-beside-code
    what: Tests are placed where it makes sense; in the future each extension and every entry is tested
  - id: deferred-l-m
    what: Spikes L (1.21.4 client) and M (dialogue redraws) are deferred from the first working version

open:
  - id: quiet-hook
    ask: The old draft dropped the test side quiet hook (done signal from Paper's SubjectWork only). Keep that?

