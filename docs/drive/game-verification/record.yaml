decided:
  - id: real-clients-only
    what: Real clients only, no packet level tier; stimuli are player input or API, not chat commands; full suite on every pull request
  - id: framework-holds-no-typewriter
    what: The framework holds no Typewriter code and may later move out
  - id: tick-clock
    what: Cinematics, sequences and engine step timing count ticks, not wall clock; each engine keeps a live StepClock per step
  - id: groups-and-pool
    what: Group behaviour must be testable, and requirements share a pool of 4 warm clients
  - id: full-wipe
    what: Each requirement gets a full wipe of its player; the realm gets a general purge of a subject's data
  - id: runner-steps-ticks
    what: The test runner decides when a tick happens, as a Java agent on the stock Paper jar
  - id: retries
    what: A failed requirement is retried later, up to 3 times; a pass on a retry is flaky and blocks the pull request like every suite; lossy inputs may repeat inside the window
  - id: full-framework-first
    what: The full framework is built first, before L3
  - id: per-subject-done
    what: Done and fail signals use a per subject view; hung work is reported by a 1 s wall clock limit, never cancelled
  - id: clips
    what: Video clips go to failing requirements plus requirements the pull request touches, from coverage
  - id: goldens
    what: A frame that differs from its golden fails; goldens are exact on the pinned runner; the repo holds a hash, the PNG lives on the evidence branch; approve takes the PR's CI frames
    why: Mesa or Minecraft upgrades rebuild the goldens in the weekly upgrade pull request
  - id: windows
    what: Requirements are G1 windows plus the recorded timeline; a window counts from the last action or probe call
  - id: never-needs-positive
    what: never checks are broad, and a requirement needs one positive check
  - id: test-jvm
    what: Requirement code runs in a test JVM; the client streams what its player perceived
  - id: testballoon-runner
    what: Requirements are declared in testBalloon with a needs header; the framework scheduler runs them and writes TestRun
  - id: one-gametest-task
    what: One root gameTest task runs every module's requirements in one JVM; cargo xtask e2e game runs it
  - id: topology-by-speed
    what: Prototype both topologies, then decide. The prototypes report how much slower each is at 1,000 to 2,000 tests; 10% slower is fine, 20% is already rough, over 50% is probably a no go
    why: Thousands of small tests; slow feedback makes every later drive worse over time
  - id: all-prototypes-in-waves
    what: Run all proposed prototypes (P1 to P5), just not all at the same time
  - id: p6-pool-process
    what: Prototype a separate pool process that every test JVM (modules, extensions, IDE runs) submits to, faked without Minecraft
  - id: shared-topology
    what: "A: shared stepped Paper"
    why: P1, a Paper per attempt is 41 to 777% slower once groups or restarts appear
  - id: p7-restart-tries
    what: Prototype T1 faster boot and T2 checkpoint and restore for restart requirements
  - id: pool-process
    what: Test JVMs share a separate pool process
    why: Modules and extensions share warm clients; single runs take 2 s, not 20 s
  - id: tests-beside-code
    what: Tests are placed where it makes sense; in the future each extension and every entry is tested
  - id: restart-faster-boot
    what: "T1 faster boot (Recommended)"
    why: 5.0 s kill to state on the normal Java 25, works on the Mac
  - id: p8-p9-p10
    what: Run P8 suite speed with frames, P9 video under stepping and P10 input from the client
  - id: perception-no-drawing
    what: "A. No drawing (Recommended)"
    why: P8, a frame every tick is +408%, +53% with every lever
  - id: build-in-nine-slices
    what: "Yes, start slice 1 (Recommended)"
    why: Every piece has a proven direction; the walking skeleton proves the parts fit end to end
  - id: p3-build-fixes-in-slice-1
    what: "Yes, in slice 1 (Recommended)"
    why: run-task in build-logic, Kover skips gameTest, coverage merge takes only Kover projects
  - id: keep-slice-1-decisions
    what: "Keep them, start slice 2 (Recommended)"
    why: The wire project, records that hold until the next one, and separate Joined and Ready signals stay
  - id: non-text-perception
    what: "D. Stream more perception (Recommended)"
    why: Inputs whose result is not drawn text are checked on camera, items, blocks and entities from A2. Checks read what the player perceives; a Paper event channel would be a second source of truth
  - id: general-probes
    what: "A. General probes (Recommended)"
    why: probe.give, probe.gameMode, probe.block and the like live in the framework plugin. Every requirement shows what it sets up, and extensions build on the same probes
  - id: probe-done-at-client
    what: "A. Client has the effect (Recommended)"
    why: A probe returns only once its effect reached the client (chunks sent, command tree sent); Paper steps until then, so requirement code never waits for readiness
  - id: keep-slice-2-built-decisions
    what: "Keep them (Recommended)"
    why: Busy flag on the step ack, input window from the tick before its first event, watches only for probe placed things, name tag reactions, becomes and gone need a change, prioritizeChunkUpdates 2, a floor per requirement, ProbeFailed and InputFailed, retype in the client
  - id: keep-slice-2-last-decisions
    what: "Keep, start slice 3 (Recommended)"
    why: Probes wait for chunks within the client's view distance, a bedrock layer under the void world, only the command sending pool watched as an async sender; slice 3 also takes relative spots, a matched view distance and the chat toast
  - id: wipe-proof-back-to-back
    what: "A. Back to back in the kit (Recommended)"
    why: A test fixture runs two attempts on the same clients through the pool; no public ordering API
  - id: wipe-split-by-owner
    what: "A. Split by owner (Recommended)"
    why: The framework wipes vanilla and Paper player state (spike K's kinds plus recipes and advancements); each plugin resets what it owns (stored values, attached permissions, metadata it set, sessions, mail) through a reset hook the framework calls, later Typewriter's realm purge; no reflection; unseen kinds are proven by a query probe only the framework's own tests use
  - id: keep-slice-3-built-decisions
    what: "Keep them (Recommended)"
    why: PlayerWipeEvent as the reset hook, Reclaim for back to back, regions never reused, attempts kept apart (players hidden, chat per attempt), Declined for requirements the pool can never run, pool size from -Pplaytest.clients
  - id: last-damage-cause-server-call
    what: "A. Server call, fix comment (Recommended)"
    why: Bukkit's Entity.setLastDamageCause is deprecated for removal and internal, so the wipe keeps calling the server's own player, like its other wipes; replaces an earlier pick made on the belief that a public API existed
  - id: start-slice-4
    what: You can start slice 4
  - id: claim-side-by-side-together
    what: "A. Claim them together (Recommended)"
    why: The pool grants side by side attempts' players at the same moment; holding one while the partner queued behind a group of 4 deadlocked run 4
  - id: frozen-client-5s
    what: "A. 5 s framework limit (Recommended)"
    why: A client that has not acked for 5 s of wall clock counts as lost; about 18 times the worst stall seen, and provable by freezing a client
  - id: hold-out-hung-players
    what: "A. Hold it out (Recommended)"
    why: A player whose work hung leaves the pool until that work ends, is wiped again, then returns; nothing is cancelled. A replacement client keeps the same player name, so it would not escape the work; a player whose work never ends stays out for the rest of the run and the run says so
  - id: keep-slice-4-built-decisions
    what: "Keep, start slice 5 (Recommended)"
    why: One Queue message per side by side group, a partner lost before its lease requeues alone, hold reasons apart from attempts, only acked clients watched, never ending hung work noted on the failing case
  - id: keep-slice-5-built-decisions
    what: "Keep them (Recommended)"
    why: Kotlin decides retries and fails the mirror test, Rust judges every runner's run file for the gate; each rule has its own unit tests
  - id: flaky-proof-in-unit-tests
    what: "A. Unit tests and evidence (Recommended)"
    why: VerdictTest and the gate tests cover the rule and the real run proof with a temporary FLAKY-1 stays recorded; no hidden requirement path in the runner
  - id: measure-lease-time-beside-slice-6
    what: "C. Both in parallel (Recommended)"
    why: Grant to lease costs about 1.2 s per requirement with an unknown cause; a subagent splits it into timed parts and only reports while slice 6 builds, and the fix is chosen afterwards
  - id: lease-time-fixes
    what: "Fixes 1, 2 and 3"
    why: The test Paper turns off the chunk send and load caps, a claim waits only for the chunks the client draws plus the neighbour ring it needs to draw them, and Paper loads the next few regions during earlier attempts; regions are still never reused
  - id: free-clients-in-step
    what: "Keep free clients in step (Recommended)"
    why: A free client fell up to 235 ticks behind and stalled every attempt once claimed; every player gets step pings, one rule, lost clients still go after 5 s
  - id: goldens-on-the-runner-only
    what: "E, also ci should work again. If not we can try to move to namespace"
    why: The Mac renders different pixels, so goldens stay exact on the pinned runner only; compare, hashing, diff and approve are built now and the Mac reports a golden as not checked; the first real green comes with CI, on Actions or else Namespace runners
  - id: a4-threshold-share
    what: "Share of the frame (Recommended)"
    why: A pixel count means 4x less area on the Mac window than on the runner; a share of the frame means the same on every window size
  - id: pin-client-graphics
    what: "Pin custom settings (Recommended)"
    why: The default FANCY preset overrides renderDistance 2 with 3 at start (Minecraft.java:576), so a move waits for 81 chunks; graphicsPreset custom with render distance 2 cuts that and keeps a preset change from moving the goldens; built after slice 6 merges, before any golden hash exists
  - id: ring-proof-probe-3
    what: "Tighten PROBE-3 (Recommended)"
    why: PROBE-3 passes even without the neighbour ring; checking on the first tick after the move, with and without the ring, shows whether the ring is needed, without a build change
  - id: wipe-resets-blends
    what: "A. The wipe resets them (Recommended)"
    why: A golden frame showed the place the player came from, because the client blends sky, fog, rain level and rain fog over ticks (a rain fade lasts about 100 ticks); the client wipe resets them, proven back to back like every other wipe kind
  - id: draw-at-end-of-tick
    what: "Draw at end of tick (Recommended)"
    why: The stepped clock drew at partial tick 0, so every blended value and entity position showed the previous tick; drawing at partial tick 1 makes a frame and a perception record show the same tick
  - id: only-check-in-xtask
    what: "A. xtask owns the check (Recommended)"
    why: Gradle fails a gameTest module that matches no --tests filter; xtask already fails any id that matches no case in the whole run, so every gameTest task turns off failOnNoMatchingTests and selection uses testBalloon's own filter
  - id: keep-slice-6-built-decisions
    what: "Keep, approve runner only (Recommended)"
    why: Rain and thunder stay with Paper's wipe, the wipe also resets the FOV ease and clients set fovEffectScale 0; approve refuses frames not made on the pinned runner, so no Mac golden slips in
  - id: mesa-pin-from-devenv
    what: "B. devenv exports it (Recommended)"
    why: The pinned Mesa version comes from the Mesa devenv ships, so it cannot drift from nixpkgs; on the pinned runner a golden made on another renderer fails with re-approve, never quietly not checked, so a Mesa bump makes the weekly upgrade pull request re-approve
  - id: renderer-has-os
    what: "Add os (Recommended)"
    why: A renderer names the OS so the pin says Linux outright instead of relying on no other OS matching Vulkan, llvmpipe, Mesa and CPU
  - id: keep-slice-6-built-decisions
    what: "Keep, missing golden fails (Recommended)"
    why: The wire's Request, PaperRequest and ClientRequest mirror Reply; on the pinned runner a missing golden fails with the approve command instead of not checked, since the game runs in CI only from slice 9, which approves the first goldens
  - id: steadiness-beside-slice-7
    what: "Steadiness first, slice 7 beside (Recommended)"
    why: GOLDEN-3 flaked once and tick counts vary between runs (BREAK-1 6 to 11), which a stepped design should repeat exactly; the speed builder proves the PROBE-3 ring, fixes the missing golden and finds why runs vary (measure, then a choice), while slice 7 builds
  - id: steadiness-fixes
    what: "Build all four (Recommended)"
    why: Runs varied from four causes; the client wipe resets the break delay, Paper's async chat counts as player work, and the client holds its ack until a pending input is handled and its visible section set is current; two existing rules, no change to how Paper or Minecraft behave
  - id: keep-chat-chain-hook
    what: "Keep it (Recommended)"
    why: Paper's public AsyncChatEvent fires after the packet read, so a tick could slip in; the plugin appends to the player's private chat chain on the pinned Paper and fails loudly at load if it is gone
  - id: remove-visible-set-hold
    what: "Remove until proven (Recommended)"
    why: GOLDEN-3 flaked once in 7 full runs and never in 25 since, with or without the fix; no code without a failing test, and one less Minecraft hook
  - id: keep-slice-7-built-decisions
    what: "Keep them (Recommended)"
    why: The step agent retransforms classes the AOT cache loaded before premain and no longer joins the boot class path; both Papers launch from Paper's class path; one fresh Paper per restart attempt, players resumed without a wipe; the cache is trained on a restart boot and kept only after a clean halt
  - id: rules-per-paper
    what: "Yes, one per Paper (Recommended)"
    why: The restart Paper has a rules class while the shared Paper's rules sit in about 8 branches in Pool; every Paper gets a rules object and Pool forwards each event to its server's rules
  - id: watch-with-the-probe
    what: "A. Watch with the probe (Recommended)"
    why: SEEN-1 and SEEN-4 drifted between 2 and 4 ticks because Watch and Look went over the pool link after the probe was done; Paper sends the watch on the player's own connection ahead of the spawn so the check holds when the entity shows; the cost of starting looks at the probe is measured first
  - id: find-tab-1-cause
    what: "Find the cause (Recommended)"
    why: TAB-1's first window took 1 to 9 ticks under load, close to its window; measure, then a choice
  - id: watched-means-measured
    what: "Keep it (Recommended)"
    why: The watch travels with the probe on Paper's connection and the client measures pixels of every watched entity from the probe until the wipe; no look step, 0.6 to 0.7% of the suite against 0.1% for visible() entities only
  - id: type-like-a-person
    what: "A. Type like a person (Recommended)"
    why: Paper answers suggestions on 4 threads and keeps only the last request it saw, so a burst of keys got a stale answer and a retype after 6 ticks; typing sends one key per tick and a suggestion request counts as player work until Paper answers
  - id: find-break-2-flake
    what: "Yes, find the cause (Recommended)"
    why: BREAK-2, the first attempt on a freshly joined client, aimed 19.8 degrees past its target once in 3 full runs; it may come from the new packet hold or an ungrabbed mouse
  - id: record-right-after-tick
    what: "Record right after tick (Recommended)"
    why: The record of tick 7 was taken after the next key cleared the suggestion list, so TAB-1 held at 8; the client takes its record right after the tick and only its ack waits for its own pending input
  - id: only-own-input
    what: "A. Only own input (Recommended)"
    why: BREAK-2 turned 132 px sideways that the playtest never sent, likely the real cursor over a background client window; the client marks the events the playtest pushes and, while stepping, drops and logs every other mouse and key event
  - id: deferred-l-m
    what: Spikes L (1.21.4 client) and M (dialogue redraws) are deferred from the first working version

open:
  - id: quiet-hook
    ask: The old draft dropped the test side quiet hook (done signal from Paper's SubjectWork only). Keep that?

slices:
  - id: walking-skeleton
    status: done
    what: 1 client, stepped Paper, perceive stream, within and sees chat, pool process, TestRun, cargo xtask e2e game
    green: PROBE-1 passes; WINDOW-1 proves a check that never holds fails after its window, naming the tick and what the player perceived
    evidence: [commits d855a4f70 5808d8113 bd431c724 3234d522f, "cargo xtask e2e game on 5d519e4b8: 2 passed, .xtask/results/game/test_run.json"]
    taught: >-
      A seventh project, :playtest-wire, holds the wire every part shares. A record stands for every
      tick until the next one, so a record from before a window shows the window's first tick. The
      client signals Joined (Paper starts stepping) apart from Ready (it takes a lease); without it the
      first lease after boot raced the first step ping. Paperclip cannot see the agent's classes, so
      the agent puts its jar on the bootstrap path. Gaps: every case is written as happy_path (no way
      to declare demonstrates yet); no run file when the game cannot boot; RunRecords was not built
      test first; commits need the devenv shell for rustfmt.
  - id: input-from-the-client
    status: done
    what: type, click, look and use through XTest per display and SDL on the Mac; retype for lost suggestions
    green: spike J's 18 inputs as requirements, plus PROBE-2 (a probe is done once the client holds its effect)
    evidence: [commits 61a922c3e a0563d116, "cargo xtask e2e game on a0563d116: 21 passed, .xtask/results/game/test_run.json"]
    taught: >-
      Non text results are checked on the camera, GUI items, watched blocks and watched entities.
      A probe's done waits until a tick ends with nothing left to send to its player (chunks within
      the client's view distance, Paper's command sending pool idle), then a marker task. Probes let
      time pass, so the void world needs a bedrock layer. Flipping one expectation in eight
      requirements made seven fail with a clear report. Gaps: the Linux XTest path is built but
      unproven until slice 9; tests first slipped for Aim, Retype and the GUI item rule; each
      requirement hand picks its spot coordinates (regions in slice 3 should make spots relative);
      a dead client stops acking and lockstep waits forever (slice 4); the pool's view distance 10
      makes Paper send chunks a distance 2 client never draws; the game suite has no --only or
      --repeat (slice 5); heavy lock waits make each check 15 to 35 minutes.
  - id: pool-of-four-and-groups
    status: done
    what: claims, regions with relative spots, never checks, full wipe, leave like the pause menu, rotation between test JVMs, matched view distance, no chat toast
    green: a group of 3; no leak in 17 kinds
    evidence: [commits ca7937f18 c25684983 d6382fcbe 69f3fbb49 95bae3945 67a7e096d, "cargo xtask e2e game on 244542090: 69 passed, .xtask/results/game/test_run.json"]
    taught: >-
      Four clients run up to four attempts at once, each in a region of its own, with head
      reservation for groups; a pool of one declines a group of 3 with its reason. Every gameTest
      task of a build shares one pool, which takes turns between them. The wipe is split by owner:
      the framework wipes 18 vanilla and Paper kinds (spike K's plus recipes, advancements, game mode,
      held slot), and plugins reset their own through PlayerWipeEvent. A back to back fixture
      (Reclaim) proves each kind, and every kind failed with its wipe off. Vanilla grants the
      crafting table recipe and its advancement at once, so those checks look for one marked item.
      A sweep added 24 more kinds (health, food, flight, attributes, spawn point, statistics, open
      container, riding, fire, freeze, cooldowns, appearance and more), each with its own leak
      requirement; one enum, PaperState, holds each kind's wipe, mark and check. Plugin owned:
      keyless boss bars, custom cooldown groups and anything that exists only as packets a plugin
      sent. Leaked state breaks unrelated requirements (ENTITY-3 failed in the red run). Open: a
      plugin registered attribute cannot be removed; the setLastDamageCause call uses the server's own
      player because the Bukkit method is deprecated for removal; the game suite
      still takes no --only or --repeat (slice 5).
  - id: done-and-hung-work
    status: done
    what: per player quiet in the step, 1 s hung report, a dead client fails its attempt and is replaced; Paper side counting only (the test side hook stays open for layers 3 and 6)
    green: an async lookup passes; a hung one is reported; a killed client fails only its attempt
    evidence: [commits 25e49ff86 071c99eef, "cargo xtask e2e game on 071c99eef: 82 passed, .xtask/results/game/test_run.json"]
    taught: >-
      Plugins report work per player through a public PlayerWork API; the next tick waits while it
      runs, and work past 1 s fails its attempt. Side by side attempts travel in one Queue message and
      get their leases together. Claims tracks why a player is out (lost client, hung work) apart from
      the attempt holding it. A client silent for 5 s is lost and replaced; in a stepped Paper the
      keepalive timeout never fires, so the 5 s limit is the only bound short of the watchdog. A hung
      player sits out until its work ends; work that never ends is noted on the failing case. Each
      rule was seen failing first. LEAK-1 depends on timing (work must outlast the next reclaim).
      Long windows step at 13 to 33 ms per tick. Median per requirement unchanged (about 1.2 s).
      Open: xtask can report a pass from a sibling session's run file when a test JVM is killed
      (slice 5).
  - id: retries-and-results
    status: done
    what: retries at the queue end, Flaky, quarantine, xtask gate on TestRun (no run file, sibling run files), --only and --repeat, demonstrates, attempt steps with times and a measured breakdown of where time per requirement goes
    green: a flaky probe blocks the run
    evidence: [commit 443541aab, "cargo xtask e2e game on 443541aab: 82 passed (67 happy path, 11 failure, 4 edge case), .xtask/results/game/test_run.json", "three fresh full runs and --repeat 3 green in the slice thread"]
    taught: >-
      A failed attempt runs again at the queue end, up to 4 attempts; a pass after a failure is Flaky
      and fails both the mirror test (body frame first) and the xtask gate; GameUnavailable and
      refusals never retry; side by side groups retry whole. Quarantine runs once and never blocks. A
      killed test JVM now records its unfinished cases as failed and xtask exits 1, so a sibling's run
      file can no longer pass a run. The verdict rule lives twice: Kotlin decides retries and fails the
      mirror test, Rust judges every runner's run file for the gate. The flaky end to end proof used a
      temporary FLAKY-1 outside the repo. Each attempt records steps with times. With all tests submitted
      at once, the queue wait is about 96% of an attempt; of the time an attempt holds its players, the
      grant to lease step (wipe plus the move into the region) takes a median of about 1.2 s, against
      about 18 ms for the wipe itself in spike K; probes take a median of 64 ms, windows 52 ms, inputs 16 ms.
  - id: pixels
    status: done
    what: A4 on demand, goldens on devenv Mesa
    green: an entity behind a wall is not seen; a sidebar golden
    evidence: [commits d1bfaf7cb c79a80861 68b78c1ca, "cargo xtask e2e game on 68b78c1ca: 92 passed first attempt, grant to lease median 472 ms", "slice thread: 6 green full runs in a row after one GOLDEN-3 flake; --only GOLDEN-1 and --only NOPE-1 behave"]
    taught: >-
      visible() costs 30 to 80 ms per asking requirement and about 0.25% of the suite. Golden frames
      carried the previous place through blended fog, sky and FOV values and a one tick late draw; the
      wipe now resets the blends and clients draw at the end of the tick. Drawn frames used the lightmap
      from client launch because perceive frames used up its update; fixed. Goldens hash exactly, record
      their renderer (with os), and compare only on the pinned runner (Linux, amd64, Vulkan, llvmpipe, the
      Mesa devenv ships); the Mac reports not checked, so golden requirements prove nothing there until
      slice 9. The custom graphics preset makes render distance 2 real: a claim now waits for 49 chunks.
      Open: GOLDEN-3 flaked once under full suite load (cause unknown); tick counts vary between runs
      (BREAK-1 6 to 11); a missing golden on the pinned runner still reports not checked; "no session
      opened" is inferred from the pool log; the driver token is unseen on a real runner; weather is not
      pinned.
  - id: restart-paper
    status: done
    what: fast boot flags, AOT cache training, clients gated during boot
    green: a deposit survives a killed Paper
    evidence: [commits f1a5ac210 8effd83c5, "slice thread: three fresh full runs, 95 passed each", "cargo xtask e2e game on 8effd83c5: 95 passed first attempt; restarts about 11 s while the cache trained"]
    taught: >-
      requirement(restartsPaper = true) with restartPaper() runs on a fresh Paper of its own; its players
      move there by Connect and are resumed without a wipe after a kill. Kill to every player back is 5.3
      to 6.7 s on the Mac from the cache (P7 5.0 s), about 10.3 s on a boot that trains the cache; three
      restart requirements add about 11 s to the suite. With an AOT cache the JVM loads MinecraftServer
      before premain, so the step agent's prefixes silently missed and Paper stopped itself; the agent no
      longer joins the boot class path and retransforms classes already loaded, and both Papers launch
      from Paper's class path. The cache is trained on a restart boot, kept only on a clean halt, keyed
      on JDK, files and flags. Every Paper now has a rules object behind PaperRules and Pool forwards events to it (6e5128c00, 0 own branches left). Every way an attempt ends tells its Paper's rules (ba28ff607), and each restart Paper and folder is named after its attempt (fe4f66b9e). Open: a training Paper's halt prints a watchdog dump; 4 restarts at once could
      starve the shared Paper.
