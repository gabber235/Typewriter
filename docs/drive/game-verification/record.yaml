# docs/drive/game-verification/record.yaml: the working state of the in-game verification framework.
# Spike details: docs/design/game-verification/README.md and spikes/. Prototype code: git 86724c794
# (spikes J, K, N) and 9c9275f22 (earlier spikes). Old plan drafts (input only, git ignored):
# docs/plans/game-verification/ (design.md, directions.md, research-*.md, decisions/*.yaml).
goal: Prove what a player experiences in a real Minecraft client, as tests that run on every pull request, built in full before L3.

pieces:
  - id: paper-topology
    status: building
    open: none; a restart Paper runs bestq (AOT cache trained in the same job, C1 only, SerialGC, clients gated while it boots)
    tries:
      - id: d1-one-client
        what: One client runs requirements in sequence
        taught: Simple, but the throughput is that of a single client
        state: dropped
        why: The pool of 4 warm clients was decided for group behaviour and throughput
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: d2-shared-paper
        what: Several clients run separate requirements on one Paper
        taught: Scales linearly when gated; wrong verdicts came only from broadcast chat and titles, fixed by per player effects and regions 1024 blocks apart. Tick rate, main thread lag and coverage still leak between attempts
        state: working
        evidence: [docs/design/game-verification/spikes/d-clients.md, CI runs 42184657603 42187755498]
      - id: d3-paper-per-group
        what: One Paper per few clients
        taught: The only way to isolate tick rate, main thread lag and coverage; best throughput was 2 Papers with 4 clients each
        state: working
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: shared-stepped-paper
        parent: d2-shared-paper
        what: Every attempt shares one Paper whose next tick waits for every claimed client and every claimed player's work
        taught: >-
          P1: 14 to 17 s per 1,000 requirements without restarts, 0 wrong verdicts in 36,000. One
          attempt's async work holds every attempt's tick (about 100 ms per attempt hit). Needs a fence,
          regions and approximate coverage. Lessons: count only acks of ticks after the stimulus (a stale
          ack passed a broken requirement), switch the client clock on the render thread.
        state: picked
        why: Picked by the developer from P1
        evidence: [docs/plans/game-verification/decisions/step-driver.yaml, "branch proto/gv-topology 1ec7bef6f: prototypes/game-verification/RESULTS.md", CI run 42345155973]
      - id: paper-per-attempt
        parent: d3-paper-per-group
        what: 4 long lived Papers, one per running attempt, wiped and reused; clients move for a group claim
        taught: >-
          P1: 2.3 times faster than shared with no groups and no restarts (6 s per 1,000), but every group
          claim moves clients (0.33 to 0.95 s each, holding that Paper): +390% at 10% groups, +777% at
          30%. Restart boots compete with three busy Papers: +41% at 1% restarts. An idle stepped Paper
          needs a keepalive tick or the watchdog stops it.
        state: dropped
        why: 41 to 777% slower once groups or restarts appear
        evidence: ["branch proto/gv-topology 1ec7bef6f: prototypes/game-verification/RESULTS.md", CI runs 42345155973 42339156447]
      - id: fresh-paper-per-attempt
        parent: d3-paper-per-group
        what: A fresh Paper per requirement, booted ahead while others run
        taught: P1 computed it. A boot costs 22 to 39 CPU s, so 1,000 requirements take 1.5 to 2.8 hours on 4 vCPU; matching shared would need about 850 booters
        state: dropped
        why: Hours per 1,000 requirements
        evidence: [docs/design/game-verification/spikes/k-restarts.md, docs/design/game-verification/spikes/c-speed.md]
      - id: k-own-paper-for-restarts
        what: A requirement that kills Paper runs on a Paper of its own
        taught: >-
          A kill drops every client on that Paper. P1: at 1% restart requirements, restarts are 82 to 89%
          of suite time (boot 8 to 14 s each, CPU bound, so parallel boots do not help); the other 990
          requirements finish in 20 to 27 s. AppCDS needs -XX:+AllowArchivingWithJavaAgent with the agent
        state: picked
        why: Decided by the developer from spike K
        evidence: [docs/design/game-verification/spikes/k-restarts.md, CI run 42345155973]
      - id: faster-boot
        parent: k-own-paper-for-restarts
        what: Cut Paper's boot with Java 25's AOT cache, AppCDS with the agent, a slim world and only needed plugins
        taught: >-
          P7 T1: kill to state 5.0 s against 8.8 s today (bestq: Java 25 AOT cache trained on a boot with
          the agent and a join, C1 only, SerialGC, and the client kept gated while Paper boots). Four at
          once: a round of 4 in 15.5 to 23.2 s against 48 to 72 s, so overlapping restarts pay off only
          with these flags. 0 wrong of 1,494. The two real levers are C1 only (minus 27%) and a quiet
          client during the boot (minus 23%); the slim world buys nothing. Java 26 is no faster and
          drops AppCDS with an agent. The cache must match JDK, Paper, plugins and module flags or the
          JVM stops. What is left is Minecraft's bootstrap and datapack load (about 5.5 CPU s).
        state: picked
        why: Picked by the developer; 5.0 s on the normal Java 25 and the Mac, against T2's 9.0 s with a special JDK
        evidence: ["branch proto/gv-boot 0f8ed6c89: prototypes/game-verification/RESULTS.md", CI runs 42430101477 42433205261]
      - id: checkpoint-restore
        parent: k-own-paper-for-restarts
        what: Restore a snapshot of a booted, empty Paper instead of booting (Azul Zulu 25 CRaC, Linux only)
        taught: >-
          P7 T2: works only with the checkpoint right after Paper's Bootstrap.validate, before it reads
          the server folder; later points bake stale data (7 of 84 wrong) or die. Kill to ready 8.8 to
          9.1 s against 13.9 to 14.5 s booting; 0 wrong of 84. Needs Azul's CRaC JDK (not in nixpkgs),
          a 400 MB image per machine, about 170 lines of hooks; no restore on the Mac.
        state: dropped
        why: Slower than the faster boot and needs Azul's CRaC JDK, a 400 MB image and Linux
        evidence: ["branch proto/gv-restore a7f4aaff0: prototypes/game-verification/RESULTS.md", CI run 42432909519]

  - id: stepped-ticks
    status: building
    open: Stepping is proven for one subject. How it behaves with several attempts depends on paper-topology
    tries:
      - id: c2-faster-rate
        what: Run Paper faster than 20 TPS
        taught: Rate is server wide, and a tick window shrinks with the rate while wall clock async work does not
        state: dropped
        why: Replaced by stepped ticks
        evidence: [docs/design/game-verification/spikes/c-speed.md, docs/design/game-verification/spikes/d-clients.md]
      - id: wall-clock-fail-rule
        what: Fail only when the window barrier arrived and the player's counted work is quiet, at a fixed rate
        taught: Correct, but kept wall clock in the rule
        state: dropped
        why: Stepped ticks carry the rule inside the step
        evidence: [docs/design/game-verification/spikes/d-clients.md]
      - id: n1-vanilla-freeze
        what: Paper's tick manager frozen and stepped
        taught: Plugin tasks, players and the block break clock keep running on wall clock
        state: dropped
        why: Not a real freeze
        evidence: [docs/design/game-verification/spikes/n-stepped-ticks.md]
      - id: n2-step-agent
        what: A Java agent makes Paper's main loop wait for a permit; the client moves one tick per step ping
        taught: Exact windows, async work passes with no wall clock window, hung work fails at the 1 s limit, a few ms per requirement. Packet limiter, read timeout and watchdog must be relaxed
        state: picked
        why: Decided by the developer, as an agent on the stock Paper jar
        evidence: [docs/design/game-verification/spikes/n-stepped-ticks.md, CI runs 42304863563 42310014228]

  - id: perception
    status: building
    open: "How A4 asks stay cheap (smaller window for A4 frames, or fewer asks); live gaps: fades, wrapped chat lines, grey completion text, cursor blink"
    tries:
      - id: a1-client-state
        what: Read the client's state
        taught: Many false positives on lying scenes
        state: dropped
        why: Only arranges scenes and names causes
        evidence: [docs/design/game-verification/spikes/a-observers.md]
      - id: a3-pixels
        what: Pixels in a region
        taught: Good for frames and goldens, weak as a verdict
        state: dropped
        why: Kept for goldens only
        evidence: [docs/design/game-verification/spikes/a-observers.md]
      - id: a2-drawn-plus-a4-visible
        what: "Seen means drawn legibly plus owns visible pixels"
        taught: Every verdict right on the lying battery, gated or rendered; new kinds cost no observer code
        state: picked
        why: The only honest pair
        evidence: [docs/design/game-verification/spikes/a-observers.md]
      - id: live-stream
        parent: a2-drawn-plus-a4-visible
        what: The client streams full perception records over TCP after every drawn frame, only when they change; barriers echoed in the stream
        taught: >-
          P4: works. About 3 records of 61 bytes per requirement (212 KB per 1,000), so full records, no
          diffs. Building a record costs under 0.2 ms; the cost is the frame a gated stepped client must
          now draw each tick: stepped tick 2.4 to 8.1 ms on the runner. Record arrives 12 ms after its
          tick on the runner. HUD element tags 14 of 14 right. Same record counts on Mac and runner.
          A4 pixel counts in every record double the tick, so A4 must be asked for by a check, not
          streamed. Live gaps: fades count as legible from alpha 8, chat lines wrap into several runs,
          grey completion text looks typed, the text cursor blink adds records.
        state: working
        evidence: ["branch proto/gv-stream 45481dcb1: prototypes/game-verification/RESULTS.md", CI run 42336338774]
      - id: frame-every-tick-at-scale
        parent: live-stream
        what: 4 clients on the shared stepped Paper each draw a frame every tick and stream, judged from the stream
        taught: >-
          P8: +408% per 1,000 requirements (15.4 s to 78.6 s at 10% groups; +545% at 30%). Four lavapipe
          clients saturate the 4 vCPU; a frame costs about 40 ms of client CPU with four against 6 ms
          with one, and Paper idles waiting. Best levers combined (214x120 window, frames only after a
          game packet, only while a check waits, barrier wake): +53%, and titles likely clip at that
          size. Only the window size helps much; thread counts and waiting checks do nothing. 0 wrong
          verdicts in 210,000. Judging from the stream itself adds about 24%. A record's tick label can
          lag up to 4 ticks on an idle client.
        state: dropped
        why: Over the developer's 50% line even with every lever
        evidence: ["branch proto/gv-frames 6b7441deb: prototypes/game-verification/RESULTS.md", CI runs 43306724605 43320141634]
      - id: perceive-without-drawing
        parent: live-stream
        what: Clients run the extract and submit stages each tick and skip the GPU draw; pixels only for A4 checks, goldens and clips
        taught: >-
          P11: works. +7%, +15% and +10% per 1,000 at 0, 10 and 30% groups (P8's frame every tick on the
          same jobs: +374 to +580%); runs after the warm up drift are +8 to +11%. A perceive frame is
          about 1 ms against about 40 ms drawn; window size no longer matters. It must keep the submit
          stage, section compile, buffer upload and occlusion update from LevelRenderer.render; only the
          GPU work is cut. 0 wrong in 249,000; the lying scene battery gave 0 flips in 238 runs; nothing
          stale for a later drawn frame. A4 on demand is now the cost: 10% of requirements asking once
          adds 6 to 27 points (smaller window helps), because each ask holds the shared Paper for two
          drawn frames.
        state: working
        evidence: ["branch proto/gv-nodraw 25ed99f98: prototypes/game-verification/RESULTS.md", CI runs 43330492175 43333247905]
      - id: a4-on-demand
        parent: perceive-without-drawing
        what: "visible() asks a player's client to draw real frames only while its window holds; the asked entity's pixels are those that change when it is left out"
        taught: >-
          Slice 6: a measured frame costs 5.8 ms on the Mac window (1708x960) and 4.1 ms at the runner's
          854x480; an asking requirement adds 30 to 80 ms; 5 of 87 asking add about 0.25% to the suite, far
          below P11's 6 to 27 points. A smaller window does not help, the draw dominates. The lying scenes
          (behind a wall, fully transparent, off screen, behind an open inventory) are seen correctly. The
          threshold counts pixels, so it means 4x less area on the Mac window than on the runner. New
          chunks fade in, so visibility windows need 10 ticks.
        state: working
        evidence: ["commit 9e8ab5e21 on feat/game-verification-slice-6", "cargo xtask e2e game: 87 passed, three runs in a row"]

  - id: readiness-and-done
    status: building
    open: Which side counts Typewriter's work for the done signal (Paper only, or Paper plus a test side hook); decided with layers 3 and 6
    tries:
      - id: e-bare-barrier-and-chunk-signals
        what: A bare echo barrier, or chunk and mesh signals
        taught: A bare barrier is wrong when effects are delayed; chunk signals fire early
        state: dropped
        why: Wrong verdicts
        evidence: [docs/design/game-verification/spikes/e-readiness.md]
      - id: e3t-window-barrier
        what: Read the fact every client loop, pass when it holds, fail at a barrier after the window in ticks
        taught: No wrong verdicts; a pass costs nothing beyond the truth
        state: picked
        evidence: [docs/design/game-verification/spikes/e-readiness.md, CI run 42174196154]
      - id: per-subject-work
        what: Engine and realm count work per player; the step waits until it is quiet; hung work is reported after 1 s and never cancelled
        taught: Replaces server wide quiet and counted dispatchers
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/d-clients.md, docs/design/game-verification/spikes/i-coverage.md]

  - id: input
    status: building
    open: "Lost suggestion replies: a 1 thread suggestion pool on the test Paper, or a retype inside the window like a player would. Mac run of the SDL path under stepped ticks"
    tries:
      - id: j-packets-and-game-actions
        what: Send packets, or call the game's own actions
        taught: Packets miss aim and get kicked when walking; game actions never match typed tab completion
        state: dropped
        why: Not what a player does
        evidence: [docs/design/game-verification/spikes/j-input.md]
      - id: j-window-events
        what: Real window events (XTest on Linux, SDL queue push on the Mac)
        taught: Same server events as direct handler calls on all 17 inputs, gated or rendered; typed suggestions sometimes get no reply
        state: picked
        evidence: [docs/design/game-verification/spikes/j-input.md, CI runs 42211818480 42215647584 42218505138]
      - id: input-from-the-client
        parent: j-window-events
        what: The client mod sends the window input itself; the pool process sends only commands
        taught: >-
          P10: works. Linux: XTest from inside the client through the foreign function API, with one
          Xvfb display per client; on a shared display every key goes to the focused window. Mac: the
          SDL queue push, which also works on Linux. Both match direct calls on all 18 inputs, 100 of
          100, gated and rendered, under stepped ticks, always exactly one tick later. 4 clients at the
          same step: 0 inputs on the wrong client. XTest needs a one pixel nudge after the grab. Sent X
          events to the own window fail on pointer motion. Lost suggestion replies (4 to 6%) come from
          Paper's 4 thread suggestion pool reordering requests; a 1 thread pool or a retype after 6
          ticks fixes it. Mac run not done (devenv shell hung).
        state: working
        evidence: ["branch proto/gv-input 85d06340e: prototypes/game-verification/RESULTS.md", CI runs 43306835761 43309694858 43311267445]

  - id: client-pool
    status: building
    open: The client shows a "Chat messages can't be verified" toast after joining; a toast check could see it (slice 1)
    tries:
      - id: fresh-client-per-requirement
        what: Boot a client per requirement
        taught: A boot costs far more than a requirement
        state: dropped
        why: Unaffordable
        evidence: [docs/design/game-verification/spikes/s0-real-client-on-paper.md, docs/design/game-verification/spikes/c-speed.md]
      - id: fresh-identity
        what: A new player identity per requirement
        taught: Leaked nothing but costs a join per requirement
        state: dropped
        why: Replaced by the full wipe
        evidence: [docs/design/game-verification/spikes/k-restarts.md]
      - id: full-wipe
        what: Wipe all 17 kinds of player state between requirements, on warm clients
        taught: Leaked nothing; the obvious partial wipe leaked 11 kinds
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/k-restarts.md, CI run 42235574190]
      - id: leave-like-pause-menu
        what: Reconnect by leaving like the pause menu, then joining
        taught: The earlier client side close made Paper keep the old player for about 30 s
        state: picked
        evidence: [docs/design/game-verification/spikes/k-restarts.md]
      - id: lease-time
        what: Split the 1.2 s from grant to lease into timed parts
        taught: >-
          Paper's wall clock chunk send cap (player-max-chunk-send-rate 75, unchanged in the test Paper)
          is about 1.08 s of the 1.13 s median: the claim waits for 81 chunks (radius 3 plus the edge ring,
          while the client draws render distance 2). The wipe itself costs 1.4 ms; the synchronous claim
          18 ms, mostly generating the centre chunk. Cap removed: 499 ms; plus regions loaded ahead: 291
          ms; render distance 4: 1661 ms. Every region is fresh. What remains without the cap is 11 to 13
          stepped ticks, with the moving client acking about 28 ms late (guess: section compiles, not
          timed). A separate 8 to 17 s tail (3 or 4 claims per run): a free player holds back no ticks, its
          client falls up to 235 ticks behind, and once claimed every attempt waits for it to catch up
          (StepPolicy allAcked(claimed)). Why the client reports view distance 3 with render distance 2,
          and why Paper sends only about 10 chunks per tick without the cap, are unknown.
        state: working
        evidence: ["branch proto/gv-lease-time 056013429: services/playtest/lease-time/", "4 full suite runs, 82 passed each", "fixes in e5f88a238: cargo xtask e2e game 83 passed, grant to lease median 409 ms, p90 684 ms, max 5284 ms (was 1132, 1422, 16353)"]
      - id: why-runs-vary
        what: Find what wall clock work moves tick counts and frames
        taught: >-
          Variance shows even when requirements run alone. BREAK: the client's 5 tick break delay carries
          over from an earlier attempt on that client (proven 10 of 10). CHAT: Paper sends chat from its
          async chat thread at wall clock times. CMD: an input can start after the client acked the tick, so
          Paper moves on first. GOLDEN-3: after a teleport the client computes visible sections on a
          background thread (inferred; did not recur in 25 runs). Regions loaded ahead and Paper's async
          chunk and light work cause none of it. The neighbour ring is needed: with a first tick check
          PROBE-3 passed 20 of 20 with it and failed 20 of 20 without.
          Fixed since: the wipe resets the break delay, chat and suggestion requests count as player work,
          the client acks only once its pending input is handled, the watch travels with the probe on
          Paper's connection, typing takes a tick per key, and the record goes out right after its tick.
          Open: BREAK-2 once turned 132 px sideways that the playtest never sent (likely the real cursor
          over a background client window on the Mac, unproven); once the client acked before SDL delivered
          its own pushed mouse events, so a turn landed a tick late.
        state: working
        evidence: ["commit e4ded3e7d on feat/game-verification-steadiness", "fixes ed15cc7b3 ee84f2844 f802c922a 39742a7d1 18e698ef9 2b40b8aea: steadied requirements same ticks 10 of 10 under load, 96 passed in three full runs"]

  - id: requirement-shape
    status: building
    open: "Pool process design: detach it on purpose, replace a stale idle pool, a lease deadline, a report that survives a pool crash; IDE single runs unchecked"
    tries:
      - id: fabric-client-gametest
        what: Fabric's client game test API as the runner
        taught: Test code runs inside one client, sequentially, against an in process server; no external server API
        state: dropped
        why: Conflicts with real Paper, several clients and a test JVM
        evidence: [docs/design/game-verification/research/real-client-precedent.md]
      - id: g2-await-and-g3-timeline-only
        what: Await style, or judge only the recorded timeline afterwards
        taught: Await silently grows limits; timeline only waits its whole recording on every pass
        state: dropped
        why: Await silently grows limits; timeline only waits its whole recording on every pass
        evidence: [docs/design/game-verification/spikes/g-requirement-shape.md]
      - id: g1-windows-plus-timeline
        what: Every check in a within(n.ticks) window from the last stimulus; order and gaps from the timeline
        taught: Fits one mechanism, the streamed perception with the barrier inside it
        state: picked
        why: Decided by the developer
        evidence: [docs/design/game-verification/spikes/g-requirement-shape.md]
      - id: root-compilation
        parent: runner-c-testballoon
        what: One root compilation reads every module's gameTest folder
        taught: P2 proved 200 tests, one JVM, one scheduler; works only inside one Gradle build, so not for extensions built elsewhere
        state: dropped
        why: Services build only, and every run boots the clients again
        evidence: ["branch proto/gv-testballoon: services/prototypes/gv-testballoon/evidence/root"]
      - id: classloader-per-compilation
        parent: runner-c-testballoon
        what: One JVM loads each compilation in its own class loader and runs testBalloon per loader; scheduler and pool in the shared parent loader
        taught: Not tried
        state: dropped
        why: The pool process covers it, plus extensions and warm single runs
        evidence: []
      - id: pool-process
        parent: runner-c-testballoon
        what: The warm pool and scheduler run as their own process; every test JVM (module, extension, IDE run) submits to it
        taught: >-
          P6: works. Two test JVMs shared one pool of 4; the first JVM starts the pool, a lock file keeps
          it single; a warm single requirement takes 2 s of Gradle time against 20 s cold. The pool must
          rotate between test JVMs (325 ms against 4,071 ms for a late single). Killed test JVM, killed
          pool and version mismatch all fail clearly. Open: detach the pool on purpose (it survives only
          by process group luck), replace a stale idle pool automatically, a heartbeat or lease deadline
          for a stuck pool, keep the report safe from a pool crash. About 590 lines against 217.
        state: picked
        why: Picked by the developer; modules and extensions share warm clients, single runs take 2 s
        evidence: ["branch proto/gv-pool-process 968f7babb: services/prototypes/gv-pool-process/FINDINGS.md"]
      - id: runner-a-and-b
        what: Tests in a pool (A), or requirement values run by the framework (B)
        taught: A shows flaky as green; B loses the IDE gutter and test filters
        state: dropped
        why: A shows flaky as green; B loses the IDE gutter and test filters
        evidence: [docs/plans/game-verification/directions.md]
      - id: runner-c-testballoon
        what: Declared in testBalloon with a needs header; a framework scheduler runs, retries and reports
        taught: >-
          P2: works. 200 mirror tests submit at once (1.08 of ideal), flaky shows as failed, --tests
          selects before submission (testBalloon path syntax), finish runs after every test. One JVM
          holds one test compilation only (fixed JvmEntryPoint class name), so every module's
          requirements must compile together. A failure in finish is silent in testBalloon; xtask
          must gate on TestRun being written. The flaky error must carry the body's frame first.
        state: picked
        why: Decided by the developer
        evidence: [docs/plans/game-verification/directions.md, "branch proto/gv-testballoon 7a77e7ba3: services/prototypes/gv-testballoon/FINDINGS.md"]

  - id: video
    status: building
    open: "30 or 60 fps for clips; how a window treats facts the client smooths between ticks (one tick margin at the deadline)"
    tries:
      - id: b2-window-capture
        what: Capture the window
        taught: Up to 16 frames off, no sync
        state: dropped
        why: Frames drift from the facts
        evidence: [docs/design/game-verification/spikes/b-video.md]
      - id: b3-packet-replay
        what: Record packets, render offline on demand
        taught: Not worth building
        state: dropped
        why: Not worth building
        evidence: [docs/design/game-verification/spikes/b-video.md]
      - id: b1-readback-demo-rerun
        what: In client readback to ffmpeg, recorded in a demo rerun, never in the gated suite
        taught: Clip lines up with facts; same verdict in every rerun
        state: picked
        evidence: [docs/design/game-verification/spikes/b-video.md, CI run 42111131229]
      - id: frames-between-steps
        parent: b1-readback-demo-rerun
        what: In a demo rerun the stepped client draws 2 or 3 frames per tick at even partial tick positions, each with its own record
        taught: >-
          P9: works at 30 and 60 fps. Exactly 1/fps game time per frame, no repeated or skipped frames,
          no jump at tick boundaries, steadier than a real time recording (which dropped frames). Every
          frame has its own record, so frame f is record f; pixels agree with the facts. Verdicts 12 of
          12 the same in gated, demo 30, demo 60 and a rerun; facts the client smooths between ticks may
          first hold one tick earlier or later, so a check right at its deadline needs a one tick margin.
          Cost on the runner: 1.5 times gated at 30 fps, 2.6 at 60, against 4 to 5 for real time. Same
          machine reruns give identical mp4 bytes except particles (client randomness).
        state: working
        evidence: ["branch proto/gv-video f1bb8683a: prototypes/game-verification/RESULTS.md", CI run 43312553335]

  - id: goldens
    status: building
    open: CI setup cost of the devenv e2e shell (300 to 480 s per job on an uncached branch)
    tries:
      - id: tolerant-compare
        what: SSIM, blur or threshold comparison
        taught: Every tolerant method missed a colour off by 3
        state: dropped
        why: Misses real breaks
        evidence: [docs/design/game-verification/spikes/f-goldens.md]
      - id: devenv-mesa
        parent: exact-on-pinned-runner
        what: The same goldens on devenv's Mesa 26.2.5
        taught: >-
          P5: one hash per scene across 6 CPU models on Vulkan and 4 on OpenGL, 0 differing identical
          pairs, every small break caught. The Mesa upgrade changed all 18 goldens (off by 1 level at
          far edges), so upgrades rebuild goldens as decided. The profile also needs libglvnd and the X
          libraries; building the devenv shell cost 300 to 480 s per job without the Nix cache.
        state: working
        evidence: ["branch proto/gv-goldens 82b1cdf0a: prototypes/game-verification/RESULTS.md", CI runs 42343076555 42344338415]
