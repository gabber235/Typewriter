# docs/drive/game-verification-gaps/record.yaml: the working state of the four gaps node 3 found in
# the in-game verification framework (services/playtest) before its first in-game test could be written.
# The framework's own record is docs/drive/game-verification/record.yaml; its design record is
# docs/design/game-verification/README.md.
goal: Close the G gaps so Typewriter's first in-game test (node 3, sessions) can be written on the framework.

pieces:
  - id: g1-paper-additions
    status: done
    open: none; one union of every gameTest module's plugin jars, files and Paper env, collected before the pool starts
    tries:
      - id: per-module-additions
        what: Each gameTest module adds plugin jars, files into the Paper folder and Paper env
        taught: One pool and one shared Paper serve every module; the first gameTest task's parts define the pool (build-logic com.typewritermc.game-test.gradle.kts:66-76,154,216), so additions must be one union for the build
        state: picked
        why: The framework stays free of Typewriter code; a module names what it needs
        taught: Declared as gamePaper { pluginJars; files { CopySpec }; environment }, like runPaper; each module's playtestPaperAdditions folder (files/, env.properties) is collected from every game-test project, the pool copies them after its own files and merges env, failing on disagreement
        evidence: [services/playtest/pool/src/test/kotlin/com/typewritermc/playtest/pool/PaperAdditionsTest.kt, services/playtest/pool/src/main/kotlin/com/typewritermc/playtest/pool/Game.kt:263-296]
  - id: g2-quit-rejoin
    status: done
    open: none
    tries:
      - id: quit-rejoin-verbs
        what: player.quit() and player.rejoin(); an intended leave on the wire, the player held away on its lease, not lost
        taught: Today player_left and disconnected both end in lost(), which replaces the client (Pool.kt:1367); the away hold Out.AWAY exists (Pool.kt:1098). Building it found Paper's step policy waited on acks of a client whose connection closed (a 5 s stall, then a lost client) and that no check could show the player list; both fixed. A window of state checks alone needs a player on Paper to run its ticks, so it is refused while every player quit
        state: picked
        evidence: [3c05b6b8f0, QUIT-1 to QUIT-6, AwayTest.kt, full game suite 102 of 102 on the G2 branch]
  - id: g3-outside-proof
    status: done
    open: none
    tries:
      - id: state-check-in-window
        what: A named test JVM predicate inside a window, evaluated after each stepped tick, counts as the positive check
        taught: A window that reads state steps one tick at a time, each tick closed by a barrier of its own after its records; the last tick's barrier is the window's own, so no extra round trip. never.state covers "key never gone"
        state: picked
        why: Any state from anywhere (NATS, realm); Flexible ranks first
        evidence: [services/playtest/framework/src/test/kotlin/com/typewritermc/playtest/StateCheckTest.kt, WindowTest.kt, framework/src/gameTest/.../StateRequirements.kt (STATE-1, STATE-2)]
      - id: wall-clock-eventually
        what: eventually(limit) polled on real time, as node 3 asked for session TTL expiry (GAME-S3)
        taught: TTLs run on NATS wall clock; GAME-S3 alone would wait 20 to 60 s per run
        state: dropped
        why: The developer kept the framework tick based; GAME-S3 stays in node 3's two engine harness with injected short TTLs
  - id: g4-services
    status: done
    open: who gates a Typewriter requirement on the engine being Active on a restart Paper (see open)
    tries:
      - id: inside-stack
        what: cargo xtask e2e game runs under a game stack spec (the panel spec plus binding the Paper loader as engine), real grants and engine_instance
        taught: stack run --spec panel already runs NATS, backend, a realm host and binds it with primary engine typewritermc:paper (bind.rs:39,119), as local processes without k3d
        state: picked
        why: Same path as production, no test only loader mode
        evidence: [xtask/src/stack/typewriter.rs:52-54, backend/tests/component/crates/typewriter-stack/src/bind.rs]
      - id: paper-loader-second-host
        parent: inside-stack
        what: The Paper loader registers as a second host, bound with primary_engine typewritermc:paper on the stack's realm
        taught: Real engine_instance; the engine comes from the realm host over NATS, no staging; stack about 65 s, bind to Active 12 to 21 s; the loader drops engine.engine_id (BackendArtifactHostAssignmentSource.kt:119-149), node 3 owns that; a second plugin bundling Kotlin crashed coverage; a fresh own Paper folder registers a new host
        state: picked
        evidence: [spike/g4-paper-engine-stack 8155e149d1 (local, deleted after the build), SIBLING-TW SIBLING-1 RESTART-1 passed in run 2]
      - id: slot-identities
        parent: paper-loader-second-host
        what: Every Paper has a slot (0 shared, 1..2 own, lowest free); a module adds env per slot and keeps paths per slot across that slot's Papers; the binder binds a slot when its token appears
        taught: Slot environment (a token path per slot into the stack state) replaces slot files, since the binder never reads pool folders; the kept path is plugins/Typewriter/state, which holds service-identity.cbor; services are renamed game_paper_<slot> so the topology names each slot's engine
        state: picked
        why: Loaders exist only once the pool boots their Papers, so binding happens during the run (developer, option A)
      - id: slot-binds-without-deadline
        parent: slot-identities
        what: The binder waits for a bound slot's host however long it takes; the slot's next Paper advertises the same service
        taught: CI's RESTART-3 stopped its own Paper seconds after slot 2 was bound; the 60 s advertise deadline then failed bind-engines and with it the game run, though all 105 requirements passed. The identity is stored before the token is written (service-identity.cbor), and the slot keeps plugins/Typewriter/state
        state: picked
        why: "A. Wait for the slot (Recommended)"
        evidence: [backend/tests/component/suite/src/service/service_registration/engine_slots.rs (a_slot_whose_paper_stops_before_advertising_binds_when_its_next_paper_advertises)]
        evidence: [services/playtest/pool/src/test/kotlin/com/typewritermc/playtest/pool/SlotKeepTest.kt, PapersTest.kt, PaperAdditionsTest.kt, backend/tests/component/crates/typewriter-stack/src/bind.rs]
      - id: observer-reads-topology
        parent: inside-stack
        what: The stack mints read only observer credentials (STACK_OBSERVER_CREDS, _INBOX, _TOPOLOGY); the test JVM requests the owner's topology snapshot and may read sessions_<realm> keys
        taught: Grants are exact subjects for the stack's realm ($JS.API.STREAM.INFO, STREAM.MSG.GET, DIRECT.GET .$KV.sessions_<realm>.*.*.*), since NATS wildcards match whole tokens; the Kotlin generator emits only service routes, so the test builds the topology contract by hand on the panel reply inbox
        state: picked
        why: Read real state, never a binder side file (developer)
        evidence: [backend/tests/component/crates/typewriter-stack/src/observer.rs (tests), services/runtime/engine/runtimes/paper/src/gameTest/kotlin/com/typewritermc/engine/paper/PaperEngineRequirements.kt (PAPER-ENGINE-1)]

decided:
  - id: g4-inside-stack
    what: "A. Inside the stack (Recommended)"
    why: Real grants and engine_instance; no loader local mode
  - id: g3-state-check
    what: "A. State check (Recommended)"
    why: Test JVM predicate polled each tick inside a window; counts as proof
  - id: coverage-own-code
    what: "Yes count only our code"
    why: The loader's bundled Kotlin crashed coverage analysis
  - id: restart-identity-slots
    what: "A. 3 fixed slots (Recommended)"
    why: Bind the shared Paper plus 2 own slots once; copy identity per folder; no 20 s bind per restart
  - id: g3-ticks-only
    what: "A. Ticks only (Recommended)"
    why: Add never.state for S2; S3 stays in node 3's harness
  - id: g4-bind-during-run
    what: "A. Bind during run"
    why: Loaders exist only inside the pool; generic slot keep; no engine wait inside a window; Typewriter's suite setup waits for slot 0
  - id: g4-slot-binds
    what: "A. Wait for the slot (Recommended)"
    why: No deadline per Paper; the slot's next Paper advertises the bound service
  - id: g4-observer-topology
    what: "1. Observer reads topology"
    why: Read only credentials read the real topology and sessions bucket; no binder side file

open:
  - id: restart-paper-engine-gate
    what: Who gates a Typewriter requirement on the engine being Active on a restart Paper (slots 1 and 2 are bound and keep their identity, but nothing waits for them yet)
    tied_to: the readiness and done obligation (docs/design/game-verification/README.md, Obligations on Typewriter)

slices:
  - id: g-gaps
    what: G1 to G4 on one branch, feat/game-verification-gaps
    evidence: [cargo xtask e2e game 105 of 105, check quality docs xtask components services green on 2026-11-19]

next: Open the pull request for feat/game-verification-gaps; node 3 writes its first in-game test on it. The restart Paper engine gate stays open until a Typewriter requirement needs a restart
