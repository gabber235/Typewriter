# docs/drive/rollout-drops-leaving-hosts/record.yaml: the working state of one piece of work.
goal: >
  A host that leaves or stops answering is dropped from the running rollout and picks up the current projection when
  it comes back; it never blocks the other hosts.

pieces:
  - id: membership
    status: done
    tries:
      - id: presence-probe
        what: the rollout presence probe the coordinator already sends, read on every pass; absent means not a member
        taught: >
          it is the only live membership signal on features/v1; a false drop costs no correctness because the
          rollout acts on each host's observed phase, a dropped host that answers again is simply a member again
        state: picked
        why: maintainer chose it, behind one RealmMembership read so leased presence can replace it
        evidence: [services/runtime/loader/core/src/main/kotlin/com/typewritermc/loader/rollout/RolloutCommunication.kt]
      - id: backend-service-liveness
        what: the backend service state (online, offline, last_seen) written by heartbeat and orderly shutdown
        taught: offline only on orderly shutdown; nothing expires a silent host; no Realm host reads it
        state: dropped
        why: a crashed host stays online forever
        evidence: [backend/service/service-registration/src/shutdown.rs:23, services/sdk/service-sdk/src/main/kotlin/com/typewritermc/services/libs/registrar/RegistrarConfiguration.kt:25]
      - id: leased-presence-rows
        what: hosts hold a leased presence row (generic Leases of PR 585, collaboration decision 16)
        taught: right long term form, but PR 585 is unmerged and decision 16 needs its own design check
        state: dropped
        why: later; RealmMembership is the seam
  - id: rollout-shape
    status: done
    tries:
      - id: reproduce-block
        what: two hosts, the Paper host stops answering once it runs the new projection
        taught: >
          the old coordinator waited out its 5 minute participant deadline, rolled the healthy Realm host back too and
          waited 5 more minutes for the gone host; a joiner waited behind the whole serial pass
        state: working
        evidence: ["commit 2d8f58313ec: CoordinatedRolloutTest failed with Timed out waiting for rollout participants."]
      - id: target-and-member-convergence
        what: >
          the Realm keeps a target (committed, or a candidate being proved); every member gets its own convergence
          toward its projection of the target; join, repair and rollback are all convergence
        state: picked
        why: maintainer chose it 2026-11-28; removes the serial loop that made joiners wait
        evidence: [services/runtime/loader/core/src/test/kotlin/com/typewritermc/loader/rollout/RealmRolloutTest.kt, docs/design/realm-rollout.md]
      - id: drop-leavers-in-serial-loop
        what: keep the serial loop, re-probe presence on each status poll and leave absent hosts out of awaits and compensation
        state: dropped
        why: a joiner still waits behind the running rollout and reconcile and rollback stay separate paths
      - id: retry-next-pass
        parent: target-and-member-convergence
        what: try a failed candidate again on the very next pass
        taught: the revert never ran; the next candidate replaced it at once and staged hosts were never aborted
        state: dropped
        why: replaced by holding the reverted target until every present member is back, which matches the old retry after compensation

decided:
  - id: leavers-dropped
    what: >
      A host that leaves or stops answering is dropped from the running rollout and picks up the current projection
      when it comes back; it never blocks the other hosts. Its own PR, merged before 587.
  - id: shape
    what: Realm target plus per member convergence; joining, repairing and rolling back become one operation.
  - id: joiner-target
    what: A host that joins during a candidate gets the candidate and joins the gate (one switch).
  - id: membership-source
    what: The presence probe now, behind one members read so leased presence can replace it later.
  - id: leave-not-evidence
    what: A leave is not evidence against a deployment; written in the design record and the PR body.
  - id: delete-selection-check
    what: Delete the dead "abort if the host set changed" check rather than keeping it unused.

open: []

slices:
  - id: realm-rollout
    tests:
      - "RealmRolloutTest: a primary engine host that leaves while the rollout proves stability does not hold back the Realm host"
      - "RealmRolloutTest: a host that joins while a candidate is proved runs the candidate and must prove it before the commit"
      - "RealmRolloutTest: a returning host gets the committed projection while another host is still being repaired"
      - "RealmRolloutTest: a candidate a host fails to stage is aborted without switching any running host"
      - "RealmRolloutTest: a failed candidate is rolled back on the hosts still present and never sent to a host that left"
      - "RealmRolloutTest: each member has five minutes from joining a candidate to run it healthy"
      - "RealmRolloutTest: a committed host whose status replies go missing keeps running without being staged again"
      - "RealmRolloutTest: a committed host that reports its projection unhealthy is staged again"
    status: done

next: hand back to the orchestrator; open the PR once it approves (game run green, 106 requirements)
