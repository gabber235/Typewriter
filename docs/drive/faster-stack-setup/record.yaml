# docs/drive/faster-stack-setup/record.yaml: the working state of one piece of work.
goal: Make CI setup for the e2e jobs (game and panel) much faster, so the whole run gets shorter and sharding the game suite becomes worth it later.

pieces:
  - id: protocol-only-for-the-game-stack
    status: building
  - id: reuse-rust-builds
    status: building
  - id: overlap-gradle-with-cargo
    status: figuring-out
    open: >-
      gameTestBuild cannot run before the services start: playtestPaperEnvironment reads
      TYPEWRITER_CONFIG_FILE and STACK_GAME_ENGINES as task inputs
      (services/runtime/engine/runtimes/paper/build.gradle.kts), which the stack publishes once its
      services run. Only the Realm host's Gradle build overlaps the Cargo builds.
    tries:
      - id: game-suite-in-the-stack-gradle-run
        what: the game stack adds gameTestBuild to the one Gradle run of its build phase
        taught: gameTestBuild's paper additions take stack values as inputs, so it fails before the services publish them
        state: dropped
        why: every game run would fail before any requirement; all three review critics found it from source
        evidence: [services/build-logic/src/main/kotlin/com.typewritermc.game-test.gradle.kts gameTestBuild]
  - id: shallow-game-checkout
    status: building
  - id: panel-gradle-outputs
    status: building

decided:
  - id: approved-items
    what: >-
      The game stack generates only the protocol; reuse the typewriter-stack binary and the
      release .wasm components by a digest of their inputs; cache cargo dependency builds; overlap
      the Gradle builds with the cargo builds; shallow checkout for the game suite; the panel
      suites keep Gradle's build outputs. Not in scope: one shared build job, wasmtime
      optimization, Gradle configuration cache, sharding.
  - id: rust-targets-on-the-volume
    what: >-
      The release wasm targets and the component test workspace's debug target live on the
      Namespace cache volume, not actions/cache: the repository's actions/cache held 9.6 of its
      10 GB on 2026-11-24, almost all per commit Gradle output entries, while the volume had 48 of
      70 GB free. A stamp beside the artifacts makes a stale or reverted volume cost a rebuild,
      never a wrong binary.
  - id: one-build-phase
    what: >-
      A stack runs every build its services declare at once before the first service starts: each
      Cargo build on a thread, every Gradle build (today the Realm host) in one Gradle run. A
      service's command refuses to run a build it did not declare.
  - id: digest-from-backend-with-dep-info-check
    what: >-
      The stack binary and the components are reused while every file below backend (the
      components leave out backend/tests), .cargo/config.toml, the command and rustc -vV are
      unchanged. After each build Cargo's dependency files must name no repository file outside
      those inputs, or the build fails, so a missing input is caught on the change that adds it.
  - id: panel-restores-services-outputs
    what: >-
      The panel suites restore the services check's Gradle build cache and save none of their own,
      so the full actions/cache gets no new per commit entries.

slices:
  - id: digest-module
    tests: [generate tests]
    status: done
  - id: build-stamps
    tests: [cargo_build tests]
    status: done
  - id: parallel-stack-builds
    tests: [stack::spec build tests]
    status: done
  - id: typewriter-stack-builds
    tests: [stack::typewriter build tests, a real local build of the stack binary and components]
    status: done
    evidence: [local build 2026-11-24, stack binary 398 s then 3 s reused, components 166 s then 0.35 s reused]
  - id: shallow-merge-base
    tests: [review::change shallow checkout tests]
    status: done
  - id: workflow
    tests: [first CI run timings]
    status: building

next: >-
  Hand back to the orchestrating thread: the first CI run measures the saving; ask whether the game
  suite's stack values should leave gameTestBuild's inputs so it can overlap too.
