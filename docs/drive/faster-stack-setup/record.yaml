# docs/drive/faster-stack-setup/record.yaml: the working state of one piece of work.
goal: Make CI setup for the e2e jobs (game and panel) much faster, so the whole run gets shorter and sharding the game suite becomes worth it later.

pieces:
  - id: protocol-only-for-the-game-stack
    status: building
  - id: reuse-rust-builds
    status: building
  - id: overlap-gradle-with-cargo
    status: figuring-out
    open: >-
      gameTestBuild cannot run before the services start: playtestPaperEnvironment reads
      TYPEWRITER_CONFIG_FILE and STACK_GAME_ENGINES as task inputs
      (services/runtime/engine/runtimes/paper/build.gradle.kts), which the stack publishes once its
      services run. Only the Realm host's Gradle build overlaps the Cargo builds.
    tries:
      - id: game-suite-in-the-stack-gradle-run
        what: the game stack adds gameTestBuild to the one Gradle run of its build phase
        taught: gameTestBuild's paper additions take stack values as inputs, so it fails before the services publish them
        state: dropped
        why: every game run would fail before any requirement; all three review critics found it from source
        evidence: [services/build-logic/src/main/kotlin/com.typewritermc.game-test.gradle.kts gameTestBuild]
  - id: shallow-game-checkout
    status: building
  - id: panel-gradle-outputs
    status: building

decided:
  - id: approved-items
    what: >-
      The game stack generates only the protocol; reuse the typewriter-stack binary and the
      release .wasm components while what they read is unchanged; cache cargo dependency builds; overlap
      the Gradle builds with the cargo builds; shallow checkout for the game suite; the panel
      suites keep Gradle's build outputs. Not in scope: one shared build job, wasmtime
      optimization, Gradle configuration cache, sharding.
  - id: rust-targets-on-the-volume
    what: >-
      The release wasm targets and the component test workspace's debug target live on the
      Namespace cache volume, not actions/cache: the repository's actions/cache held 9.6 of its
      10 GB on 2026-11-24, almost all per commit Gradle output entries, while the volume had 48 of
      70 GB free. A stamp beside the artifacts makes a stale or reverted volume cost a rebuild,
      never a wrong binary.
  - id: one-build-phase
    what: >-
      A stack runs every build its services declare at once before the first service starts: each
      Cargo build on a thread, every Gradle build (today the Realm host) in one Gradle run. A
      service's command refuses to run a build it did not declare.
  - id: inputs-are-the-declared-trees
    what: >-
      Decided 2026-11-27 after review rounds 7 to 9 each found another hole in the read set
      (inputs found by digging through Cargo's target folder: unit dependency files, build script
      output, a rule for scripts that watch nothing), which this replaces. A build declares the
      folders it reads: its workspace's folder, the folder of every repository package it builds,
      and the paths each such package lists in its manifest's [package.metadata.typewriter] inputs
      for what it embeds from outside its folder (all from the one typed cargo metadata read). Its
      stamp lists the sha256 of each artifact, of every file Git does not ignore in those folders (untracked ones
      too, so a new module counts before it is added), of the generated protocol sources inside
      them, of every Cargo configuration file Cargo loads (recorded absent while missing), and of
      each variable outside CARGO and RUST a build script watches, beside a digest of the command,
      rustc -vV and every inherited CARGO and RUST variable but those Cargo sets per crate. The
      build is reused while all of them match. A build that read a repository file its stamp
      does not hash fails, naming it: the dependency file Cargo documents beside each artifact
      names what the crates read and what the repository's build scripts watch, and each must be
      a hashed file or a folder inside the trees a script watches, so an ignored file inside a
      tree is refused too (review round 10: the guard and the stamp check one set). A package from
      outside the repository may read and watch anything outside it; build script output is read
      only for watched variables. The declaration lives with the crate that embeds, not with the
      build's caller: a caller list missed the component test crate's embed of the user
      organization's join transaction on CI. Not the whole backend tree for both builds: each
      build would then rebuild for every edit anywhere in backend, the stack binary for each
      component it never compiles. Watched variables are stamped rather than refused, since
      registry build scripts such as cc's watch dozens (CC, CFLAGS, SDKROOT). Known issues: a
      variable a crate reads at compile time outside CARGO and RUST is not an input unless a build
      script watches it, a procedural macro that reads a file no dependency file names is trusted,
      as Cargo trusts it, and an ignored file inside a folder a build script watches is not hashed. Why xtask decides at
      all: Cargo judges local crates by file times, which a fresh checkout resets, and its content
      based check (-Z checksum-freshness) is refused on the pinned 1.100 stable toolchain. When
      checksum freshness is stable, it replaces the declared folders and their checks; keep only
      the cache volume and the removal of each artifact before Cargo runs.
  - id: panel-restores-services-outputs
    what: >-
      The panel suites restore the services check's Gradle build cache and save none of their own,
      so the full actions/cache gets no new per commit entries.

slices:
  - id: digest-module
    tests: [generate tests]
    status: done
  - id: build-stamps
    tests: [cargo_build tests]
    status: done
  - id: parallel-stack-builds
    tests: [stack::spec build tests]
    status: done
  - id: typewriter-stack-builds
    tests: [stack::typewriter build tests, a real local build of the stack binary and components]
    status: done
    evidence: [local build 2026-11-24, stack binary 398 s then 3 s reused, components 166 s then 0.35 s reused]
  - id: shallow-merge-base
    tests: [review::change shallow checkout tests]
    status: done
  - id: workflow
    tests: [first CI run timings]
    status: building

next: >-
  Hand back to the orchestrating thread: the first CI run measures the saving; ask whether the game
  suite's stack values should leave gameTestBuild's inputs so it can overlap too.
