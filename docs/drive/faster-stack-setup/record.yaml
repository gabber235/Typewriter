# docs/drive/faster-stack-setup/record.yaml: the working state of one piece of work.
goal: Make CI setup for the e2e jobs (game and panel) much faster, so the whole run gets shorter and sharding the game suite becomes worth it later.

pieces:
  - id: protocol-only-for-every-stack
    status: done
  - id: reuse-rust-builds
    status: done
  - id: overlap-gradle-with-cargo
    status: figuring-out
    open: >-
      gameTestBuild cannot run before the services start: playtestPaperEnvironment reads
      TYPEWRITER_CONFIG_FILE and STACK_GAME_ENGINES as task inputs
      (services/runtime/engine/runtimes/paper/build.gradle.kts), which the stack publishes once its
      services run. Only the Realm host's Gradle build overlaps the Cargo builds.
    tries:
      - id: game-suite-in-the-stack-gradle-run
        what: the game stack adds gameTestBuild to the one Gradle run of its build phase
        taught: gameTestBuild's paper additions take stack values as inputs, so it fails before the services publish them
        state: dropped
        why: every game run would fail before any requirement; all three review critics found it from source
        evidence: [services/build-logic/src/main/kotlin/com.typewritermc.game-test.gradle.kts gameTestBuild]
  - id: shallow-checkouts
    status: done
  - id: panel-gradle-outputs
    status: done

decided:
  - id: approved-items
    what: >-
      The game stack generates only the protocol (since widened, protocol-only-for-every-stack); reuse the typewriter-stack binary and the
      release .wasm components while what they read is unchanged; cache cargo dependency builds; overlap
      the Gradle builds with the cargo builds; shallow checkout for the game suite (since widened, shallow-checkouts); the panel
      suites keep Gradle's build outputs. Not in scope: one shared build job, wasmtime
      optimization, Gradle configuration cache, sharding.
  - id: protocol-only-for-every-stack
    what: >-
      Widened 2026-11-24 from the game stack alone: every stack, and cargo xtask stack run,
      generates only the protocol before its builds. Every stack build compiles against the
      protocol's generated sources and nothing else generated, so the Flutter and frame vector
      generators only cost time there; the panel suites still generate what they need themselves.
      One rule for every stack instead of a game stack exception.
  - id: shallow-checkouts
    what: >-
      Widened 2026-11-25 from the game suite: plan, check, review, report and the review
      workflow's covered job check out one commit too, and xtask fetches the history down to the
      merge base itself (review::change reach_merge_base, used by the review verdict's patch id).
      A full history fetch cost each of them about as much as the game suite's, and once xtask
      fetches what it needs, a shallow checkout serves every job that compares with the base. The
      commits job keeps its full range, since it reads every commit of it.
  - id: one-shared-components-build
    what: >-
      Decided 2026-11-27 (review round 12): the stack, cargo xtask deploy and the components check
      build every backend component (each workspace member whose library is only a cdylib) in one
      build with one stamp, and each takes the artifacts it needs. The job count is no input. Two
      builds stamping the same .wasm with different package sets would undo each other's stamps
      on the shared volume. Building the test components for a deploy costs little, as they are
      tiny and share every dependency.
  - id: native-tools-in-the-digest
    what: >-
      Decided 2026-11-27 (review round 12): a build's digest holds the path and --version output
      of the C compiler (CC, or cc) and of each linker a CARGO_TARGET_<TRIPLE>_LINKER names, beside
      rustc -vV, since build scripts compile C with it and the final link runs through one. A
      linker a Cargo configuration file names is covered by hashing that file.
  - id: rust-targets-on-the-volume
    what: >-
      The release wasm targets and the component test workspace's debug target live on the
      Namespace cache volume, not actions/cache: the repository's actions/cache held 9.6 of its
      10 GB on 2026-11-24, almost all per commit Gradle output entries, while the volume had 48 of
      70 GB free. A stamp beside the artifacts makes a stale or reverted volume cost a rebuild,
      never a wrong binary.
  - id: one-build-phase
    what: >-
      A stack runs every build its services declare at once before the first service starts: each
      Cargo build on a thread, every Gradle build (today the Realm host) in one Gradle run. A
      service's command refuses to run a build it did not declare.
  - id: inputs-are-the-declared-trees
    what: >-
      Decided 2026-11-27 after review rounds 7 to 9 each found another hole in the read set
      (inputs found by digging through Cargo's target folder: unit dependency files, build script
      output, a rule for scripts that watch nothing), which this replaces; refined in rounds 10
      and 11. A build declares the files and folders it reads: its workspace's manifest and lock
      file, the folder of every repository package it builds, and the paths each such package lists
      in its manifest's [package.metadata.typewriter] inputs for what it embeds from outside its
      folder (all from the one typed cargo metadata read). The packages are those reachable, in
      the metadata's resolve graph, from the packages its typed invocation selects (packages,
      profile, target and job count, from which the build makes its Cargo command), through
      normal and build dependencies: an edit to a workspace member the build never compiles
      reuses it. Every Cargo build brings the protocol's generated sources up to date itself
      before it hashes them. What Cargo
      writes to its target or build directory is never input. Not the workspace's whole folder, nor
      the whole backend tree: the release components would rebuild for an edit to a component test
      case or backend/AGENTS.md, the stack binary for each component it never compiles. A package
      with no source outside the repository (a local [patch]) fails the build, as neither the
      stamp nor Cargo.lock would notice an edit to it. The stamp lists the sha256 of every file
      Git does not ignore in the trees (untracked ones too, so a new module counts before it is
      added) and of the generated protocol sources inside them, each taken before Cargo starts so
      an edit during the build rebuilds next time; of every Cargo configuration file Cargo loads
      (recorded absent while missing); and, after Cargo ran, of each artifact and each variable
      outside CARGO and RUST a build script watches. Entries are typed, a file or a variable.
      Beside them, a digest of the command, rustc -vV and every inherited CARGO and RUST variable
      but those Cargo sets per crate. The build is reused while all of them match. Generators list
      their inputs and outputs through the same Git listing. A build that read a repository file
      its stamp does not hash fails, naming it: the dependency file Cargo documents beside each
      artifact names what the crates read and what the repository's build scripts watch, and each
      must be a hashed file or a folder inside the trees a script watches, so an ignored file
      inside a tree is refused too. A registry or Git dependency may read and watch anything
      outside the repository; build script output is read only for watched variables. The
      declaration lives with the crate that embeds, not with the build's caller: a caller list
      missed the component test crate's embed of the user organization's join transaction on CI.
      Watched variables are stamped rather than refused, since registry build scripts such as
      cc's watch dozens (CC, CFLAGS, SDKROOT). Known issues: a variable a crate reads at compile
      time outside CARGO and RUST is not an input unless a build script watches it, a procedural
      macro that reads a file no dependency file names is trusted, as Cargo trusts it, and an
      ignored file inside a folder a build script watches is not hashed. Why xtask decides at all:
      Cargo judges local crates by file times, which a fresh checkout resets, and its content based
      check (-Z checksum-freshness) is refused on the pinned 1.100 stable toolchain. When checksum
      freshness is stable, it replaces the declared trees and their checks; keep only the cache
      volume and the removal of each artifact before Cargo runs.
  - id: panel-restores-services-outputs
    what: >-
      The panel suites restore the services check's Gradle build cache and save none of their own,
      so the full actions/cache gets no new per commit entries.

slices:
  - id: digest-module
    tests: [generate tests]
    status: done
  - id: build-stamps
    tests: [cargo_build tests]
    status: done
  - id: parallel-stack-builds
    tests: [stack::spec build tests]
    status: done
  - id: typewriter-stack-builds
    tests: [stack::typewriter build tests, a real local build of the stack binary and components]
    status: done
    evidence: [local build 2026-11-24, stack binary 398 s then 3 s reused, components 166 s then 0.35 s reused]
  - id: shallow-merge-base
    tests: [review::change shallow checkout tests]
    status: done
  - id: workflow
    tests: [first CI run timings]
    status: building
    evidence: [e2e (game) passed on c215ec9 with the guard on the real stack build]

next: >-
  Review rounds on PR 584 until it is ready, then measure the saving on a CI run that reuses both
  builds. After that, ask whether the game suite's stack values should leave gameTestBuild's
  inputs so it can overlap too (overlap-gradle-with-cargo).
