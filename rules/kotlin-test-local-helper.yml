id: kotlin-test-local-helper
language: kotlin
severity: error
message: A test file declares a helper.
note: >-
  A test file holds its suite declaration (`val X by testSuite { }`) and its test cases. Move pumps,
  setups, fakes, assertions and data builders to `services/testing/typewriter-test-kit` or the
  module's `src/testFixtures`; keep test data inline, as values or constants. Declarations inside
  a test case belong to that case and may stay.
files:
  - services/**/src/test/**/*.kt
ignores:
  # Inputs the codegen tests compile, not tests.
  - services/sdk/typewriter-codegen/src/test/fixtures/**
rule:
  any:
    # Top level: only the suite declaration and constants (`const val`), which are test data.
    - all:
        - inside: { kind: source_file }
        - any:
            - kind: function_declaration
            - kind: class_declaration
            - kind: object_declaration
            - kind: type_alias
            - kind: property_declaration
        - not:
            kind: property_declaration
            any:
              - has: { kind: property_delegate, regex: '^by\s+testSuite\b' }
              - has: { kind: modifiers, has: { kind: property_modifier, regex: '^const$' } }
    # Inside the suite but outside a test case: no named functions, classes or objects. An
    # override is a member of an anonymous object (the grammar reads `object : T { }` as a call
    # with a trailing lambda, so the override is how the member shows).
    - all:
        - not: { inside: { kind: call_expression, has: { kind: simple_identifier, regex: '^test$' }, stopBy: end } }
        - any:
            - kind: function_declaration
            - kind: class_declaration
            - kind: object_declaration
        - not: { inside: { kind: source_file } }
        - not: { has: { kind: modifiers, has: { kind: member_modifier, regex: '^override$' } } }
        - not: { inside: { any: [{ kind: class_declaration }, { kind: object_declaration }], stopBy: end } }
    # Inside the suite but outside a test case: a lambda bound to a name is a named helper too.
    - all:
        - not: { inside: { kind: call_expression, has: { kind: simple_identifier, regex: '^test$' }, stopBy: end } }
        - kind: property_declaration
        - not: { inside: { kind: source_file } }
        - has: { kind: lambda_literal }
