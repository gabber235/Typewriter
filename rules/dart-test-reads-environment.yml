id: dart-test-reads-environment
language: dart
severity: error
message: A test reads the process environment, so it behaves differently per machine.
note: Ask the harness for what the test needs (the stack, a fixture, a compile time define), or delete the test.
files:
  - panel/test/**
  - panel/testing/**
  - panel/testkit/test/**
  - panel/widgetbook/test/**
ignores:
  # Rewrites the shared creation fixture only when asked; every run reads the committed one.
  - panel/test/authoring/application/resource_creation_flow_test.dart
rule:
  # Dart patterns cannot start inside an expression, so match the member access by kind.
  kind: member_expression
  regex: ^Platform\.environment$
