# Requirement: a component test file holds only its fixture declaration and its test cases. Every
# setup, seed, request driver, assertion and builder lives in the component test kit
# (`typewriter-component-test` or `component-test-core`), so cases share one vocabulary and a
# helper is never rebuilt per file.
#
# Allowed in suite files: `use` and `mod` declarations, constants and statics holding test data,
# `#[component_test]` functions, the `#[component_fixture]` struct, and its `impl FixtureSpec`
# block. The fixture macro reads that struct and that impl in place, so neither can move to the
# kit. Closures inside a test case are part of the case.
id: rust-component-test-local-helper
language: rust
severity: error
message: A component test file declares a helper.
note: Move it into `backend/tests/component/crates/typewriter-component-test`, or inline it into the case.
files:
  - "backend/tests/component/suite/src/**/*.rs"
ignores:
  - "backend/tests/component/suite/src/catalog.rs"
rule:
  any:
    - kind: function_item
    - kind: struct_item
    - kind: enum_item
    - kind: union_item
    - kind: impl_item
    - kind: trait_item
    - kind: type_item
    - kind: macro_definition
  inside:
    any:
      - kind: source_file
      - kind: declaration_list
        inside:
          kind: mod_item
  not:
    any:
      # A test case.
      - kind: function_item
        follows:
          kind: attribute_item
          regex: "^#\\[component_test"
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
      # The fixture the test cases run on.
      - kind: struct_item
        follows:
          kind: attribute_item
          regex: "^#\\[component_fixture"
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
      # The fixture's configuration.
      - kind: impl_item
        has:
          field: trait
          regex: "^FixtureSpec$"
