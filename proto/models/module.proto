syntax = "proto3";

package typewriter.models.v1;

message Module {
  string id = 1;
  string name = 2;
  ModuleType type = 3;
  string short_description = 4;
  repeated ModuleVersion versions = 5;
}

message ModuleVersion {
  string version = 1;
  ModuleVersionState state = 2;
}

enum ModuleType {
  MODULE_TYPE_ENGINE = 0;
  MODULE_TYPE_EXTENSION = 1;
}

enum ModuleVersionState {
  MODULE_VERSION_STATE_DEVELOPING = 0;
  MODULE_VERSION_STATE_PUBLISHED = 1;
  MODULE_VERSION_STATE_YOINKED = 2;
}
