syntax = "proto3";

package typewriter.api.v1;

import "models/book.proto";
import "models/common.proto";

message SearchPagesRequest {
  string book_id = 1;
  optional string search = 2;
}

message SearchPagesResult {
  repeated typewriter.models.v1.Page pages = 1;
}

message SearchPagesResponse {
  oneof result {
    SearchPagesResult pages = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message GetPageRequest {
  string page_id = 1;
}

message GetPageResponse {
  oneof result {
    typewriter.models.v1.Page page = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message UpdatePageRequest {
  typewriter.models.v1.Page page = 1;
}

message UpdatePageResponse {
  oneof result {
    typewriter.models.v1.Page page = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message ChangePageChapterRequest {
  string page_id = 1;
  string chapter = 2;
}

message ChangePageChapterResponse {
  oneof result {
    bool success = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message ChangePagePriorityRequest {
  string page_id = 1;
  int32 priority = 2;
}

message ChangePagePriorityResponse {
  oneof result {
    bool success = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message RenamePageRequest {
  string page_id = 1;
  string name = 2;
}

message RenamePageResponse {
  oneof result {
    bool success = 1;
    typewriter.models.v1.Error error = 2;
  }
}
