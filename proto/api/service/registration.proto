syntax = "proto3";

package typewriter.api.v1;

import "models/common.proto";
import "models/service.proto";

// =============================================================================
// Service Status Query
// Subject: typewriter.in.service.{service_id}.status
// Used by auth-permissions and services to check binding status.
// =============================================================================

// GetServiceStatusRequest queries a service's binding status.
// Service ID is extracted from the NATS subject.
message GetServiceStatusRequest {}

// GetServiceStatusResponse returns the service's binding status.
message GetServiceStatusResponse {
  oneof result {
    ServiceStatus status = 1;
    typewriter.models.v1.Error error = 2;
  }
}

// ServiceStatus indicates whether a service is bound to an organization.
message ServiceStatus {
  oneof binding {
    BoundStatus bound = 1;
    UnboundStatus unbound = 2;
  }
}

// BoundStatus indicates the service is bound to an organization.
message BoundStatus {
  string organization_id = 1;
  string organization_name = 2;
}

// UnboundStatus indicates the service needs registration.
message UnboundStatus {
  string registration_token = 1;
}

// =============================================================================
// Bind Service
// Subject: typewriter.in.user.{user_id}.organization.{org_id}.services.bind
// Used by Panel to bind a service using a registration token.
// =============================================================================

// BindServiceRequest binds a service to the organization using a token.
message BindServiceRequest {
  string registration_token = 1;
}

// BindServiceResponse returns the bound service or an error.
message BindServiceResponse {
  oneof result {
    BoundService service = 1;
    typewriter.models.v1.Error error = 2;
  }
}

// BoundService contains info about the newly bound service.
message BoundService {
  string service_id = 1;
  string service_name = 2;
  repeated typewriter.models.v1.ServiceType service_types = 3;
}

// =============================================================================
// List Organization Services
// Subject: typewriter.in.user.{user_id}.organization.{org_id}.services.list
// Used by Panel to list all services in an organization.
// =============================================================================

// ListOrganizationServicesRequest requests all services for an organization.
// Organization ID is extracted from the NATS subject.
message ListOrganizationServicesRequest {}

// ListOrganizationServicesResponse returns the services or an error.
message ListOrganizationServicesResponse {
  oneof result {
    OrganizationServicesList services = 1;
    typewriter.models.v1.Error error = 2;
  }
}

// OrganizationServicesList contains the list of services.
message OrganizationServicesList {
  repeated typewriter.models.v1.Service services = 1;
}

// =============================================================================
// Bound Notification
// Subject: typewriter.out.service.{service_id}.registration.bound
// Published when a service is successfully bound to an organization.
// =============================================================================

// ServiceBoundNotification is published when binding completes.
message ServiceBoundNotification {
  string organization_id = 1;
  string organization_name = 2;
}

// =============================================================================
// Update Service
// Subject: typewriter.in.user.{user_id}.organization.{org_id}.services.update
// Used by Panel to update a service's name.
// =============================================================================

// UpdateServiceRequest updates a service's metadata.
// Service must be bound to the organization specified in the NATS subject.
message UpdateServiceRequest {
  string service_id = 1;
  string name = 2;
}

// UpdateServiceResponse returns the updated service or an error.
message UpdateServiceResponse {
  oneof result {
    typewriter.models.v1.Service service = 1;
    typewriter.models.v1.Error error = 2;
  }
}

// =============================================================================
// Unbind Service
// Subject: typewriter.in.user.{user_id}.organization.{org_id}.services.unbind
// Used by Panel to unbind a service from an organization.
// The service record remains but is no longer bound. When the service
// reconnects, it will be assigned a new registration token.
// =============================================================================

// UnbindServiceRequest removes a service from the organization.
// Service must be bound to the organization specified in the NATS subject.
message UnbindServiceRequest {
  string service_id = 1;
}

// UnbindServiceResponse returns success or an error.
message UnbindServiceResponse {
  oneof result {
    bool success = 1;
    typewriter.models.v1.Error error = 2;
  }
}

// =============================================================================
// Service Heartbeat
// Subject: typewriter.in.service.{service_id}.heartbeat
// Sent by services periodically to update their last_seen timestamp.
// Fire-and-forget - no response is sent.
// =============================================================================

// ServiceHeartbeatRequest updates the service's last_seen timestamp.
// Service ID is extracted from the NATS subject.
message ServiceHeartbeatRequest {}
