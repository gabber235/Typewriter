syntax = "proto3";

package typewriter.api.v1;

import "models/manual.proto";
import "models/common.proto";


message ListManualsRequest {}

message ListManualsResponse {
  repeated typewriter.models.v1.Manual manuals = 1;
}

message GetManualRequest {
  string id = 1;
}

message GetManualResponse {
  oneof result {
    typewriter.models.v1.Manual manual = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message CreateManualRequest {
  string name = 1;
}

message CreateManualResponse {
  oneof result {
    typewriter.models.v1.Manual manual = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message DeleteManualRequest {
  string id = 1;
}

message DeleteManualResponse {
  oneof result {
    bool success = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message ChangePlatformTargetsRequest {
  string manual_id = 1;
  repeated typewriter.models.v1.PlatformTarget proposed = 2;
}

message ChangePlatformTargetsResponse {
  oneof result {
    typewriter.models.v1.Manual manual = 1;
    typewriter.models.v1.Error error = 2;
  }
}

message ChangeModulesRequest {
  string manual_id = 1;
  repeated typewriter.models.v1.ManualModuleReference proposed = 2;
}

message ChangeModulesResponse {
  oneof result {
    typewriter.models.v1.Manual manual = 1;
    typewriter.models.v1.Error error = 2;
  }
}
