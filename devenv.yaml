inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  # languages.rust pins an exact toolchain and the wasm32-wasip2 target through it.
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  # git-hooks registers the commit-msg and pre-commit hooks (devenv.nix).
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Flutter beta: the upstream release archive behind a launcher (devenv.nix).
  flutter-overlay:
    url: github:gabber235/flutter-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
require_version: ">=2.4"
nixpkgs:
  # The 1Password CLI (`op`, devenv.nix) is the only unfree package.
  permitted_unfree_packages:
    - 1password-cli
# xtask and `secretspec run` resolve secrets when a command needs them (secretspec.toml). devenv's
# own integration would resolve them on every shell entry and fail without 1Password.
secretspec:
  enable: false
