<div class="mb-1 pb-1 border-b border-[var(--sl-color-hairline-shade)] text-base font-bold text-primary">Entry</div><div class="sl-markdown-content text-[var(--sl-color-text)] leading-relaxed text-xs"><p>An <strong>entry</strong> is the smallest building block of Typewriter content. Pages are
