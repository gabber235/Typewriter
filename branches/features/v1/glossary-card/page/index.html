<div class="mb-1 pb-1 border-b border-[var(--sl-color-hairline-shade)] text-base font-bold text-primary">Page</div><div class="sl-markdown-content text-[var(--sl-color-text)] leading-relaxed text-xs"><p>A <strong>page</strong> is a top-level container for entries in the web panel. Every page
