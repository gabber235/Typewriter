<div class="mb-1 pb-1 border-b border-[var(--sl-color-hairline-shade)] text-base font-bold text-primary">Page</div><div class="sl-markdown-content text-[var(--sl-color-text)] leading-relaxed text-xs"><p>A <strong>page</strong> holds <a href="/branches/features/v1-docs/glossary/#page-element">page elements</a> inside a
