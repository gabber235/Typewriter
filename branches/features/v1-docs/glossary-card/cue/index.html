<div class="mb-1 pb-1 border-b border-[var(--sl-color-hairline-shade)] text-base font-bold text-primary">Cue</div><div class="sl-markdown-content text-[var(--sl-color-text)] leading-relaxed text-xs"><p>A <strong>cue</strong> is a block on a <a href="/branches/features/v1-docs/glossary/#scene">scene</a>’s <a href="/branches/features/v1-docs/glossary/#track">track</a>:
either a <em>segment</em> with a start and end frame, or a <em>keyframe</em> at a single
frame. Cues on one track cannot overlap. 20 frames make one second.</p></div>
