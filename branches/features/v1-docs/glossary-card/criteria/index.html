<div class="mb-1 pb-1 border-b border-[var(--sl-color-hairline-shade)] text-base font-bold text-primary">Criteria</div><div class="sl-markdown-content text-[var(--sl-color-text)] leading-relaxed text-xs"><p><strong>Criteria</strong> are the conditions on an <a href="/branches/features/v1-docs/glossary/#entry">entry</a>: a
