# Temporary. Measures the in process input prototype on a free runner. Only the prototype branch triggers it.
name: Game verification in process input prototype

on:
  push:
    branches: [proto/gv-input]
    paths:
      - prototypes/game-verification/**
      - .github/workflows/gv-input-prototype.yml

permissions:
  contents: read

concurrency:
  group: gv-input-prototype
  cancel-in-progress: true

jobs:
  measure:
    name: inproc ${{ matrix.row }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        row: [crossdbg]
    defaults:
      run:
        working-directory: prototypes/game-verification
    steps:
      - name: Mark job start
        working-directory: .
        run: echo "JOB_T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            prototypes/game-verification
            .github
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Xvfb, libXtst and the software renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 mesa-vulkan-drivers libvulkan1 \
            mesa-utils mesa-utils-bin vulkan-tools python3-numpy python3-pil python3-xlib libxtst6 \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libasound2t64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            prototypes/game-verification/.gradle
            prototypes/game-verification/cache
          key: gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('prototypes/game-verification/orchestrator/run.py') }}
          restore-keys: |
            gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-
            gv-${{ runner.arch }}-
      - name: Fetch Paper and build the probes
        run: |
          /usr/bin/python3 orchestrator/run.py prepare
          ./gradlew --no-daemon --console=plain -q :probe-mod:writeClientLaunch :probe-mod:jar :probe-plugin:jar :step-agent:jar
      # A failed job skips the cache save, and a failed cell is data read from the artifact.
      - name: Measure
        continue-on-error: true
        env:
          CI_BUDGET_S: "2100"
        run: /usr/bin/python3 orchestrator/inproc.py ci --row ${{ matrix.row }} --backend vulkan
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inproc-${{ matrix.row }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prototypes/game-verification/runs/h.jsonl
            prototypes/game-verification/runs/h-evidence
            prototypes/game-verification/runs/inproc.jsonl
            prototypes/game-verification/runs/inproc
            prototypes/game-verification/runs/n-logs
