name: CI Documentation

on:
  pull_request:
    paths:
      - "documentation/**"
  workflow_dispatch:

jobs:
  test:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
        working-directory: ./documentation
      - name: Build website
        run: npm run build
        working-directory: ./documentation
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
