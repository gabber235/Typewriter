name: CI Database

on:
  pull_request:
    paths:
      - "backend/database/**"
      - "backend/surrealkit.toml"
      - ".dagger/database.go"
      - ".github/workflows/ci-database.yml"
  push:
    paths:
      - "backend/database/**"
      - "backend/surrealkit.toml"
      - ".dagger/database.go"
      - ".github/workflows/ci-database.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate canonical database schema through Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.21.8
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: database-test stdout

      - name: Build database artifact image through Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.21.8
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: database-image sync
