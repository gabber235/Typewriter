# Temporary. Measures the game verification prototypes (restore prototype) on a free runner. Only the prototype branch
# triggers it, and it is removed when the search ends. Change matrix.include to pick what runs.
name: Game verification prototype

on:
  push:
    branches: [proto/gv-restore]
    paths:
      - prototypes/game-verification/**
      - .github/workflows/game-verification-prototype.yml

permissions:
  contents: read

concurrency:
  group: game-verification-restore
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.plan }} ${{ matrix.backend }} ${{ matrix.runner }} ${{ matrix.repeat }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plan: restore, backend: vulkan, runner: ubuntu-24.04, repeat: 0 }
    defaults:
      run:
        working-directory: prototypes/game-verification
    steps:
      - name: Mark job start
        working-directory: .
        run: echo "JOB_T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            prototypes/game-verification
            .github
      # Full CRaC needs Azul's Zulu CRaC bundle (not in setup-java's list); CRIU must be setuid root.
      - name: Install Zulu 25 CRaC
        working-directory: .
        run: |
          url=$(curl -fsS 'https://api.azul.com/metadata/v1/zulu/packages/?java_version=25&os=linux&arch=x64&crac_supported=true&java_package_type=jdk&archive_type=tar.gz&latest=true&release_status=ga&availability_types=CA&page_size=1' | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["download_url"])')
          echo "$url"
          curl -fsSL "$url" -o /tmp/zulu.tgz
          sudo mkdir -p /opt/zulu && sudo tar zxf /tmp/zulu.tgz -C /opt/zulu --strip-components=1
          sudo chown root:root /opt/zulu/lib/criu && sudo chmod u+s /opt/zulu/lib/criu
          ls -l /opt/zulu/lib/criu
          echo "JAVA_HOME=/opt/zulu" >> "$GITHUB_ENV"
          echo "/opt/zulu/bin" >> "$GITHUB_PATH"
          /opt/zulu/bin/java -version
          findmnt -T /opt/zulu || true
          systemctl is-active nscd || true
      - name: Install Xvfb and the software renderers
        run: |
          date +%T
          sudo apt-get update -qq
          date +%T
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 mesa-vulkan-drivers libvulkan1 \
            mesa-utils mesa-utils-bin vulkan-tools python3-numpy python3-pil python3-xlib ffmpeg \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libasound2t64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            prototypes/game-verification/.gradle
            prototypes/game-verification/cache
          key: gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('prototypes/game-verification/orchestrator/run.py') }}
          restore-keys: |
            gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-
            gv-${{ runner.arch }}-
      - name: Fetch Paper and build the probes
        run: |
          /usr/bin/python3 orchestrator/run.py prepare
          ./gradlew --no-daemon --console=plain -q :probe-mod:writeClientLaunch :probe-mod:jar :probe-plugin:jar :coverage-tool:writeCoverageTool :step-agent:jar
      # A failed job skips the cache save, and a failed cell is data read from the artifact.
      - name: Measure
        continue-on-error: true
        env:
          MATRIX_REPEAT: ${{ matrix.repeat }}
          CI_BUDGET_S: "5100"
        run: /usr/bin/python3 orchestrator/ci.py plan ${{ matrix.plan }} --backend ${{ matrix.backend }}
      - name: Upload results and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-${{ matrix.plan }}-${{ matrix.backend }}-${{ runner.arch }}-${{ matrix.repeat }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prototypes/game-verification/runs/h.jsonl
            prototypes/game-verification/runs/c-speed.jsonl
            prototypes/game-verification/runs/shots
            prototypes/game-verification/runs/h-evidence
            prototypes/game-verification/runs/b-video.jsonl
            prototypes/game-verification/runs/video
            prototypes/game-verification/runs/f-goldens.jsonl
            prototypes/game-verification/runs/f-goldens
            prototypes/game-verification/runs/i-coverage.jsonl
            prototypes/game-verification/runs/i-coverage/*-lines.jsonl
            prototypes/game-verification/runs/e-readiness
            prototypes/game-verification/runs/d-clients.jsonl
            prototypes/game-verification/runs/d-clients.jsonl
            prototypes/game-verification/runs/e-readiness
            prototypes/game-verification/runs/d-clients.jsonl
            prototypes/game-verification/runs/d-clients
            prototypes/game-verification/runs/j-input.jsonl
            prototypes/game-verification/runs/j-input
            prototypes/game-verification/runs/k.jsonl
            prototypes/game-verification/runs/n.jsonl
            prototypes/game-verification/runs/n-logs
            prototypes/game-verification/runs/topo.jsonl
            prototypes/game-verification/runs/restore.jsonl
            prototypes/game-verification/runs/image-*.log
            prototypes/game-verification/runs/fail-*
