# Temporary. Measures the game verification prototypes on a free runner. Only the prototype branch
# triggers it, and it is removed when the search ends. Change matrix.include to pick what runs.
name: Game verification prototype

on:
  push:
    branches: [feat/game-verification-prototypes]
    paths:
      - prototypes/game-verification/**
      - .github/workflows/game-verification-prototype.yml

permissions:
  contents: read

concurrency:
  group: game-verification-prototype
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.plan }} ${{ matrix.backend }} ${{ matrix.runner }} ${{ matrix.repeat }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plan: fps, backend: opengl, runner: ubuntu-24.04, repeat: 0 }
          - { plan: fps, backend: vulkan, runner: ubuntu-24.04, repeat: 0 }
          - { plan: fps, backend: opengl, runner: ubuntu-24.04-arm, repeat: 0 }
          - { plan: speed, backend: opengl, runner: ubuntu-24.04, repeat: 0 }
          - { plan: speed, backend: vulkan, runner: ubuntu-24.04, repeat: 0 }
          - { plan: speed, backend: opengl, runner: ubuntu-24.04-arm, repeat: 0 }
          - { plan: multi, backend: opengl, runner: ubuntu-24.04, repeat: 0 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 1 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 2 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 3 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 4 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 5 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04, repeat: 6 }
          - { plan: flake, backend: vulkan, runner: ubuntu-24.04, repeat: 1 }
          - { plan: flake, backend: vulkan, runner: ubuntu-24.04, repeat: 2 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04-arm, repeat: 1 }
          - { plan: flake, backend: opengl, runner: ubuntu-24.04-arm, repeat: 2 }
    defaults:
      run:
        working-directory: prototypes/game-verification
    steps:
      - name: Mark job start
        working-directory: .
        run: echo "JOB_T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            prototypes/game-verification
            .github
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Xvfb and the software renderers
        run: |
          date +%T
          sudo apt-get update -qq
          date +%T
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 mesa-vulkan-drivers libvulkan1 \
            mesa-utils mesa-utils-bin vulkan-tools python3-numpy python3-pil \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libasound2t64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            prototypes/game-verification/.gradle
            prototypes/game-verification/cache
          key: gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('prototypes/game-verification/orchestrator/run.py') }}
          restore-keys: |
            gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-
            gv-${{ runner.arch }}-
      - name: Fetch Paper and build the probes
        run: |
          /usr/bin/python3 orchestrator/run.py prepare
          ./gradlew --no-daemon --console=plain -q :probe-mod:writeClientLaunch :probe-mod:jar :probe-plugin:jar
      # A failed job skips the cache save, and a failed cell is data read from the artifact.
      - name: Measure
        continue-on-error: true
        run: /usr/bin/python3 orchestrator/ci.py plan ${{ matrix.plan }} --backend ${{ matrix.backend }}
      - name: Upload results and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-${{ matrix.plan }}-${{ matrix.backend }}-${{ runner.arch }}-${{ matrix.repeat }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prototypes/game-verification/runs/h.jsonl
            prototypes/game-verification/runs/c-speed.jsonl
            prototypes/game-verification/runs/shots
            prototypes/game-verification/runs/h-evidence
