# Temporary. Measures the demo video prototype on a free runner. Only the prototype branch triggers it.
name: Game verification video prototype

on:
  push:
    branches: [proto/gv-video]
    paths:
      - prototypes/game-verification/**
      - .github/workflows/gv-video-prototype.yml

permissions:
  contents: read

concurrency:
  group: gv-video-prototype
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.plan }} ${{ matrix.backend }} ${{ matrix.runner }} ${{ matrix.repeat }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plan: demo, backend: vulkan, runner: ubuntu-24.04, repeat: 0 }
    defaults:
      run:
        working-directory: prototypes/game-verification
    steps:
      - name: Mark job start
        working-directory: .
        run: echo "JOB_T0=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            prototypes/game-verification
            .github
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Xvfb and the software renderers
        run: |
          date +%T
          sudo apt-get update -qq
          date +%T
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 mesa-vulkan-drivers libvulkan1 \
            mesa-utils mesa-utils-bin vulkan-tools python3-numpy python3-pil python3-xlib ffmpeg \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libasound2t64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            prototypes/game-verification/.gradle
            prototypes/game-verification/cache
          key: gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('prototypes/game-verification/orchestrator/run.py') }}
          restore-keys: |
            gv-${{ runner.arch }}-${{ hashFiles('prototypes/game-verification/**/*.gradle', 'prototypes/game-verification/gradle.properties', 'prototypes/game-verification/gradle/wrapper/gradle-wrapper.properties') }}-
            gv-${{ runner.arch }}-
      - name: Fetch Paper and build the probes
        run: |
          /usr/bin/python3 orchestrator/run.py prepare
          ./gradlew --no-daemon --console=plain -q :probe-mod:writeClientLaunch :probe-mod:jar :probe-plugin:jar :step-agent:jar
      # A failed job skips the cache save, and a failed cell is data read from the artifact.
      - name: Measure
        continue-on-error: true
        env:
          MATRIX_REPEAT: ${{ matrix.repeat }}
        run: /usr/bin/python3 orchestrator/ci.py plan ${{ matrix.plan }} --backend ${{ matrix.backend }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-results-${{ matrix.backend }}-${{ runner.arch }}-${{ matrix.repeat }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prototypes/game-verification/runs/h.jsonl
            prototypes/game-verification/runs/h-evidence
            prototypes/game-verification/runs/demo.jsonl
            prototypes/game-verification/runs/demo-*/*.json
            prototypes/game-verification/runs/demo-*/stream.jsonl
            prototypes/game-verification/runs/demo-*/videos/*.frames.jsonl
            prototypes/game-verification/runs/n-logs
      - name: Upload one clip per hard case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-clips-${{ matrix.backend }}-${{ runner.arch }}-${{ matrix.repeat }}
          retention-days: 14
          if-no-files-found: warn
          path: prototypes/game-verification/runs/clips
