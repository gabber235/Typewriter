name: Commitlint

on:
  pull_request:
  push:

jobs:
  commitlint:
    name: ${{ github.event_name == 'pull_request' && 'commitlint-pr-range' || 'commitlint-push-range' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          bunx --no-install commitlint --config commitlint.config.cjs
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint push commits
        if: github.event_name == 'push'
        run: |
          FROM_SHA="${{ github.event.before }}"
          if [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            bunx --no-install commitlint --config commitlint.config.cjs --last --verbose
            exit 0
          fi
          if ! git cat-file -e "${FROM_SHA}^{commit}"; then
            git fetch --no-tags origin "$FROM_SHA"
          fi
          bunx --no-install commitlint --config commitlint.config.cjs \
            --from "$FROM_SHA" \
            --to "${{ github.sha }}" --verbose
