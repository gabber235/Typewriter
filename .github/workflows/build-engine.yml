name: Build Typewriter Engine

on:
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
        description: Encrypts the configuration cache so setup-gradle can restore it between runs

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read build settings
        id: settings
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('settings.toml', 'rb') as file:
              settings = tomllib.load(file)
          print(f"version={settings['version']}")
          print(f"java={settings['java']}")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.settings.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
          build-scan-publish: ${{ github.event_name != 'pull_request' }}
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build Engine
        uses: ./.github/actions/build-engine

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Typewriter.jar
          path: jars/engine/*.jar
          if-no-files-found: error
