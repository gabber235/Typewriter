name: Build Specified Extension

on:
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
        description: The name of the extension to build
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
        description: Encrypts the configuration cache so setup-gradle can restore it between runs

permissions:
  contents: read

jobs:
  build-adapter:
    name: Build ${{ inputs.extension }} Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read build settings
        id: settings
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('settings.toml', 'rb') as file:
              settings = tomllib.load(file)
          print(f"version={settings['version']}")
          print(f"java={settings['java']}")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.settings.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build Adapter
        uses: ./.github/actions/build-extension
        with:
          extension: ${{ inputs.extension }}

      - name: Upload Extension
        uses: actions/upload-artifact@v4
        with:
          path: jars/extensions/${{ inputs.extension }}.jar
          name: ${{ inputs.extension }}.jar
