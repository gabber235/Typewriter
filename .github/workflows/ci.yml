# The pull request workflow. Every job is one `cargo xtask` line inside the devenv shell, so CI
# runs exactly what a developer runs; `gate` is the one required check. Pushes to the long lived
# branches run it too: they check what each push changed and save the tool caches every pull
# request into them restores (.github/actions/devenv).
# Jobs run on Namespace runners of 4 vCPU and 16 GB that share the `typewriter` cache volume for
# the Nix store; .github/actions/devenv says what lives there.
name: CI

on:
  pull_request:
  push:
    branches: [develop, features/v1]
  # The Flutter bump dispatches this on its branch: a pull request opened with the workflow token
  # starts no workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A push compares with the commit before it. A dispatched run, or a push that creates its branch,
# has nothing before it: it compares with develop, where the Flutter bump starts.
env:
  BASE_SHA: >-
    ${{ github.event.pull_request.base.sha
    || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before)
    || 'origin/develop' }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # The check areas the change affects and their time budgets, straight from the check graph.
  # A change of only Markdown outside the documentation site affects none, so every other job
  # skips and the gate passes.
  plan:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-typewriter
      - nscloud-cache-size-50gb
    outputs:
      areas: ${{ steps.plan.outputs.areas }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      # One commit: xtask fetches the history down to the merge base with BASE_SHA itself.
      - uses: actions/checkout@v6
      # Every other job waits for this one, so the shell it pushes to the Nix cache is theirs to
      # pull, and the e2e shell it builds on the cache volume is there when the suites start.
      - uses: ./.github/actions/devenv
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          volume-profiles: e2e
      # The last line only: the shell may print its own messages before the JSON.
      - id: plan
        run: |
          echo "areas=$(devenv shell -- cargo xtask check --list --base "$BASE_SHA" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "suites=$(devenv shell -- cargo xtask check --list --suites --base "$BASE_SHA" | tail -n 1)" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.area.area }})
    needs: plan
    if: needs.plan.outputs.areas != '[]'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-typewriter
      - nscloud-cache-size-50gb
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    steps:
      # One commit: the quality gate fetches the history down to the merge base with BASE_SHA
      # itself.
      - uses: actions/checkout@v6
      # Generation runs Gradle and build_runner whatever the area; only the services area builds
      # enough to be worth keeping Gradle's build outputs for.
      - uses: ./.github/actions/devenv
        with:
          caches: gradle flutter frame-vectors ${{ matrix.area.area == 'services' && 'gradle-outputs' || '' }}
          cache-scope: check-${{ matrix.area.area }}
          cargo-targets: ${{ matrix.area.area == 'components' }}
      # Untimed: the budget covers the area's steps, not the shell's first build or xtask's
      # compile.
      - run: devenv shell -- cargo xtask --help > /dev/null
      - if: matrix.area.area != 'quality'
        timeout-minutes: ${{ matrix.area.budget_minutes }}
        run: devenv shell -- cargo xtask check ${{ matrix.area.area }}
      # A CI checkout has no local branches to infer a base from; pass the event's base.
      - if: matrix.area.area == 'quality'
        timeout-minutes: ${{ matrix.area.budget_minutes }}
        run: devenv shell -- cargo xtask review gate --base "$BASE_SHA"
      # Artifacts of this public repository are downloadable, so only the staged public folder
      # is uploaded.
      - if: always()
        run: devenv shell -- cargo xtask evidence stage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-check-${{ matrix.area.area }}
          path: .xtask/public/
          if-no-files-found: ignore
      # Last, and whatever happened before: a failed or timed out job still keeps its Gradle caches.
      - if: always()
        uses: ./.github/actions/devenv-save

  # full.yml checks the commits of pushes.
  commits:
    if: github.event_name != 'push'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-typewriter
      - nscloud-cache-size-50gb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
      - run: devenv shell -- cargo xtask hook commit-msg --range "$BASE_SHA..$HEAD_SHA"

  # One runner per end to end suite the change affects. The display, Mesa, Vulkan, GTK and Chromium
  # come from the devenv e2e profile, not apt. The game suite runs Minecraft clients, each on a
  # virtual display of its own, against Paper on this runner, inside the stack; the playtest suite
  # runs the framework's own requirements on Paper without the stack. Both keep Gradle's outputs (the
  # patched Paper among them) and the game downloads, and generate only the protocol's sources, so
  # they need no Flutter or frame vector cache. The panel suites generate every source, frame vectors
  # included, before their stack starts, and restore the services check's Gradle outputs for the SDK
  # fixtures and the Realm host.
  e2e:
    name: e2e (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-typewriter
      - nscloud-cache-size-50gb
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      GAME_SUITE: ${{ (matrix.suite == 'game' || matrix.suite == 'playtest') && '1' || '' }}
    steps:
      # One commit: the game suites rerun as demos the requirements that covered a line the change
      # added since its merge base with BASE_SHA, and fetch the history down to it themselves.
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
        with:
          caches: >-
            ${{ (matrix.suite == 'game' || matrix.suite == 'playtest') && 'gradle gradle-outputs game'
            || 'gradle flutter frame-vectors gradle-outputs' }}
          profile: e2e
          cache-scope: e2e-${{ matrix.suite }}
          cargo-targets: true
          gradle-outputs-from: ${{ !(matrix.suite == 'game' || matrix.suite == 'playtest') && 'check-services' || '' }}
      # The game suites' demo reruns follow the lines the change added since the same base the
      # checks compare with.
      - run: devenv --profile e2e shell -- cargo xtask e2e ${{ matrix.suite }} --base "$BASE_SHA"
        env:
          # The game suites fetch approved golden images from the evidence branch through gh.
          GH_TOKEN: ${{ github.token }}
          # This runner is the pinned one: a golden frame from any other renderer fails instead of
          # passing unchecked, so a runner that drifts from the pin cannot let every golden through.
          PLAYTEST_PINNED_RUNNER: ${{ env.GAME_SUITE }}
      # Evidence after the verdict, never part of it: the demo run never gates.
      - if: always() && env.GAME_SUITE
        run: devenv --profile e2e shell -- cargo xtask e2e ${{ matrix.suite }} --demos --base "$BASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYTEST_PINNED_RUNNER: ${{ env.GAME_SUITE }}
      # Artifacts of this public repository are downloadable, so only the staged public folder
      # is uploaded.
      - if: always()
        run: devenv --profile e2e shell -- cargo xtask evidence stage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-e2e-${{ matrix.suite }}
          path: .xtask/public/
          if-no-files-found: ignore
      # Last, and whatever happened before: a failed or timed out job still keeps its Gradle caches.
      - if: always()
        uses: ./.github/actions/devenv-save

  # Runs when checks or suites fail too, since a failure is what the description must show. Jobs
  # of other pull requests and the prune write the media branches at the same time; the publish
  # retries its push onto their commits instead of queueing behind them.
  report:
    needs: [plan, check, e2e]
    if: always() && needs.plan.outputs.areas != '[]'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-typewriter
      - nscloud-cache-size-50gb
    # The media branches, the description and code scanning. Fork pull requests get a read
    # only token whatever is asked here, so they get the job summary instead.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    # A change that affects no end to end suite skips the e2e job; that is not a failed job.
    env:
      SUITES: ${{ needs.plan.outputs.suites == '[]' && 'skipped' || 'success' }}
    steps:
      # One commit: the report fetches the history down to the merge base with BASE_SHA itself, and
      # publishing the evidence reads only the run's results and the pull request.
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: .xtask/results/inputs
      - uses: ./.github/actions/devenv
      - run: devenv shell -- cargo xtask review report --base "$BASE_SHA"
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .xtask/review/review.sarif
          category: typewriter
      - if: github.event.pull_request.head.repo.full_name == github.repository
        run: devenv shell -- cargo xtask evidence publish --pr ${{ github.event.number }} --sha "$HEAD_SHA" ${{ (needs.check.result != 'success' || needs.e2e.result != env.SUITES) && '--jobs-failed' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      # Fork pull requests, pushes and dispatched runs, which have no description to write.
      - if: github.event.pull_request.head.repo.full_name != github.repository
        run: devenv shell -- cargo xtask evidence summary --sha "$HEAD_SHA" ${{ (needs.check.result != 'success' || needs.e2e.result != env.SUITES) && '--jobs-failed' || '' }} >> "$GITHUB_STEP_SUMMARY"

  # Skipped jobs pass only when the plan found nothing to check or no suite to run, or for the
  # commits, on a push.
  gate:
    needs: [plan, check, commits, e2e, report]
    if: always()
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          COMMITS: ${{ needs.commits.result }}
          COMMITS_EXPECTED: ${{ github.event_name == 'push' && 'skipped' || 'success' }}
          AREAS: ${{ needs.plan.outputs.areas == '[]' && 'skipped' || 'success' }}
          SUITES: ${{ needs.plan.outputs.suites == '[]' && 'skipped' || 'success' }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.report.result }}
        run: >-
          test "$PLAN" = success && test "$COMMITS" = "$COMMITS_EXPECTED"
          && test "$CHECK" = "$AREAS" && test "$E2E" = "$SUITES" && test "$REPORT" = "$AREAS"
