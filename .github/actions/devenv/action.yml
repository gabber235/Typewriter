name: devenv
description: >-
  Installs Nix and devenv and builds the devenv shell, so a job's steps can run
  `devenv shell -- cargo xtask ...` exactly as on a developer machine. Nix paths come from
  gabber235.cachix.org, which trusted runs fill, as they fill the tool caches.

inputs:
  op-service-account-token:
    description: >-
      The 1Password service account token (`secrets.OP_SERVICE_ACCOUNT_TOKEN`). On a trusted run it
      reads the `cache` secrets to push the shell to gabber235.cachix.org. Fork pull requests get
      none, so they only read.
    default: ""
  caches:
    description: >-
      Tool caches besides xtask's Cargo build, space separated: `gradle` (dependencies and the
      wrapper), `gradle-outputs` (Gradle's build cache, which it turns on for this job),
      `flutter` (the pub cache) and `frame-vectors` (the Cargo build of `cargo xtask generate`'s
      frame vector writer).
    default: ""
  profile:
    description: >-
      The devenv profile the job's steps enter (`devenv --profile <profile> shell`), such as
      `e2e` for the end to end suites' display, recorder and browser; empty for the base shell.
    default: ""

runs:
  using: composite
  steps:
    # Trusted runs (pushes to the long lived branches, pull requests from this repository) push
    # to the shared Nix cache and save the tool caches. A pull request reads only its own caches
    # and its base branch's, so one into a branch that never saves (a stacked pull request) would
    # otherwise start every run cold; the 10 GB the repository gets evicts the oldest copies.
    - id: trust
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
        HAS_TOKEN: ${{ inputs.op-service-account-token != '' }}
      run: |
        long_lived=false
        if [[ $EVENT == push && ( $REF == refs/heads/develop || $REF == refs/heads/features/v1 ) ]]; then
          long_lived=true
        fi
        trusted=$long_lived
        if [[ $EVENT == pull_request && $HEAD_REPO == "$REPO" ]]; then
          trusted=true
        fi
        echo "save-caches=$trusted" >> "$GITHUB_OUTPUT"
        echo "push-nix=$([[ $trusted == true && $HAS_TOKEN == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Incremental artifacts only grow a cache that starts each job from the same state.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # A job never reuses a Gradle daemon, and an idle one held 2.4 GB that the panel's
        # analyzer (11 GB on Linux) needs on a 16 GB runner.
        echo "GRADLE_OPTS=-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process" >> "$GITHUB_ENV"
    # devenv provides every tool, so the runner's own SDKs only take the disk the Nix store and a
    # cold build need: a panel check ran out of it during generation.
    - shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
        df -h /
    - uses: cachix/install-nix-action@v31
    # Reads gabber235.cachix.org (the Rust toolchain and every other path a trusted run
    # built) and the public devenv cache. Pushing is the explicit step below, with a token only
    # trusted runs can read.
    - uses: cachix/cachix-action@v17
      with:
        name: gabber235
        extraPullNames: devenv
    - shell: bash
      run: nix profile add nixpkgs#devenv
    # The first entry builds the shell; later steps reuse it.
    #
    # Patch for the Nix resume bug (NixOS/nix#4533): when a download's connection drops, Nix
    # resumes it with a range request, the cache answers HTTP 416, and Nix treats that as fatal.
    # A new attempt keeps every path already fetched, so at most two retries, and only for that
    # error.
    - shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        log="$RUNNER_TEMP/devenv-shell.log"
        retries=0
        until devenv ${PROFILE:+--profile "$PROFILE"} shell -- true 2>&1 | tee "$log"; do
          if ! grep -qF 'HTTP error 416' "$log" || (( retries == 2 )); then
            exit 1
          fi
          retries=$((retries + 1))
          echo "::warning::Nix failed a download resume with HTTP 416; building the shell again ($retries of 2)"
        done
    # The shell's closure holds every path it built: the Rust toolchain, cargo-llvm-cov and the
    # rest. Cachix skips paths it or cache.nixos.org already has. A failed push costs the next run
    # time, not this run its result.
    - if: steps.trust.outputs.push-nix == 'true'
      continue-on-error: true
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
      run: |
        token=$(devenv shell -- secretspec get CACHIX_AUTH_TOKEN --profile cache --provider vault \
          --reason "push the devenv shell to gabber235.cachix.org")
        echo "::add-mask::$token"
        realpath .devenv/gc/* | CACHIX_AUTH_TOKEN=$token cachix push gabber235

    # Each tool cache is a pair: `actions/cache` saves at the end of the job where caches are saved,
    # `actions/cache/restore` only reads everywhere else. Keep the pair's values the same.
    #
    # xtask's dependencies, which every job compiles before its first command. The toolchain is
    # pinned in devenv.nix and devenv.lock, so a new toolchain starts empty instead of restoring
    # artifacts it would rebuild anyway; a new Cargo.lock starts from the same toolchain's last.
    - if: steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          xtask/target/debug
        key: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-${{ hashFiles('xtask/Cargo.lock') }}
        restore-keys: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-
    - if: steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          xtask/target/debug
        key: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-${{ hashFiles('xtask/Cargo.lock') }}
        restore-keys: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-

    # The dependencies of the frame vector writer, which every job that generates compiles. Its
    # own target (xtask/src/generate.rs) holds them without debug info: about 700 MB, 200 MB
    # compressed. Not part of xtask's cache: the plan job saves that one first and never generates.
    # The writer's own crate is left out; a fresh checkout's file times rebuild it anyway.
    - if: contains(inputs.caches, 'frame-vectors') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: |
          .xtask/frame-vectors-target/debug
          !.xtask/frame-vectors-target/debug/deps/*wasmcloud_utils*
        key: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-
    - if: contains(inputs.caches, 'frame-vectors') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          .xtask/frame-vectors-target/debug
          !.xtask/frame-vectors-target/debug/deps/*wasmcloud_utils*
        key: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock') }}-

    # Gradle's downloaded dependencies and distribution, keyed by the build files that pin them.
    - if: contains(inputs.caches, 'gradle') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('services/**/*.gradle.kts', 'services/gradle/libs.versions.toml', 'services/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-
    - if: contains(inputs.caches, 'gradle') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('services/**/*.gradle.kts', 'services/gradle/libs.versions.toml', 'services/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    # Gradle's build cache, on in CI only: the user home's gradle.properties wins over the
    # project's and never reaches a developer machine. Its outputs change with every commit, so
    # each save is a new entry under the commit, restored by prefix; the cache evicts the least
    # recently used entries, which are the older commits', and Gradle drops outputs unused for 7
    # days from the copy it saves.
    - if: contains(inputs.caches, 'gradle-outputs')
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
    - if: contains(inputs.caches, 'gradle-outputs') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-outputs-${{ runner.os }}-${{ github.sha }}
        restore-keys: gradle-outputs-${{ runner.os }}-
    - if: contains(inputs.caches, 'gradle-outputs') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-outputs-${{ runner.os }}-${{ github.sha }}
        restore-keys: gradle-outputs-${{ runner.os }}-

    # The packages of the panel, its testkit and its widgetbook.
    - if: contains(inputs.caches, 'flutter') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('panel/**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-
    - if: contains(inputs.caches, 'flutter') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('panel/**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-
