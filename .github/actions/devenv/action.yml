name: devenv
description: >-
  Installs Nix and devenv and builds the devenv shell, so a job's steps can run
  `devenv shell -- cargo xtask ...` exactly as on a developer machine. Nix paths come from
  gabber235.cachix.org, which trusted runs fill, as they fill the tool caches.

inputs:
  op-service-account-token:
    description: >-
      The 1Password service account token (`secrets.OP_SERVICE_ACCOUNT_TOKEN`). On a trusted run it
      reads the `cache` secrets to push the shell to gabber235.cachix.org. Fork pull requests get
      none, so they only read.
    default: ""
  caches:
    description: >-
      Tool caches besides xtask's Cargo build, space separated: `gradle` (dependencies and the
      wrapper), `gradle-outputs` (Gradle's build cache, which it turns on for this job),
      `flutter` (the pub cache), `frame-vectors` (the Cargo build of `cargo xtask generate`'s
      frame vector writer) and `game` (what the game suite downloads and trains: Loom's Minecraft
      files, the Paper download and the restart Papers' boot cache).
    default: ""
  profile:
    description: >-
      The devenv profile the job's steps enter (`devenv --profile <profile> shell`), such as
      `e2e` for the end to end suites' display, recorder and browser; empty for the base shell.
    default: ""
  cache-scope:
    description: >-
      The job kind whose own copies of Gradle's build cache and the boot cache this job saves and
      restores, such as `check-services` or `e2e-game`; the job's id when empty. Jobs of different
      kinds build different outputs under the same commit, so with one key the first to finish took
      it and the others' saves were refused.
    default: ""
  cargo-targets:
    description: >-
      `true` for the jobs that build the stack's Cargo targets and so own them on the cache volume:
      the e2e suites (the `typewriter-stack` binary and the release components) and the components
      check (the same components and the suite beside the binary). Other jobs do not mount them.
    default: "false"
  gradle-outputs-from:
    description: >-
      Another job kind whose Gradle build cache entries this job restores, read only, instead of
      saving entries of its own, such as `check-services` for the panel suites, whose Gradle work
      (the SDK fixtures and the Realm host) is part of what the services check builds. Needs
      `gradle-outputs` in `caches`. Each job kind that saves adds an entry of over 1 GB per commit
      to the repository's 10 GB.
    default: ""
  volume-profiles:
    description: >-
      Further devenv profiles whose shells this job builds on a Namespace cache volume, space
      separated, so every job after it finds their Nix paths there: the plan job, which runs
      before every other job, builds `e2e`. Each job saves the whole volume when it ends and the
      last one to end wins, so Nix paths only a concurrent job added would be lost.
    default: ""

runs:
  using: composite
  steps:
    # Trusted runs (pushes to the long lived branches, pull requests from this repository, and
    # dispatched runs, which only a maintainer can start) push to the shared Nix cache and save the
    # tool caches. A pull request reads only its own caches and its base branch's, so one into a
    # branch that never saves (a stacked pull request) would otherwise start every run cold; the
    # 10 GB the repository gets evicts the oldest copies. A dispatched run therefore saves only on a
    # long lived branch and restores elsewhere: dispatched work branches once filled the 10 GB and
    # evicted the base branch's caches, so pull requests into it started cold.
    - id: trust
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
        HAS_TOKEN: ${{ inputs.op-service-account-token != '' }}
        CARGO_TARGETS: ${{ inputs.cargo-targets }}
      run: |
        long_lived=false
        if [[ $REF == refs/heads/develop || $REF == refs/heads/features/v1 ]]; then
          long_lived=true
        fi
        trusted=false
        if [[ $EVENT == push && $long_lived == true ]]; then
          trusted=true
        fi
        if [[ $EVENT == pull_request && $HEAD_REPO == "$REPO" || $EVENT == workflow_dispatch ]]; then
          trusted=true
        fi
        save=$trusted
        if [[ $EVENT == workflow_dispatch && $long_lived != true ]]; then
          save=false
        fi
        echo "save-caches=$save" >> "$GITHUB_OUTPUT"
        # Read by the devenv-save action at the end of the job.
        echo "DEVENV_SAVE_CACHES=$save" >> "$GITHUB_ENV"
        echo "push-nix=$([[ $trusted == true && $HAS_TOKEN == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # A Namespace runner with a cache volume (its `-with-cache` label) keeps the Nix store and
        # the caches every job shares on that volume instead of in the repository's Actions cache.
        echo "volume=$([[ -n ${NSC_CACHE_PATH:-} ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # The Cargo targets this job keeps on the volume, one per line; none unless it owns them.
        {
          echo "cargo-targets<<EOF"
          if [[ $CARGO_TARGETS == true ]]; then
            echo "$GITHUB_WORKSPACE/backend/target/release"
            echo "$GITHUB_WORKSPACE/backend/target/wasm32-wasip2/release"
            echo "$GITHUB_WORKSPACE/backend/tests/component/target/debug"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        # Incremental artifacts only grow a cache that starts each job from the same state.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # A job never reuses a Gradle daemon, and an idle one held 2.4 GB that the panel's
        # analyzer (11 GB on Linux) needs on a 16 GB runner. GRADLE_OPTS reaches only Gradle's
        # client JVM, so it cannot steer the Kotlin compiler in the build JVM; the game suite
        # keeps Kotlin's daemons out of its run by building in a Gradle of its own first.
        echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> "$GITHUB_ENV"
    # devenv provides every tool, so the runner's own SDKs only take the disk the Nix store and a
    # cold build need: a panel check ran out of it during generation.
    - shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
        df -h /
    # The volume holds what every job wants the same copy of, all of it keyed by pinned inputs: the
    # Nix store and Nix's user cache, mounted before Nix is installed into them, Gradle's
    # dependencies and wrapper, the pub cache and the game suite's Minecraft and Paper downloads.
    # Their `actions/cache` steps below skip where it is mounted. The first fetch of a path from
    # cache.nixos.org is slow from Namespace's network, so a store that outlives the job is what
    # makes its runners fast. Each job starts from the volume's last saved state and saves its own
    # at the end, so the last job to finish wins: caches that differ by job (Gradle's build cache,
    # the boot cache, xtask's Cargo target) stay on `actions/cache`, where every job keeps its own.
    #
    # The jobs that build the stack's Cargo targets (`cargo-targets`) keep them on the volume too,
    # several GB that the repository's 10 GB of `actions/cache` has no room for: the release wasm
    # build of the
    # backend components (with its host build scripts and macros in `release`) and the component
    # test workspace's debug target, which holds the `typewriter-stack` binary and the suite. Cargo
    # keeps their dependencies; xtask stamps the stack's artifacts with the digest of their inputs
    # (xtask/src/cargo_build.rs) and reuses them while it matches, so a state another job's save
    # replaced costs a rebuild, never a stale binary. The backend's debug and coverage targets,
    # tens of GB, stay off.
    - if: steps.trust.outputs.volume == 'true'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
          ~/.pub-cache
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/run-task-jars
          ${{ github.workspace }}/services/.gradle/loom-cache
          ${{ steps.trust.outputs.cargo-targets }}
    - uses: cachix/install-nix-action@v31
    # Reads gabber235.cachix.org (the Rust toolchain and every other path a trusted run
    # built) and the public devenv cache. Pushing is the explicit step below, with a token only
    # trusted runs can read.
    - uses: cachix/cachix-action@v17
      with:
        name: gabber235
        extraPullNames: devenv
    - shell: bash
      run: nix profile add nixpkgs#devenv
    # The first entry builds the shell; later steps reuse it. On a cache volume the job also builds
    # the shells of `volume-profiles`.
    #
    # Patch for the Nix resume bug (NixOS/nix#4533): when a download's connection drops, Nix
    # resumes it with a range request, the cache answers HTTP 416, and Nix treats that as fatal.
    # A new attempt keeps every path already fetched, so at most two retries, and only for that
    # error.
    - shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        VOLUME_PROFILES: ${{ steps.trust.outputs.volume == 'true' && inputs.volume-profiles || '' }}
      run: |
        build() {
          local log="$RUNNER_TEMP/devenv-shell.log" retries=0
          until devenv ${1:+--profile "$1"} shell -- true 2>&1 | tee "$log"; do
            if ! grep -qF 'HTTP error 416' "$log" || (( retries == 2 )); then
              exit 1
            fi
            retries=$((retries + 1))
            echo "::warning::Nix failed a download resume with HTTP 416; building the shell again ($retries of 2)"
          done
        }
        build "$PROFILE"
        for profile in $VOLUME_PROFILES; do
          build "$profile"
        done
    # The shell's closure holds every path it built: the Rust toolchain, cargo-llvm-cov and the
    # rest. Cachix skips paths it or cache.nixos.org already has. A failed push costs the next run
    # time, not this run its result, so it passes with a warning that names the cause: the last
    # line the token lookup or the push printed, which never holds the token.
    - if: steps.trust.outputs.push-nix == 'true'
      continue-on-error: true
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
      run: |
        log="$RUNNER_TEMP/cachix-push.log"
        cause() { sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -v '^[[:space:]]*\(•\|✓\|$\)' | tail -n 1; }
        if ! token=$(devenv shell -- secretspec get CACHIX_AUTH_TOKEN --profile cache --provider vault \
          --reason "push the devenv shell to gabber235.cachix.org" 2>"$log"); then
          echo "::warning::The devenv shell was not pushed to gabber235.cachix.org, so the next run builds its paths again: no Cachix token ($(cause))"
          exit 0
        fi
        echo "::add-mask::$token"
        if ! realpath .devenv/gc/* | CACHIX_AUTH_TOKEN=$token cachix push gabber235 2>&1 | tee "$log"; then
          echo "::warning::The devenv shell was not pushed to gabber235.cachix.org, so the next run builds its paths again: cachix push failed ($(cause))"
        fi

    # Each tool cache is a pair: `actions/cache` saves at the end of the job where caches are saved,
    # `actions/cache/restore` only reads everywhere else. Keep the pair's values the same.
    #
    # xtask's dependencies, which every job compiles before its first command. The toolchain is
    # pinned in devenv.nix and devenv.lock and the profile in .cargo/config.toml, so a new toolchain
    # or profile starts empty instead of restoring artifacts it would rebuild anyway; a new
    # Cargo.lock starts from the same toolchain's last.
    - if: steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          xtask/target/debug
        key: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-${{ hashFiles('xtask/Cargo.lock') }}
        restore-keys: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-
    - if: steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          xtask/target/debug
        key: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-${{ hashFiles('xtask/Cargo.lock') }}
        restore-keys: xtask-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-

    # The dependencies of the frame vector writer, which every job that generates compiles. Its
    # own target (xtask/src/generate.rs) holds them without debug info: about 700 MB, 200 MB
    # compressed. Not part of xtask's cache: the plan job saves that one first and never generates.
    # The writer's own crate is left out; a fresh checkout's file times rebuild it anyway.
    - if: contains(inputs.caches, 'frame-vectors') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: |
          .xtask/frame-vectors-target/debug
          !.xtask/frame-vectors-target/debug/deps/*wasmcloud_utils*
        key: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-
    - if: contains(inputs.caches, 'frame-vectors') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          .xtask/frame-vectors-target/debug
          !.xtask/frame-vectors-target/debug/deps/*wasmcloud_utils*
        key: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: frame-vectors-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', '.cargo/config.toml') }}-

    # The Gradle caches are only restored here; the job's last step saves them through the
    # devenv-save action with `if: always()`. A save in actions/cache's post step happens only
    # when the job succeeds, so a services check that ran out of its budget on a cold runner saved
    # nothing, and every rerun started just as cold. Dependencies and build cache entries are
    # keyed by their inputs, so what a failed job leaves is safe to reuse.
    #
    # Gradle's downloaded dependencies and distribution, keyed by the build files that pin them.
    - id: gradle-cache
      if: contains(inputs.caches, 'gradle') && steps.trust.outputs.volume != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('services/**/*.gradle.kts', 'services/gradle/libs.versions.toml', 'services/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    # Gradle's build cache, on in CI only: the user home's gradle.properties wins over the
    # project's and never reaches a developer machine. Its outputs change with every commit, so
    # each save is a new entry under the commit, restored by prefix; the cache evicts the least
    # recently used entries, which are the older commits', and Gradle drops outputs unused for 7
    # days from the copy it saves.
    - if: contains(inputs.caches, 'gradle-outputs')
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
    # Each job kind (`cache-scope`) and each attempt saves its own entry, so a rerun of a failed job
    # keeps what it adds. A job kind with no entry yet starts from another kind's newest. A job with
    # `gradle-outputs-from` restores that kind's entries and saves none.
    - id: gradle-outputs-cache
      if: contains(inputs.caches, 'gradle-outputs')
      uses: actions/cache/restore@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-outputs-${{ runner.os }}-${{ inputs.gradle-outputs-from || inputs.cache-scope || github.job }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          gradle-outputs-${{ runner.os }}-${{ inputs.gradle-outputs-from || inputs.cache-scope || github.job }}-${{ github.sha }}-
          gradle-outputs-${{ runner.os }}-${{ inputs.gradle-outputs-from || inputs.cache-scope || github.job }}-
          gradle-outputs-${{ runner.os }}-
    # What devenv-save needs at the end of the job: the keys, and whether the restore already
    # matched them exactly, in which case there is nothing new to save under that key. A job that
    # reads another kind's Gradle outputs gets no key for them, so it saves none.
    - if: contains(inputs.caches, 'gradle')
      shell: bash
      env:
        CACHES: ${{ inputs.caches }}
        GRADLE_KEY: ${{ steps.gradle-cache.outputs.cache-primary-key }}
        GRADLE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
        OUTPUTS_KEY: ${{ inputs.gradle-outputs-from == '' && steps.gradle-outputs-cache.outputs.cache-primary-key || '' }}
        OUTPUTS_HIT: ${{ steps.gradle-outputs-cache.outputs.cache-hit }}
      run: |
        {
          echo "DEVENV_CACHES=$CACHES"
          echo "DEVENV_GRADLE_KEY=$GRADLE_KEY"
          echo "DEVENV_GRADLE_HIT=$GRADLE_HIT"
          echo "DEVENV_GRADLE_OUTPUTS_KEY=$OUTPUTS_KEY"
          echo "DEVENV_GRADLE_OUTPUTS_HIT=$OUTPUTS_HIT"
        } >> "$GITHUB_ENV"

    # The packages of the panel, its testkit and its widgetbook.
    - if: contains(inputs.caches, 'flutter') && steps.trust.outputs.save-caches == 'true' && steps.trust.outputs.volume != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('panel/**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-
    - if: contains(inputs.caches, 'flutter') && steps.trust.outputs.save-caches != 'true' && steps.trust.outputs.volume != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('panel/**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    # The game suite's own downloads, keyed by the build files that pin Minecraft and Paper: Loom's
    # Minecraft jars, mappings and assets (shared and per project) and run-paper's Paper download.
    # The patched Paper comes from Gradle's build cache (`gradle-outputs`), as its task is
    # cacheable.
    - if: contains(inputs.caches, 'game') && steps.trust.outputs.save-caches == 'true' && steps.trust.outputs.volume != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/run-task-jars
          services/.gradle/loom-cache
        key: game-${{ runner.os }}-${{ hashFiles('services/libs.versions.toml', 'services/playtest/**/*.gradle.kts') }}
        restore-keys: game-${{ runner.os }}-
    - if: contains(inputs.caches, 'game') && steps.trust.outputs.save-caches != 'true' && steps.trust.outputs.volume != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/run-task-jars
          services/.gradle/loom-cache
        key: game-${{ runner.os }}-${{ hashFiles('services/libs.versions.toml', 'services/playtest/**/*.gradle.kts') }}
        restore-keys: game-${{ runner.os }}-
    # The restart Papers' ahead of time cache. The pool keys it on the JDK, the plugin's and Paper's
    # files and the flags, and trains a new one, replacing the old, when the restored one does not
    # match; so each commit saves what its run left, restored by prefix like Gradle's outputs.
    - if: contains(inputs.caches, 'game') && steps.trust.outputs.save-caches == 'true'
      uses: actions/cache@v4
      with:
        path: services/build/playtest/pool/aot
        key: game-aot-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-${{ github.sha }}
        restore-keys: |
          game-aot-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-
          game-aot-${{ runner.os }}-
    - if: contains(inputs.caches, 'game') && steps.trust.outputs.save-caches != 'true'
      uses: actions/cache/restore@v4
      with:
        path: services/build/playtest/pool/aot
        key: game-aot-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-${{ github.sha }}
        restore-keys: |
          game-aot-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-
          game-aot-${{ runner.os }}-
