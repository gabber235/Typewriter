name: secrets
description: >-
  Exports one scope of the `release` secrets (secretspec.toml) from the Typewriter 1Password vault
  to the job's later steps as environment variables, masked in the log.

inputs:
  scope:
    description: The secretspec.toml scope to export, such as `fly`.
    required: true
  token:
    description: The OP_SERVICE_ACCOUNT_TOKEN secret; composite actions cannot read secrets.
    required: true

runs:
  using: composite
  steps:
    # The vault provider calls the 1Password CLI.
    - uses: 1password/install-cli-action@v4
    # Untagged; pinned to a commit of main.
    - uses: cachix/secretspec-action@9a02088c2a41efaf75c0e10e574f0275964bbe7f
      with:
        profile: release
        scope: ${{ inputs.scope }}
        # The version of xtask's secretspec crate and the CLI devenv provides.
        version: 0.21.1
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.token }}
