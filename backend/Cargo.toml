[workspace]
resolver = "3"
members = [
    "access/auth-callout",
    "access/auth-sentinel",
    "access/auth-typewriter-permissions",
    "database/schema",
    "organization/organization-members",
    "organization/organization-roles",
    "organization/user-organization",
    "service/service-identity",
    "service/service-registration",
    "testing/component-test-echo",
    "testing/component-test-messaging",
    "testing/component-test-responder",
    "testing/nats-broker",
    "wasmcloud-utils",
    "wasmcloud-utils-macros",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/gabber235/Typewriter"

[workspace.dependencies]
base64 = "0.23"
futures = "0.3"
jose = { version = "0.0.2", features = ["crypto-rustcrypto"] }
nats-jwt-rs = "0.1"
nkeys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

skir-client = "0.1"
surrealdb-component-sdk = { git = "https://github.com/Seamlezz/surrealdb-wasi-component", rev = "3358fbeb66280cfa8dff948577b17e7f73d5722c" }
wasmcloud-component = "0.2.0"
wasmcloud-utils = { path = "wasmcloud-utils" }
wasmcloud-utils-macros = { path = "wasmcloud-utils-macros" }

opentelemetry = "0.32"
otel-wasi = { git = "https://github.com/Seamlezz/otel-wasi", rev = "1035d89de8ffca498df516903f4e22b8f9886dab" }
tracing = "0.1"

wit-bindgen = { version = "0.62", features = [
    "async-spawn",
    "inter-task-wakeup",
] }

convert_case = "0.6"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

surrealdb-types = "3.2.4"

# Lints for the ways agent written code goes wrong; every member opts in with `[lints] workspace
# = true`, and the backend lint step denies warnings.
[workspace.lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "warn" # clippy.toml: allow-unwrap-in-tests = true
cognitive_complexity = "warn"
too_many_lines = "warn"
fn_params_excessive_bools = "deny"

[workspace.lints.rust]
dead_code = "deny"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/Seamlezz/otel-wasi", pattern = "otel-wasi-dylint" },
]
