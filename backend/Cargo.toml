[workspace]
resolver = "3"
members = [
  "access/auth-callout",
  "access/auth-sentinel",
  "access/auth-typewriter-permissions",
  "organization/organization-members",
  "organization/organization-roles",
  "organization/user-organization",
  "service/service-identity",
  "service/service-registration",
  "testing/component-test-echo",
  "testing/component-test-messaging",
  "testing/component-test-responder",
  "wasmcloud-utils",
  "wasmcloud-utils-macros"
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/gabber235/Typewriter"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
jose = { version = "0.0.2", features = ["crypto-rustcrypto"] }
nats-jwt-rs = "0.1"
nkeys = "0.4"
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

skir-client = "0.1"
surrealdb-component-sdk = { git = "https://github.com/Seamlezz/surrealdb-wasi-component", rev = "8b09a32e5505704df3c890822fdcffffd18c8588" }
wasmcloud-component = "0.2.0"
wasmcloud-utils = { path = "wasmcloud-utils" }
wasmcloud-utils-macros = { path = "wasmcloud-utils-macros" }
wstd = "0.6"

opentelemetry = "0.32"
otel-wasi = { git = "https://github.com/Seamlezz/otel-wasi", rev = "1035d89de8ffca498df516903f4e22b8f9886dab" }
tracing = "0.1"
tracing-opentelemetry = "0.33"

wit-bindgen = { version = "0.58", features = ["async-spawn", "inter-task-wakeup"] }

convert_case = "0.6"
proc-macro2 = "1"
quote = "1"
rstest = "0.26.1"
syn = { version = "2", features = ["full"] }

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/Seamlezz/otel-wasi", pattern = "otel-wasi-dylint" }]
