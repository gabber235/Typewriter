compatibility = "phased"

[[steps]]
id = "apply_host_execution_topology"
phase = "start"
kind = "apply_schema"
files = [
    "database/schema/service/functions.surql",
    "database/schema/service/service.surql",
    "database/schema/service/topology.surql",
]

[[steps]]
id = "remove_legacy_runs_in"
phase = "complete"
kind = "remove_entities"
entities = [
    { kind = "field", scope = "service", name = "runs_in" },
    { kind = "function", name = "fn::service::valid_runs_in" },
]

[[steps]]
id = "restore_legacy_service_contract"
phase = "rollback"
kind = "apply_schema"
sql = '''
DEFINE FUNCTION OVERWRITE fn::service::valid_state($service: object) -> bool {
    fn::service::valid_roles($service.roles);
    IF $service.organization != NONE AND $service.registration != NONE {
        THROW "service-organization-registration-conflict"
    };
    RETURN fn::service::valid_runs_in($service, $service.runs_in);
};

DEFINE FIELD OVERWRITE organization ON service TYPE option<record<organization>>
    REFERENCE ON DELETE THEN {
        UPDATE $this SET runs_in = NONE, organization = NONE;
    }
    ASSERT {
        IF $value != NONE AND $this.registration != NONE {
            THROW "service-organization-registration-conflict"
        };
        RETURN true;
    };
'''

[[steps]]
id = "remove_host_execution_topology"
phase = "rollback"
kind = "remove_entities"
entities = [
    { kind = "table", name = "engine_instance" },
    { kind = "table", name = "realm_instance" },
    { kind = "table", name = "service_host" },
    { kind = "function", name = "fn::service::valid_engine_target" },
    { kind = "function", name = "fn::service::valid_supported_engine" },
    { kind = "function", name = "fn::service::valid_supported_engines" },
]
