[[cases]]
name = "role_batch_rejects_missing_member_without_partial_write"
kind = "sql_expect"
actor = "root"
sql = """
RETURN {
LET $before = SELECT in, roles FROM member_of WHERE out = organization:acme;
LET $result = fn::organization::members::update_roles(organization:acme, [user:bob, user:absent], [organization_role:acme_member]);
RETURN $result.outcome = 'user-not-found-error'
    AND $result.user_ids = [user:absent]
    AND $before = (SELECT in, roles FROM member_of WHERE out = organization:acme);
};
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

[[cases]]
name = "role_batch_preserves_protected_roles"
