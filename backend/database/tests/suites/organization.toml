[[cases]]
name = "organization_delete_cascades_dependents_and_unbinds_services"
kind = "sql_expect"
actor = "root"
sql = """
RETURN {
    CREATE user:delete_owner SET email = 'delete_owner@example.com';
    CREATE organization:delete_org SET name = 'delete_org', founder = user:delete_owner;
    CREATE organization_join_code:delete_code SET organization = organization:delete_org;
    CREATE service:delete_realm SET name = 'delete_realm', role = { type: 'host', version: '1.0.0' }, organization = organization:delete_org;
    DELETE organization:delete_org;

    RETURN (SELECT VALUE id FROM ONLY organization:delete_org) == NONE
        AND array::len(SELECT VALUE id FROM organization_role WHERE organization = organization:delete_org) = 0
        AND array::len(SELECT VALUE id FROM member_of WHERE out = organization:delete_org) = 0
        AND (SELECT VALUE organization FROM ONLY service:delete_realm) == NONE;
};
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

