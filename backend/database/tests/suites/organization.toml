[[cases]]
name = "approval_rejects_missing_request_without_consuming_valid_request"
kind = "sql_expect"
actor = "root"
sql = """
RETURN {
CREATE user:approval_dave SET name = "Approval Dave";
RELATE user:approval_dave->request_to_join:batch_dave->organization:acme;
LET $result = fn::organization::members::approve_requests(organization:acme, [request_to_join:batch_dave, request_to_join:absent], [organization_role:acme_member]);
RETURN $result.outcome = 'request-not-found-error' AND request_to_join:batch_dave.id != NONE
    AND !fn::organization::member(user:approval_dave, organization:acme);
};
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

[[cases]]
name = "approval_batch_creates_all_memberships"
kind = "sql_expect"
actor = "root"
sql = """
RETURN {
    CREATE user:approval_carol SET name = "Approval Carol";
    RELATE user:approval_carol->request_to_join:batch_carol->organization:acme;
    LET $join_requests_before = organization:acme.join_requests_sequence;
    LET $members_before = organization:acme.members_sequence;
    LET $result = fn::organization::members::approve_requests(organization:acme, [request_to_join:batch_dave, request_to_join:batch_carol], [organization_role:acme_member]);
    RETURN $result.outcome = 'approved' AND array::len($result.approvals) = 2
        AND $result.join_requests_sequence = $join_requests_before + 1
        AND $result.members_sequence = $members_before + 1
        AND organization:acme.join_requests_sequence = $join_requests_before + 1
        AND organization:acme.members_sequence = $members_before + 1
        AND user:approval_dave.join_requests_sequence = 1
        AND user:approval_dave.organizations_sequence = 1
        AND user:approval_carol.join_requests_sequence = 1
        AND user:approval_carol.organizations_sequence = 1
        AND fn::organization::member(user:approval_dave, organization:acme)
        AND fn::organization::member(user:approval_carol, organization:acme)
        AND request_to_join:batch_dave.id = NONE AND request_to_join:batch_carol.id = NONE;
};
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

[[cases]]
name = "role_batch_resolves_empty_selection_defaults_per_member"
kind = "sql_expect"
actor = "root"
sql = """
RETURN {
    LET $result = fn::organization::members::update_roles(organization:acme, [user:alice, user:bob], []);
    LET $bob = (SELECT * FROM member_of WHERE in = user:bob AND out = organization:acme)[0];
    RETURN $result.outcome = 'updated' AND fn::organization::founder_member(user:alice, organization:acme)
        AND array::len($bob.roles) > 0
        AND array::all($bob.roles, |$role| $role.default_role);
};
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

