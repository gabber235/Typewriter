name = "organization"
tags = ["organization", "invariants", "mutations", "atomicity"]

[[fixtures]]
name = "organization_seed"
actor = "root"
file = "../fixtures/organization_seed.surql"

[[cases]]
name = "organization_setup_event_created_roles_and_membership"
kind = "sql_expect"
actor = "root"
sql = """
RETURN array::len(SELECT VALUE id FROM organization_role WHERE organization = organization:acme AND name = 'founder' AND deletable = false AND assignable = false) = 1
    AND array::len(SELECT VALUE id FROM organization_role WHERE organization = organization:acme AND name = 'writer' AND deletable = false AND assignable = true AND default_role = true) = 1
    AND fn::organization::member(user:alice, organization:acme)
    AND fn::organization::founder_member(user:alice, organization:acme)
    AND !fn::organization::founder_member(user:bob, organization:acme);
"""
allow = true
[[cases.assertions]]
path = ""
equals = true

