[[cases]]
name = "same_organization_bound_engine_and_realm_can_keep_runs_in"
kind = "sql_expect"
actor = "root"
sql = "RETURN { CREATE service:realm_pair SET name = 'realm_pair', roles = [{ type: 'realm', version: '1.0.0' }], organization = organization:acme; CREATE service:engine_pair SET name = 'engine_pair', roles = [{ type: 'engine', version: '1.0.0' }], organization = organization:acme, runs_in = service:realm_pair; RETURN service:engine_pair.runs_in = service:realm_pair; };"
allow = true
[[cases.assertions]]
path = ""
equals = true

[[cases]]
name = "deleting_organization_with_bound_engine_realm_clears_contextual_runs_in"
kind = "sql_expect"
actor = "root"
sql = "RETURN { CREATE user:pair_owner SET email = 'pair_owner@example.com'; CREATE organization:pair_org SET name = 'pair_org', founder = user:pair_owner; CREATE service:pair_realm SET name = 'pair_realm', roles = [{ type: 'realm', version: '1.0.0' }], organization = organization:pair_org; CREATE service:pair_engine SET name = 'pair_engine', roles = [{ type: 'engine', version: '1.0.0' }], organization = organization:pair_org, runs_in = service:pair_realm; DELETE organization:pair_org; RETURN service:pair_engine.organization == NONE AND service:pair_realm.organization == NONE AND service:pair_engine.runs_in == NONE; };"
allow = true
[[cases.assertions]]
path = ""
equals = true
