version: "3"

silent: true

vars:
  OPENBAO_URL: "https://vault.seamlezz.test"
  SURREALDB_URL: "http://surrealdb.seamlezz.test:8000"

env:
  VAULT_ADDR: "{{.OPENBAO_URL}}"
  SURREAL_NAMESPACE: "typewriter"
  SURREAL_DATABASE: "production"

tasks:
  import:
    desc: Import database.surql schema into SurrealDB
    vars:
      SURREALDB_USER:
        sh: vault kv get -field=username secret/surrealdb/credentials 2>/dev/null || echo ""
      SURREALDB_PASS:
        sh: vault kv get -field=password secret/surrealdb/credentials 2>/dev/null || echo ""
    cmds:
      - |
        if [ -z "{{.SURREALDB_URL}}" ]; then
          echo "❌ Error: SurrealDB URL not found. Make sure SurrealDB is deployed."
          exit 1
        fi
        if [ -z "{{.SURREALDB_USER}}" ] || [ -z "{{.SURREALDB_PASS}}" ]; then
          echo "❌ Error: SurrealDB credentials not found in OpenBao."
          exit 1
        fi
        surreal validate
        echo "Importing database.surql into {{.SURREALDB_URL}}..."
        surreal import --endpoint "{{.SURREALDB_URL}}" --username "{{.SURREALDB_USER}}" --password "{{.SURREALDB_PASS}}" database.surql
        echo "✅ Database schema imported successfully!"

  sql:
    desc: Connect to SurrealDB SQL REPL
    vars:
      SURREALDB_USER:
        sh: vault kv get -field=username secret/surrealdb/credentials 2>/dev/null || echo ""
      SURREALDB_PASS:
        sh: vault kv get -field=password secret/surrealdb/credentials 2>/dev/null || echo ""
    cmds:
      - |
        if [ -z "{{.SURREALDB_URL}}" ]; then
          echo "❌ Error: SurrealDB URL not found. Make sure SurrealDB is deployed."
          exit 1
        fi
        if [ -z "{{.SURREALDB_USER}}" ] || [ -z "{{.SURREALDB_PASS}}" ]; then
          echo "❌ Error: SurrealDB credentials not found in OpenBao."
          exit 1
        fi
        echo "Connecting to {{.SURREALDB_URL}}..."
        surreal sql --endpoint "{{.SURREALDB_URL}}" --username "{{.SURREALDB_USER}}" --password "{{.SURREALDB_PASS}}"

  connection-info:
    desc: Display SurrealDB connection information
    cmds:
      - |
        echo "SurrealDB URL: {{.SURREALDB_URL}}"
        echo "OpenBao URL: {{.OPENBAO_URL}}"

  default:
    desc: Show available tasks
    cmds:
      - task --list
