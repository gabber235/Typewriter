apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/start
images:
  - name: ghcr.io/gabber235/typewriter-db
    newName: oci.local.seamlezz.net/typewriter/database
    newTag: dev
patches:
  # Local and CI clusters hold disposable data, so they reach the schema of the commit they run
  # with surrealkit's desired state sync; rollouts are for databases old code still reads.
  - target:
      kind: Job
      name: typewriter-db-rollout-start
    patch: |-
      - op: replace
        path: /metadata/name
        value: typewriter-db-sync
      - op: add
        path: /metadata/annotations
        value:
          typewriter.seamlezz.com/environment: local
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: remove
        path: /spec/template/spec/containers/0/env/7
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - exec /usr/local/bin/surrealkit sync
