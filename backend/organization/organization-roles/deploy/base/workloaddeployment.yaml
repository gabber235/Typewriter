apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: organization-roles
  namespace: typewriter
spec:
  replicas: 1
  template:
    spec:
      environment: wasmcloud
      hostSelector:
        hostgroup: default
      components:
        - name: organization-roles
      hostInterfaces:
        - namespace: wasi
          package: otel
          version: "0.2.0-rc.2"
          interfaces:
            - tracing
            - metrics
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
          config:
            subscriptions: typewriter.from.user.*.organization.*.roles.>
        - namespace: seamlezz
          package: surrealdb
          version: "0.2.0"
          interfaces:
            - call
          secretFrom:
            - name: surrealdb-credentials-organization-roles
