version: "3"

silent: true

vars:
  ENV: '{{default "local" .ENV}}'

tasks:
  all:
    desc: Run a task on all sub-Taskfiles
    vars:
      TASK_CMD: '{{default "" .TASK_CMD}}'
    cmds:
      - |
        if [ -z "{{.TASK_CMD}}" ]; then
          echo "Usage: task all TASK_CMD=<task-name>"
          echo "Example: task all TASK_CMD=deploy"
          exit 1
        fi

        # Find all Taskfile.yml files in subdirectories (excluding this one and Taskfile.single.yml)
        TASKFILES=$(find . -mindepth 2 -name "Taskfile.yml" -type f | sort)

        if [ -z "$TASKFILES" ]; then
          echo "No sub-Taskfiles found"
          exit 0
        fi

        echo "Running '{{.TASK_CMD}}' on all components..."
        echo "=========================================="

        FAILED=""
        for taskfile in $TASKFILES; do
          DIR=$(dirname "$taskfile")

          if ! (cd "$DIR" && task --list 2>/dev/null | grep -q "^\* {{.TASK_CMD}}:"); then
            echo "⊘ $DIR (task '{{.TASK_CMD}}' not found, skipping)"
            continue
          fi

          echo ""
          echo ">>> $DIR"
          echo "-------------------------------------------"
          if (cd "$DIR" && task {{.TASK_CMD}} ENV={{.ENV}}); then
            echo "<<< $DIR completed"
          else
            echo "<<< $DIR FAILED"
            FAILED="$FAILED $DIR"
          fi
        done

        echo ""
        echo "=========================================="
        if [ -n "$FAILED" ]; then
          echo "Failed components:$FAILED"
          exit 1
        else
          echo "All components completed successfully"
        fi

  deploy:all:
    desc: Deploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: deploy

  undeploy:all:
    desc: Undeploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: undeploy

  build:all:
    desc: Build all components
    cmds:
      - task: all
        vars:
          TASK_CMD: build

  push:all:
    desc: Push all components
    cmds:
      - task: all
        vars:
          TASK_CMD: push

  setup:all:
    desc: Setup all components (build, push, deploy)
    cmds:
      - task: all
        vars:
          TASK_CMD: setup

  status:all:
    desc: Check status of all components
    cmds:
      - task: all
        vars:
          TASK_CMD: status

  clean:all:
    desc: Clean all components
    cmds:
      - task: all
        vars:
          TASK_CMD: clean

  list:
    desc: List all sub-Taskfiles
    cmds:
      - |
        echo "Sub-Taskfiles found:"
        find . -mindepth 2 -name "Taskfile.yml" -type f | sort | while read taskfile; do
          DIR=$(dirname "$taskfile")
          echo "  - $DIR"
        done

  test:
    desc: "Run integration tests (builds components if needed)"
    cmds:
      - task: build:all
      - cd tests && cargo test {{.CLI_ARGS}}

  test:all:
    desc: "Run all integration tests in single binary (fastest)"
    cmds:
      - task: build:all
      - cd tests && cargo test --test integration {{.CLI_ARGS}}

  default:
    desc: Show available tasks
    cmds:
      - task --list
