version: "3"

silent: true

vars:
  ENV: '{{default "local" .ENV}}'
  INFRASTRUCTURE_DIR: "/Users/thijs/Bestanden/Infrastructure/v2"
  HARBOR_URL:
    sh: cd {{.INFRASTRUCTURE_DIR}}/6_harbor/installation && terraform output -raw harbor_registry_url 2>/dev/null || echo "oci.seamlezz.com"
  HARBOR_INSECURE:
    sh: cd {{.INFRASTRUCTURE_DIR}}/6_harbor/installation && terraform output -raw harbor_environment 2>/dev/null | grep -q "local" && echo "true" || echo "false"
  OPENBAO_URL:
    sh: cd {{.INFRASTRUCTURE_DIR}}/3_openbao && terraform output -raw openbao_url 2>/dev/null || echo ""
  WASMCLOUD_NAMESPACE: "wasmcloud"

env:
  VAULT_ADDR: "{{.OPENBAO_URL}}"

tasks:
  harbor:login:
    desc: Login to Harbor registry using robot credentials from OpenBao
    status:
      - docker login {{.HARBOR_URL}} --get-login 2>/dev/null | grep -q "robot"
    cmds:
      - |
        echo "Fetching Harbor credentials from OpenBao..."
        HARBOR_USER=$(vault kv get -field=username secret/harbor/robot-wasmcloud-push)
        HARBOR_PASS=$(vault kv get -field=secret secret/harbor/robot-wasmcloud-push)
        echo "$HARBOR_PASS" | docker login {{.HARBOR_URL}} -u "$HARBOR_USER" --password-stdin
        echo "✅ Harbor credentials configured"

  build:
    desc: Build the wasmCloud component
    dir: "{{.USER_WORKING_DIR}}"
    sources:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "wit/**/*.wit"
      - "build.rs"
    cmds:
      - wash build --skip-fetch

  push:
    desc: Push component to Harbor registry
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - harbor:login
      - build
    vars:
      COMPONENT_NAME:
        sh: 'basename "$(pwd)"'
      VERSION:
        sh: 'grep -m1 "^version" Cargo.toml | sed ''s/version = "\(.*\)"/\1/'''
      WASM_PATH:
        sh: |
          if [ -f .wash/config.json ]; then
            CONFIGURED_PATH=$(cat .wash/config.json | grep -o '"component_path"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*: *"\([^"]*\)".*/\1/' || echo "")
            if [ -n "$CONFIGURED_PATH" ] && [ -f "$CONFIGURED_PATH" ]; then
              echo "$CONFIGURED_PATH"
              exit 0
            fi
          fi
          if [ -d build ] && ls build/*.wasm >/dev/null 2>&1; then
            ls build/*.wasm | head -1
            exit 0
          fi
          COMPONENT_WASM_NAME=$(grep -m1 '^name' Cargo.toml | sed 's/name = "\(.*\)"/\1/' | tr '-' '_')
          for dir in target ../target ../../target; do
            if [ -f "$dir/wasm32-wasip2/release/${COMPONENT_WASM_NAME}.wasm" ]; then
              echo "$dir/wasm32-wasip2/release/${COMPONENT_WASM_NAME}.wasm"
              exit 0
            fi
          done
          echo "build/*.wasm"
    cmds:
      - |
        INSECURE_FLAG=""
        if [ "{{.HARBOR_INSECURE}}" = "true" ]; then
          INSECURE_FLAG="--insecure"
        fi
        IMAGE="{{.HARBOR_URL}}/wasmcloud/{{.COMPONENT_NAME}}:{{.VERSION}}"
        echo "Pushing {{.WASM_PATH}} to $IMAGE..."
        wash oci push $INSECURE_FLAG "$IMAGE" "{{.WASM_PATH}}"
        echo "✅ Pushed $IMAGE"

  deploy:
    desc: Deploy the WorkloadDeployment manifest
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      MANIFEST:
        sh: 'ls manifests/workloaddeployment.yaml 2>/dev/null || echo ""'
    preconditions:
      - sh: '[ -n "{{.MANIFEST}}" ]'
        msg: "No manifest found at manifests/workloaddeployment.yaml"
    cmds:
      - kubectl apply -f {{.MANIFEST}}
      - echo "✅ Deployed workload"

  dev:
    desc: Build, push, and deploy in one step
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build
      - task: push
      - task: undeploy
      - task: deploy

  clean:
    desc: Clean build artifacts
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - rm -rf build/ target/

  status:
    desc: Check workload status
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      WORKLOAD_NAME:
        sh: 'grep -m1 "^  name:" manifests/workloaddeployment.yaml 2>/dev/null | sed "s/.*name: *//" || basename "$(pwd)"'
    cmds:
      - kubectl get workloaddeployment -n {{.WASMCLOUD_NAMESPACE}} {{.WORKLOAD_NAME}} 2>/dev/null || echo "Workload not deployed"
      - kubectl get pods -n {{.WASMCLOUD_NAMESPACE}} -l wasmcloud.com/workload={{.WORKLOAD_NAME}} 2>/dev/null || true

  logs:
    desc: View component logs
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      WORKLOAD_NAME:
        sh: 'grep -m1 "^  name:" manifests/workloaddeployment.yaml 2>/dev/null | sed "s/.*name: *//" || basename "$(pwd)"'
    cmds:
      - kubectl logs -n {{.WASMCLOUD_NAMESPACE}} -l wasmcloud.com/workload={{.WORKLOAD_NAME}} --tail=100 -f

  undeploy:
    desc: Remove the deployed workload
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      MANIFEST:
        sh: 'ls manifests/workloaddeployment.yaml 2>/dev/null || echo ""'
    cmds:
      - kubectl delete -f {{.MANIFEST}} --ignore-not-found
      - echo "✅ Workload removed"

  default:
    desc: Show available tasks
    cmds:
      - task --list
