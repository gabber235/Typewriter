version: "3"

silent: true

vars:
  ENV: '{{default "local" .ENV}}'

tasks:
  all:
    desc: Run a task on all sub-Taskfiles
    vars:
      TASK_CMD: '{{default "" .TASK_CMD}}'
    cmds:
      - |
        # Color definitions using bash $'...' syntax
        C_RESET=$'\033[0m'
        C_BOLD=$'\033[1m'
        C_DIM=$'\033[2m'
        C_GREEN=$'\033[32m'
        C_RED=$'\033[31m'
        C_YELLOW=$'\033[33m'
        C_BLUE=$'\033[34m'
        C_CYAN=$'\033[36m'

        if [ -z "{{.TASK_CMD}}" ]; then
          echo "${C_BOLD}${C_RED}Error: TASK_CMD is required${C_RESET}"
          echo ""
          echo "${C_DIM}Usage:${C_RESET} task all TASK_CMD=<task-name>"
          echo "${C_DIM}Example:${C_RESET} task all TASK_CMD=deploy"
          exit 1
        fi

        TASKFILES=$(find . -mindepth 2 -name "Taskfile.yml" -type f | sort)

        if [ -z "$TASKFILES" ]; then
          echo "${C_YELLOW}⊘ No sub-Taskfiles found${C_RESET}"
          exit 0
        fi

        echo "${C_BOLD}${C_BLUE}▶ Running '{{.TASK_CMD}}' across all components${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo ""

        TOTAL=0
        SUCCESS=0
        FAILED=""
        SKIPPED=0

        for taskfile in $TASKFILES; do
          DIR=$(dirname "$taskfile")
          TOTAL=$((TOTAL + 1))

          if ! (cd "$DIR" && task --list 2>/dev/null | grep -q "^\* {{.TASK_CMD}}:"); then
            echo "${C_DIM}• $DIR (no '{{.TASK_CMD}}' task, skipping)${C_RESET}"
            SKIPPED=$((SKIPPED + 1))
            continue
          fi

          echo "${C_BOLD}→ $DIR${C_RESET}"

          if (cd "$DIR" && task {{.TASK_CMD}} ENV={{.ENV}} 2>&1 | sed 's/^/  /'); then
            echo "  ${C_GREEN}✓ Success${C_RESET}"
            SUCCESS=$((SUCCESS + 1))
          else
            echo "  ${C_RED}✗ Failed${C_RESET}"
            FAILED="$FAILED\n  ${C_RED}✗ $DIR${C_RESET}"
          fi
          echo ""
        done

        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo "${C_BOLD}Summary${C_RESET}"
        echo "  ${C_GREEN}✓ $SUCCESS successful${C_RESET}"
        FAILED_COUNT=$(echo -e "$FAILED" | grep -c '✗' || echo 0)
        echo "  ${C_RED}✗ $FAILED_COUNT failed${C_RESET}"
        echo "  ${C_YELLOW}⊘ $SKIPPED skipped${C_RESET}"
        echo "  ${C_DIM}• $TOTAL total${C_RESET}"

        if [ -n "$FAILED" ]; then
          echo ""
          echo "${C_BOLD}${C_RED}Failed components:${C_RESET}"
          echo -e "$FAILED"
          exit 1
        else
          echo ""
          echo "${C_GREEN}✓ All components completed successfully${C_RESET}"
        fi

  deploy:all:
    desc: Deploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: deploy

  undeploy:all:
    desc: Undeploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: undeploy

  build:all:
    desc: Build all components
    cmds:
      - task: all
        vars:
          TASK_CMD: build

  push:all:
    desc: Push all components
    cmds:
      - task: all
        vars:
          TASK_CMD: push

  dev:all:
    desc: Run all components in development mode
    cmds:
      - task: all
        vars:
          TASK_CMD: dev

  compile:cwasm:all:
    desc: Pre-compile all WASM components to .cwasm (for faster test startup)
    deps:
      - build:all
    cmds:
      - |
        C_BOLD=$'\033[1m'
        C_CYAN=$'\033[36m'
        C_RESET=$'\033[0m'
        C_DIM=$'\033[2m'

        echo "${C_BOLD}${C_CYAN}▶ Pre-compiling WASM components...${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        cargo run --manifest-path tests/Cargo.toml --bin precompile --release -- .

  setup:all:
    desc: Setup all components (build, push, deploy)
    cmds:
      - task: all
        vars:
          TASK_CMD: setup

  status:all:
    desc: Check status of all components
    cmds:
      - task: all
        vars:
          TASK_CMD: status

  clean:all:
    desc: Clean all components
    cmds:
      - task: all
        vars:
          TASK_CMD: clean

  list:
    desc: List all sub-Taskfiles
    cmds:
      - |
        C_BOLD=$'\033[1m'
        C_BLUE=$'\033[34m'
        C_CYAN=$'\033[36m'
        C_RESET=$'\033[0m'
        C_DIM=$'\033[2m'

        echo "${C_BOLD}${C_BLUE}▶ Sub-Taskfiles${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        find . -mindepth 2 -name "Taskfile.yml" -type f | sort | while read taskfile; do
          DIR=$(dirname "$taskfile")
          echo "  ${C_CYAN}• $DIR${C_RESET}"
        done

  test:
    desc: "Run integration tests (builds components if needed)"
    cmds:
      - task: compile:cwasm:all
      - |
        C_BOLD=$'\033[1m'
        C_CYAN=$'\033[36m'
        C_RESET=$'\033[0m'
        C_DIM=$'\033[2m'

        echo "${C_BOLD}${C_CYAN}▶ Running integration tests${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        cd tests && cargo test {{.CLI_ARGS}}

  test:all:
    desc: "Run all integration tests in single binary (fastest)"
    cmds:
      - task: compile:cwasm:all
      - |
        C_BOLD=$'\033[1m'
        C_CYAN=$'\033[36m'
        C_RESET=$'\033[0m'
        C_DIM=$'\033[2m'

        echo "${C_BOLD}${C_CYAN}▶ Running integration tests (single binary)${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        cd tests && cargo test --test integration {{.CLI_ARGS}}

  test:flaky:
    desc: "Detect flaky tests by running the suite multiple times (run build:all first)"
    vars:
      ITERATIONS: '{{default "10" .ITERATIONS}}'
      RETRIES: '{{default "2" .RETRIES}}'
      FILTER: '{{default "" .FILTER}}'
    cmds:
      - |
        C_BOLD=$'\033[1m'
        C_CYAN=$'\033[36m'
        C_RESET=$'\033[0m'
        C_DIM=$'\033[2m'
        C_GREEN=$'\033[32m'
        C_RED=$'\033[31m'
        C_YELLOW=$'\033[33m'

        echo "${C_BOLD}${C_CYAN}▶ Detecting flaky tests${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"

        if ! command -v cargo-nextest >/dev/null 2>&1; then
          echo "${C_YELLOW}→ Installing cargo-nextest...${C_RESET}"
          cargo install cargo-nextest
        fi

        echo ""
        FILTER_DESC="{{.FILTER}}"
        if [ -z "$FILTER_DESC" ]; then
          FILTER_DESC="all tests"
        fi
        echo "Running: ${C_BOLD}$FILTER_DESC${C_RESET}"
        echo "Iterations: ${C_BOLD}{{.ITERATIONS}}${C_RESET}"
        echo "Retries per test: ${C_BOLD}{{.RETRIES}}${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"

        declare -A failure_counts
        total_runs=0

        for i in $(seq 1 {{.ITERATIONS}}); do
          echo ""
          echo "${C_BOLD}→ Iteration $i/{{.ITERATIONS}}${C_RESET}"
          total_runs=$((total_runs + 1))

          if [ -z "{{.FILTER}}" ]; then
            output=$(cd tests && cargo nextest run --retries {{.RETRIES}} --no-fail-fast 2>&1) || true
          else
            output=$(cd tests && cargo nextest run --retries {{.RETRIES}} --no-fail-fast -E "test({{.FILTER}})" 2>&1) || true
          fi

          while IFS= read -r line; do
            if [[ "$line" =~ FAIL.*[[:space:]]([a-zA-Z0-9_:]+) ]]; then
              test_name="${BASH_REMATCH[1]}"
              failure_counts["$test_name"]=$((${failure_counts["$test_name"]:-0} + 1))
            fi
          done <<< "$output"

          while IFS= read -r line; do
            if [[ "$line" =~ FLAKY.*[[:space:]]([a-zA-Z0-9_:]+) ]]; then
              test_name="${BASH_REMATCH[1]}"
              failure_counts["$test_name"]=$((${failure_counts["$test_name"]:-0} + 1))
            fi
          done <<< "$output"
        done

        echo ""
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo "${C_BOLD}Flakiness Report${C_RESET}"
        echo "${C_DIM}After {{.ITERATIONS}} iterations${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"

        if [ ${#failure_counts[@]} -eq 0 ]; then
          echo "${C_GREEN}✓ No flaky tests detected!${C_RESET}"
        else
          printf "  ${C_BOLD}%-50s${C_RESET} | ${C_BOLD}%6s${C_RESET} | ${C_BOLD}%5s${C_RESET}\n" "Test Name" "Fails" "Rate"
          echo "  ${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_DIM}|${C_DIM}━━━━━━━━━━━━━━${C_DIM}|${C_DIM}━━━━━━━━━━${C_RESET}"
          for test in "${!failure_counts[@]}"; do
            count=${failure_counts[$test]}
            rate=$((count * 100 / total_runs))
            if [ $rate -gt 50 ]; then
              COLOR="${C_RED}"
            elif [ $rate -gt 20 ]; then
              COLOR="${C_YELLOW}"
            else
              COLOR="${C_CYAN}"
            fi
            printf "  %-50s | %6d | ${COLOR}%5d%%${C_RESET}\n" "$test" "$count" "$rate"
          done | sort -t'|' -k3 -rn
        fi

        echo ""
        echo "${C_DIM}Total iterations: $total_runs${C_RESET}"

  default:
    desc: Show available tasks
    cmds:
      - task --list
