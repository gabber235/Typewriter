version: "3"

silent: true

vars:
  ENV: '{{default "local" .ENV}}'

tasks:
  all:
    desc: Run a task on all sub-Taskfiles
    vars:
      TASK_CMD: '{{default "" .TASK_CMD}}'
    cmds:
      - |
        if [ -z "{{.TASK_CMD}}" ]; then
          echo "Usage: task all TASK_CMD=<task-name>"
          echo "Example: task all TASK_CMD=deploy"
          exit 1
        fi

        # Find all Taskfile.yml files in subdirectories (excluding this one and Taskfile.single.yml)
        TASKFILES=$(find . -mindepth 2 -name "Taskfile.yml" -type f | sort)

        if [ -z "$TASKFILES" ]; then
          echo "No sub-Taskfiles found"
          exit 0
        fi

        echo "Running '{{.TASK_CMD}}' on all components..."
        echo "=========================================="

        FAILED=""
        for taskfile in $TASKFILES; do
          DIR=$(dirname "$taskfile")

          if ! (cd "$DIR" && task --list 2>/dev/null | grep -q "^\* {{.TASK_CMD}}:"); then
            echo "⊘ $DIR (task '{{.TASK_CMD}}' not found, skipping)"
            continue
          fi

          echo ""
          echo ">>> $DIR"
          echo "-------------------------------------------"
          if (cd "$DIR" && task {{.TASK_CMD}} ENV={{.ENV}}); then
            echo "<<< $DIR completed"
          else
            echo "<<< $DIR FAILED"
            FAILED="$FAILED $DIR"
          fi
        done

        echo ""
        echo "=========================================="
        if [ -n "$FAILED" ]; then
          echo "Failed components:$FAILED"
          exit 1
        else
          echo "All components completed successfully"
        fi

  deploy:all:
    desc: Deploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: deploy

  undeploy:all:
    desc: Undeploy all components
    cmds:
      - task: all
        vars:
          TASK_CMD: undeploy

  build:all:
    desc: Build all components
    cmds:
      - task: all
        vars:
          TASK_CMD: build

  push:all:
    desc: Push all components
    cmds:
      - task: all
        vars:
          TASK_CMD: push

  setup:all:
    desc: Setup all components (build, push, deploy)
    cmds:
      - task: all
        vars:
          TASK_CMD: setup

  status:all:
    desc: Check status of all components
    cmds:
      - task: all
        vars:
          TASK_CMD: status

  clean:all:
    desc: Clean all components
    cmds:
      - task: all
        vars:
          TASK_CMD: clean

  list:
    desc: List all sub-Taskfiles
    cmds:
      - |
        echo "Sub-Taskfiles found:"
        find . -mindepth 2 -name "Taskfile.yml" -type f | sort | while read taskfile; do
          DIR=$(dirname "$taskfile")
          echo "  - $DIR"
        done

  test:
    desc: "Run integration tests (builds components if needed)"
    cmds:
      - task: build:all
      - cd tests && cargo test {{.CLI_ARGS}}

  test:all:
    desc: "Run all integration tests in single binary (fastest)"
    cmds:
      - task: build:all
      - cd tests && cargo test --test integration {{.CLI_ARGS}}

  test:flaky:
    desc: "Detect flaky tests by running the suite multiple times (run build:all first)"
    vars:
      ITERATIONS: '{{default "10" .ITERATIONS}}'
      RETRIES: '{{default "2" .RETRIES}}'
      FILTER: '{{default "" .FILTER}}'
    cmds:
      - |
        echo "Checking for cargo-nextest..."
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          echo "Installing cargo-nextest..."
          cargo install cargo-nextest
        fi
        
        echo ""
        FILTER_DESC="{{.FILTER}}"
        if [ -z "$FILTER_DESC" ]; then
          FILTER_DESC="all tests"
        fi
        echo "Running $FILTER_DESC {{.ITERATIONS}} times with {{.RETRIES}} retries each..."
        echo "This will identify tests that fail intermittently."
        echo "(Run 'task build:all' first if components are not built)"
        echo "=================================================="
        
        # Track failures across all iterations
        declare -A failure_counts
        total_runs=0
        
        for i in $(seq 1 {{.ITERATIONS}}); do
          echo ""
          echo ">>> Iteration $i/{{.ITERATIONS}}"
          total_runs=$((total_runs + 1))
          
          # Run tests with retries, capture output
          # Tests that pass on retry are marked FLAKY
          if [ -z "{{.FILTER}}" ]; then
            output=$(cd tests && cargo nextest run --retries {{.RETRIES}} --no-fail-fast 2>&1) || true
          else
            output=$(cd tests && cargo nextest run --retries {{.RETRIES}} --no-fail-fast -E "test({{.FILTER}})" 2>&1) || true
          fi
          
          # Extract failed tests (after all retries exhausted)
          while IFS= read -r line; do
            if [[ "$line" =~ FAIL.*[[:space:]]([a-zA-Z0-9_:]+) ]]; then
              test_name="${BASH_REMATCH[1]}"
              failure_counts["$test_name"]=$((${failure_counts["$test_name"]:-0} + 1))
            fi
          done <<< "$output"
          
          # Extract flaky tests (failed then passed on retry)
          while IFS= read -r line; do
            if [[ "$line" =~ FLAKY.*[[:space:]]([a-zA-Z0-9_:]+) ]]; then
              test_name="${BASH_REMATCH[1]}"
              failure_counts["$test_name"]=$((${failure_counts["$test_name"]:-0} + 1))
            fi
          done <<< "$output"
        done
        
        echo ""
        echo "=================================================="
        echo "FLAKINESS REPORT (after {{.ITERATIONS}} iterations)"
        echo "=================================================="
        
        if [ ${#failure_counts[@]} -eq 0 ]; then
          echo "No flaky tests detected!"
        else
          printf "%-60s | %8s | %6s\n" "Test Name" "Failures" "Rate"
          echo "-------------------------------------------------------------+----------+-------"
          for test in "${!failure_counts[@]}"; do
            count=${failure_counts[$test]}
            rate=$((count * 100 / total_runs))
            printf "%-60s | %8d | %5d%%\n" "$test" "$count" "$rate"
          done | sort -t'|' -k3 -rn
        fi
        
        echo ""
        echo "Total iterations: $total_runs"

  default:
    desc: Show available tasks
    cmds:
      - task --list
