apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-identity
  namespace: typewriter
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.tw.seamlezz.net
      secretName: tw-seamlezz-net-tls
  rules:
    - host: api.tw.seamlezz.net
      http:
        paths:
          - path: /service/identity/issue
            pathType: Exact
            backend:
              service:
                name: service-identity
                port:
                  number: 80
