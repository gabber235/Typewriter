apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: service-identity
  namespace: wasmcloud
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      components:
        - name: service-identity
          image: oci.seamlezz.test/wasmcloud/service-identity:0.1.0
          imagePullSecret:
            name: harbor-registry-credentials
          localResources:
            environment:
              secretFrom:
                - name: service-identity-secrets
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
            - outgoing-handler
          config:
            host: api.typewritermc.test
            # TODO: when path routing is implemented add the `/service/identity/issue` path.
        - namespace: seamlezz
          package: surrealdb
          interfaces:
            - call
        - namespace: wasi
          package: logging
          interfaces:
            - logging
