apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: service-identity
  namespace: typewriter
spec:
  replicas: 1
  template:
    spec:
      environment: wasmcloud
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: service-identity
      components:
        - name: service-identity
          localResources:
            environment:
              secretFrom:
                - name: service-identity-secrets
      hostInterfaces:
        - namespace: wasi
          package: otel
          version: "0.2.0-rc.2"
          interfaces: [tracing, metrics]
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: PLACEHOLDER_API_HOST
        - namespace: seamlezz
          package: surrealdb
          version: "0.2.0"
          interfaces: [call]
          secretFrom:
            - name: surrealdb-credentials-service-identity
