# Artifact Keeper pull secret for auth-callout (local).
#
# To replace the temporary credentials:
# 1. Set the registry credentials for this environment:
#      export REGISTRY='oci.local.seamlezz.net'
#      export USERNAME='<artifact-keeper-username>'
#      export TOKEN='<artifact-keeper-token-or-password>'
# 2. Build the Docker auth value:
#      export AUTH="$(printf '%s:%s' "$USERNAME" "$TOKEN" | base64 | tr -d '\n')"
# 3. Build the docker config JSON:
#      jq -n --arg registry "$REGISTRY" --arg username "$USERNAME" --arg password "$TOKEN" --arg auth "$AUTH" \
#        '{auths:{($registry):{username:$username,password:$password,auth:$auth}}}'
# 4. Put that JSON below as stringData[".dockerconfigjson"], then run:
#      sops --encrypt --in-place backend/access/auth-callout/deploy/local/secrets/artifact-keeper-pull-secret.enc.yaml
