apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: user-organizations
  namespace: wasmcloud
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      components:
        - name: user-organizations
          image: oci.seamlezz.test/wasmcloud/user-organizations:0.1.0
          imagePullSecret:
            name: harbor-registry-credentials
      hostInterfaces:
        - namespace: wasmcloud
          package: messaging
          interfaces:
            - handler
            - consumer
          config:
            subscriptions: typewriter.in.user.*.organization.*,typewriter.in.user.*.organization.join_requests.*
        - namespace: seamlezz
          package: surrealdb
          interfaces:
            - call
        - namespace: wasi
          package: logging
          interfaces:
            - logging
