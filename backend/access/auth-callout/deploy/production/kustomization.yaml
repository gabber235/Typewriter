apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: externalsecret-patch.yaml
    target:
      kind: ExternalSecret
      name: auth-callout-secrets
  - path: workloaddeployment-patch.yaml
    target:
      kind: WorkloadDeployment
      name: auth-auth-callout
