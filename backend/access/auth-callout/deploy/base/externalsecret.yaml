apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-callout-secrets
  namespace: typewriter
spec:
  refreshPolicy: Periodic
  refreshInterval: 30m
  secretStoreRef:
    name: openbao-nats-backend
    kind: ClusterSecretStore
  target:
    name: auth-callout-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NATS_ISSUER_SEED: "{{ .wasmcloudIssuerSeed }}"
        NATS_SIGNING_KEYS: '{"typewriter-panel":"{{ .authCalloutSigningSeed }}","typewriter-services":"{{ .authCalloutSigningSeed }}"}'
        ISSUERS: "[]"
  data:
    - secretKey: wasmcloudIssuerSeed
      remoteRef:
        key: nats/account-signing-keys/operator/WASMCLOUD/sk-1
        property: seed
    - secretKey: authCalloutSigningSeed
      remoteRef:
        key: nats/account-signing-keys/operator/TYPEWRITER/auth-callout
        property: seed
    - secretKey: typewriterAccountPublicKey
      remoteRef:
        key: nats/account-keys/operator/TYPEWRITER
        property: public_key
