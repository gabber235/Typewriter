apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: auth-auth-callout
  namespace: typewriter
spec:
  replicas: 1
  template:
    spec:
      environment: wasmcloud
      hostSelector:
        hostgroup: default
      components:
        - name: auth-auth-callout
          localResources:
            environment:
              secretFrom:
                - name: auth-callout-secrets
      hostInterfaces:
        - namespace: wasi
          package: otel
          version: "0.2.0-rc.2"
          interfaces:
            - tracing
            - metrics
        - namespace: wasmcloud
          package: messaging
          version: "0.3.0"
          interfaces:
            - handler
            - consumer
          config:
            subscriptions: $SYS.REQ.USER.AUTH
        - namespace: wasi
          package: http
          interfaces:
            - outgoing-handler
