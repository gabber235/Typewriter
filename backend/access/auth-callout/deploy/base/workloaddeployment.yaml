apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: auth-auth-callout
  namespace: typewriter
spec:
  replicas: 1
  template:
    spec:
      environment: wasmcloud
      hostSelector:
        hostgroup: default
      components:
        - name: auth-auth-callout
          localResources:
            environment:
              secretFrom:
                - name: auth-callout-secrets
      hostInterfaces:
        - namespace: wasi
          package: otel
          version: "0.2.0-rc.2"
          interfaces:
            - tracing
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          interfaces:
            - core-handler
            - core
            - jetstream
          config:
            core-subscriptions: $SYS.REQ.USER.AUTH:typewriter.auth-auth-callout
        - namespace: wasi
          package: http
          interfaces:
            - outgoing-handler
