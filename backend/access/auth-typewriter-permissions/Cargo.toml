[package]
name = "auth-typewriter-permissions"
edition = "2021"
version = "0.1.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
wasmcloud-component = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jose = { version = "0.0.2", features = ["crypto-rustcrypto"] }
nats-jwt-rs = "0.1"
base64 = "0.22"
surrealdb-component = { path = "../../providers/surrealdb/surrealdb-component" }
wasmcloud-utils = { path = "../../wasmcloud-utils" }
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"
