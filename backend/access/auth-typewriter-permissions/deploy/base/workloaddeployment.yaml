apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: auth-auth-typewriter-permissions
  namespace: typewriter
spec:
  replicas: 1
  template:
    spec:
      environment: wasmcloud
      hostSelector:
        hostgroup: default
      components:
        - name: auth-auth-typewriter-permissions
      hostInterfaces:
        - namespace: wasi
          package: otel
          version: "0.2.0-rc.2"
          interfaces:
            - tracing
            - metrics
        - namespace: wasmcloud
          package: messaging
          version: "0.3.0"
          interfaces:
            - handler
            - consumer
          config:
            subscriptions: auth.permissions.typewriter-panel,auth.permissions.typewriter-services
        - namespace: seamlezz
          package: surrealdb
          version: "0.2.0"
          interfaces:
            - call
          secretFrom:
            - name: surrealdb-credentials-auth-typewriter-permissions
