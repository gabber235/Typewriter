[package]
name = "surrealdb-component"
version = "0.1.2"
edition = "2021"
description = "SurrealDB wasi logic wrapper"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde-content = "0.1"
wit-bindgen = "0.41"
