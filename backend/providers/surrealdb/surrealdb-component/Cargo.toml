[package]
name = "surrealdb-component"
version = "0.1.2"
edition = "2021"
description = "SurrealDB wasi logic wrapper"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.41"
serde_json = "1.0.145"
