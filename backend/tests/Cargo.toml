[package]
name = "backend-tests"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "precompile"
path = "src/bin/precompile.rs"

[features]
default = []
profiling = ["tracing-chrome"]

[dependencies]
# Test utilities
anyhow = "1"
# Cleanup on process exit
ctor = "0.2"
# Futures for concurrent operations
futures = "0.3"
# NATS client for test messaging
async-nats = "0.44"
# Bytes for component loading
bytes = "1"
# Datetime handling
chrono = "0.4"
# For component discovery
glob = "0.3"
# Protobuf for message encoding (generated from proto files)
prost = "0.13"
prost-types = "0.13"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml = "0.9"
# SurrealDB client for database assertions & seeding
surrealdb = { version = "2.2", features = ["kv-mem", "protocol-http"] }
# Testcontainers for real infrastructure
testcontainers = { version = "0.26", features = ["watchdog"] }
testcontainers-modules = { version = "0.14", features = ["nats", "surrealdb"] }
# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }
# Retry assertions for async tests
repeated-assert = { version = "0.4", features = ["async"] }
tracing = "0.1"
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4"] }
# For recursive file walking in rebuild detection
walkdir = "2"
# Wasmtime for pre-compilation binary (must match wash-runtime version)
wasmtime = { version = "41", features = ["component-model"] }
wash-runtime = { path = "/Users/thijs/Bestanden/wash/crates/wash-runtime", features = [
  "washlet",
  "wasi-config",
  "wasi-logging",
  "wasi-surrealdb",
] }

[build-dependencies]
glob = "0.3"
# Proto code generation
prost-build = "0.13"
