[package]
name = "backend-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Test utilities
anyhow = "1"
# NATS client for test messaging
async-nats = "0.44"
# Bytes for component loading
bytes = "1"
# Datetime handling
chrono = "0.4"
# For component discovery
glob = "0.3"
# Protobuf for message encoding (generated from proto files)
prost = "0.13"
prost-types = "0.13"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml = "0.9"
# SurrealDB client for database assertions & seeding
surrealdb = { version = "2.2", features = ["kv-mem"] }
# Testcontainers for real infrastructure
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["nats", "surrealdb"] }
# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# For recursive file walking in rebuild detection
walkdir = "2"
wash-runtime = { path = "/Users/thijs/Bestanden/wash/crates/wash-runtime", features = [
  "washlet",
  "wasi-config",
  "wasi-logging",
  "wasi-surrealdb",
] }

[build-dependencies]
glob = "0.3"
# Proto code generation
prost-build = "0.13"
