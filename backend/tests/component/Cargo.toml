[workspace]
resolver = "3"
members = [
    "crates/component-test-model",
    "crates/component-test-core",
    "crates/component-test-macros",
    "crates/component-test",
    "crates/typewriter-component-test",
    "suite",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
publish = false
repository = "https://github.com/gabber235/Typewriter"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
async-nats = "0.49.1"
base64 = "0.22"
bytes = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1"
inventory = "0.3"
indexmap = { version = "2", features = ["serde"] }
jose = { version = "0.0.2", features = ["crypto-rustcrypto"] }
nats-jwt-rs = "0.1"
nkeys = "0.4"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-matcher = "0.1"
skir-client = "0.1"
surrealdb = { version = "3.2.4", features = ["kv-mem"] }
surrealdb-types = "3.2.4"
sha2 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }
toml = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

component-test-model = { path = "crates/component-test-model" }
component-test-core = { path = "crates/component-test-core" }
component-test-macros = { path = "crates/component-test-macros" }
component-test = { path = "crates/component-test" }
typewriter-component-test = { path = "crates/typewriter-component-test" }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = [
    "p2",
    "p3",
] }
wasmtime-wasi-http = { version = "47.0.3", default-features = false, features = [
    "p2",
    "p3",
] }

wasmcloud-utils = { path = "../../wasmcloud-utils" }

wash-runtime = { git = "https://github.com/gabber235/wasmCloud", rev = "c8984bda3fadaf825d0b47f69a8041561fd3d32c", default-features = false, features = [
    "wasmcloud-nats",
    "wasi-config",
    "wasi-logging",
    "wasi-otel",
    "wasm_component_model_implements",
] }
wasmcloud-plugin-surrealdb = { git = "https://github.com/Seamlezz/wasmCloud-host", rev = "f7dad10b6c739e8e1fc58432aef4fe1021763d10" }

[profile.dev]
debug = 0
