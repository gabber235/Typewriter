[workspace]
resolver = "3"
members = [
    "crates/component-test-model",
    "crates/component-test-core",
    "crates/component-test-macros",
    "crates/component-test",
    "crates/typewriter-component-test",
    "crates/typewriter-stack",
    "suite",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false
repository = "https://github.com/gabber235/Typewriter"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# Held at the release wash-runtime takes in its public API (`wasmcloud_nats::synchronize`); moves
# with the wash-runtime pin.
async-nats = "0.49.1"
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = "1"
inventory = "0.3"
indexmap = { version = "2", features = ["serde"] }
jose = { version = "0.0.2", features = ["crypto-rustcrypto"] }
nats-jwt-rs = "0.1"
nkeys = "0.4"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-matcher = "0.1"
skir-client = "0.1"
surrealdb = { version = "4.0.1", features = ["kv-mem"] }
sha2 = "0.11"
syn = { version = "3", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }
uuid = { version = "1", features = ["v4"] }

component-test-model = { path = "crates/component-test-model" }
component-test-core = { path = "crates/component-test-core" }
component-test-macros = { path = "crates/component-test-macros" }
component-test = { path = "crates/component-test" }
typewriter-component-test = { path = "crates/typewriter-component-test" }
wasmtime-wasi = { version = "48.0.8", default-features = false, features = [
    "p2",
    "p3",
] }
wasmtime-wasi-http = { version = "48.0.8", default-features = false, features = [
    "p2",
    "p3",
] }

wasmcloud-utils = { path = "../../wasmcloud-utils" }
nats-permissions = { path = "../../access/nats-permissions" }
nats-broker = { path = "../../testing/nats-broker" }

wash-runtime = { git = "https://github.com/gabber235/wasmCloud", rev = "67e9e198742e6061dcc6fc8b378d02daa9b3a2a7", default-features = false, features = [
    "wasmcloud-nats",
    "wasi-config",
    "wasi-logging",
    "wasi-otel",
    "wasm_component_model_implements",
] }
wasmcloud-plugin-surrealdb = { git = "https://github.com/Seamlezz/wasmCloud-host", rev = "efdde11456b9e720018d27bcbdb8c8bdcbcb7fb2" }

[profile.dev]
debug = 0
