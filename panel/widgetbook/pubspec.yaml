name: widgetbook_workspace
description: "Widgetbook workspace"
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  widgetbook:
  widgetbook_annotation:
  typewriter_panel:
    path: ../
  typewriter_testkit:
    path: ../testkit

dependency_overrides:
  # widgetbook_generator 3.24.0 caps analyzer below 14, which Dart 3.14 needs for build_runner to
  # write valid code. Remove this override once widgetbook_generator accepts analyzer 14.
  analyzer: ^14.0.0
  nats_core:
    git:
      url: https://github.com/gabber235/nats.dart.git
      ref: 50231b430d1f5f37226ac36da30dd22c1c1859d9
      path: packages/nats_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  widgetbook_generator:
  build_runner:
  riverpod_lint:

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Lilex
      fonts:
        - asset: assets/fonts/Lilex/Lilex-VariableFont_wght.ttf
        - asset: assets/fonts/Lilex/Lilex-Italic-VariableFont_wght.ttf
          style: italic
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBM_Plex_Sans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans/IBMPlexSans-Bold.ttf
          weight: 700
