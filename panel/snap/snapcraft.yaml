name: typewriter_panel
version: 1000.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-typewriter_panel: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.typewriter_panel # adjust accordingly to your app name

apps:
  typewriter_panel:
    command: typewriter_panel
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-typewriter_panel
parts:
  typewriter_panel:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
