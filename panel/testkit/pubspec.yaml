name: typewriter_testkit
description: "Shared testing utilities and mocks for Typewriter Panel editors and Widgetbook"
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.51.0-0.1.pre"

dependencies:
  analyzer: ^14.0.0
  flutter:
    sdk: flutter
  typewriter_panel:
    path: ../
  flutter_test:
    sdk: flutter
dev_dependencies:
  build_runner:
  flutter_lints:
  riverpod_generator:

dependency_overrides:
  nats_core:
    git:
      url: https://github.com/gabber235/nats.dart.git
      ref: 20f25dac81b97ce5f42179ae0cf60e6e7b770c6a
      path: packages/nats_core

flutter:
  uses-material-design: true
