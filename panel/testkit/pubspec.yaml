name: typewriter_testkit
description: "Shared testing utilities and mocks for Typewriter Panel editors and Widgetbook"
publish_to: "none"
version: 0.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  typewriter_panel:
    path: ../
  hooks_riverpod:
  riverpod_annotation:
  flutter_animate:
  faker:
  flutter_hooks:
  iconify_flutter_plus:
  oidc: ^0.13.0
  oidc_default_store: ^0.5.0
  oidc_core: ^0.15.0
  pub_semver:
  collection:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  custom_lint:
  flutter_lints:
  riverpod_generator:
  riverpod_lint:

flutter:
  uses-material-design: true
