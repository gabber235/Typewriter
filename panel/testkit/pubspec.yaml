name: typewriter_testkit
description: "Shared testing utilities and mocks for Typewriter Panel editors and Widgetbook"
publish_to: "none"
version: 0.0.0

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  typewriter_panel:
    path: ../
  hooks_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  flutter_animate:
  faker:
  pub_semver:
  collection:
  iconify_flutter_plus: ^1.0.4
  riverpod: 3.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_lints:
  riverpod_generator:
  riverpod_lint:

dependency_overrides:
  nats_core:
    git:
      url: https://github.com/gabber235/nats.dart.git
      ref: ea905f36ffb6242e012d434101cb6d00a76c4d01
      path: packages/nats_core

flutter:
  uses-material-design: true
