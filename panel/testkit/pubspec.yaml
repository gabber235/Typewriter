name: typewriter_testkit
description: "Shared testing utilities and mocks for Typewriter Panel editors and Widgetbook"
publish_to: "none"
version: 0.0.0

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  analyzer: ^14.0.0
  flutter:
    sdk: flutter
  typewriter_panel:
    path: ../
  flutter_test:
    sdk: flutter
dev_dependencies:
  build_runner:
  flutter_lints:
  riverpod_generator:

dependency_overrides:
  nats_core:
    git:
      url: https://github.com/gabber235/nats.dart.git
      ref: 50231b430d1f5f37226ac36da30dd22c1c1859d9
      path: packages/nats_core

flutter:
  uses-material-design: true
