name: typewriter_testkit
description: "Shared testing utilities and mocks for Typewriter Panel editors and Widgetbook"
publish_to: "none"
version: 0.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  typewriter_panel:
    path: ../
  hooks_riverpod:
  riverpod_annotation:
  flutter_animate:
  faker:
  pub_semver:
  collection:
  dart_nats: ^1.1.1
  mocktail: ^1.0.4
  iconify_flutter_plus: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_lints:
  riverpod_generator:
  riverpod_lint:

flutter:
  uses-material-design: true
