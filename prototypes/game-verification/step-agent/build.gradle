plugins { id 'java' }

base { archivesName = 'step-agent' }
version = '0'

// Spike N: a Java agent that lets the runner decide when Paper's main loop runs a tick.
jar {
    manifest { attributes('Premain-Class': 'probe.agent.Agent', 'Can-Retransform-Classes': 'false') }
}

// Restore prototype: Warm calls Paper directly (resolved at run time from Paper's class path).
dependencies {
    compileOnly fileTree("${rootDir}/cache/patched/versions") { include '**/*.jar' }
    compileOnly fileTree("${rootDir}/cache/patched/libraries") { include '**/*.jar' }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
