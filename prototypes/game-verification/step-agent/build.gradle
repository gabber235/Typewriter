plugins { id 'java' }

base { archivesName = 'step-agent' }
version = '0'

// Spike N: a Java agent that lets the runner decide when Paper's main loop runs a tick.
jar {
    manifest { attributes('Premain-Class': 'probe.agent.Agent', 'Can-Retransform-Classes': 'false') }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
