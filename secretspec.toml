# Every secret Typewriter's tools, harness and workflows read, by name only; values live in the
# Typewriter 1Password vault, one item per key titled `secretspec/typewriter/<profile>/<KEY>`
# (`secretspec set <KEY> --profile <profile>` creates it), or, for contributors without access, in
# the repository root's `.env` (see `.env.example`). `cargo xtask secrets check` shows
# which profiles are satisfied. Profiles do not inherit from `default`, so a run reads only the
# secrets it uses.
#
# Keep the `secretspec` crate in xtask/Cargo.toml and the CLI devenv provides on the same version.

[project]
name = "typewriter"
revision = "1.0"

[providers]
# Signs in through `OP_SERVICE_ACCOUNT_TOKEN` (CI, agents) or the 1Password desktop app.
vault = "onepassword://Typewriter"
# Without 1Password, `SECRETSPEC_PROVIDER=local` skips the vault and its warning.
local = "dotenv://.env"

[defaults]
providers = ["vault", "local"]

# Local tools. Each works without its secrets until the feature that needs them is used.
[profiles.default]
FIBERY_WORKSPACE = { description = "Fibery workspace the pi Fibery extension talks to, such as `typewriter` or `typewriter.fibery.io`", required = false }
FIBERY_API_TOKEN = { description = "Fibery API token of the pi Fibery extension", required = false }
GREPTIME_USERNAME = { description = "GreptimeDB user of the typewriter MCP tool, for an endpoint that requires authentication", required = false }
GREPTIME_PASSWORD = { description = "GreptimeDB password of the typewriter MCP tool, paired with GREPTIME_USERNAME", required = false }

# `cargo xtask deploy local`.
[profiles.deploy]
defaults = { inherit = false }
LOCAL_REGISTRY_PASSWORD = { description = "Password of the gabber235 user on the local cluster's registry (oci.local.seamlezz.net)" }

# The full tier: `cargo xtask e2e full`, `cargo xtask cluster ci` and `cargo xtask deploy ci`.
[profiles.ci]
defaults = { inherit = false }
CI_AGE_KEY = { description = "age key the CI cluster's SOPS secrets are encrypted to; Flux decrypts with it" }
CI_REGISTRY_PASSWORD = { description = "Password of the gabber235 user on the CI cluster's registry" }
INFRASTRUCTURE_DEPLOY_KEY = { description = "Read only SSH deploy key of Seamlezz/Infrastructure, whose pinned revision defines the CI cluster" }

# The Discord bot run locally (`secretspec run --profile bot -- cargo run` in discord_bot/).
# Production reads the same names from the Fly app's secrets.
[profiles.bot]
defaults = { inherit = false }
DISCORD_TOKEN = { description = "Discord bot token" }
CLICKUP_TOKEN = { description = "ClickUp API token for the task commands", required = false }
CLICKUP_WEBHOOK_SECRET = { description = "Signing secret of the ClickUp webhook", required = false }
GITHUB_WEBHOOK_SIGNATURE = { description = "Signing secret of the GitHub webhook", required = false }

# Release workflows. Each job resolves only its own scope. The Discord bot's Fly deploy keeps its
# GitHub secret: the bot moves to the cluster, and Fly goes with that move.
[profiles.release]
defaults = { inherit = false }
MODRINTH_TOKEN = { description = "Modrinth token that syncs the project description" }
SPONSORS_GITHUB_TOKEN = { description = "GitHub token that reads sponsors and pushes the sponsors README" }

# The marketplace website (`secretspec run --profile marketplace -- bun run dev` in
# marketplace/website/).
[profiles.marketplace]
defaults = { inherit = false }
AUTH_SECRET = { description = "Auth.js session encryption secret; generate with `openssl rand -base64 32`" }
AUTH_AUTHENTIK_SECRET = { description = "OAuth2 client secret of the marketplace's Authentik application" }

[scopes.modrinth]
secrets = ["MODRINTH_TOKEN"]

[scopes.sponsors]
secrets = ["SPONSORS_GITHUB_TOKEN"]
