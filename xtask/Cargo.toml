[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
description = "The Typewriter harness: every check, deploy and toolchain command behind `cargo xtask`."

# Light dependencies only, so a fresh worktree compiles the harness in seconds.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Process groups and signals for the stack supervisor.
libc = "0.2"
# JaCoCo coverage reports (Kover).
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The runtime of the generated Skir types (build.rs).
skir-client = "0.1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-dart = "0.2"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-rust = "0.24"

# Parsing the repository is the review tools' main cost. An optimized tree-sitter runtime halves
# it; the grammars stay unoptimized, since their large generated parsers compile slowly.
[profile.dev.package.tree-sitter]
opt-level = 3
