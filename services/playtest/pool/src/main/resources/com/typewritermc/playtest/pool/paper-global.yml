# Paper fills in every other setting with its default and rewrites this file on start.
_version: 31
packet-limiter:
  all-packets:
    action: KICK
    interval: 7.0
    # Off: a stepped client answers every tick with a ping reply and an ack, far above the wall clock limit.
    max-packet-rate: 0.0
chunk-loading-basic:
  # Off: the caps count wall clock time, so a stepped Paper that moves a player into a fresh region sent
  # its chunks at 75 a second, about 1 s of every claim; the chunks a claim waits for are few and local.
  player-max-chunk-load-rate: -1.0
  player-max-chunk-send-rate: -1.0
