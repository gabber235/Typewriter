[versions]
kotlin = "2.4.21"
# Held: kctfork 0.14.0 embeds the KSP 2.3.12 engine; move with the kctfork release that embeds a newer one.
ksp = "2.3.12"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
detekt = "2.0.0-alpha.6"
foojay = "1.0.0"
koin-bom = "4.2.2"
logback = "1.6.7"
mordant = "3.1.1"
opentelemetry = "1.68.0"
opentelemetry-semconv = "1.45.0"
# The Paper API of the server the Paper engine runs on: minecraft and paper-build.
paper = "26.3.build.255-stable"
semver = "3.1.0"
kotlinpoet = "2.4.0"

skir = "1.0.17"
okio = "3.18.2"

# A git tag of the natskt fork that settings.gradle.kts builds from source; the fork holds
# kotlinx serialization at 1.11 with kotlin-serialize.
nats = "v0.9.2-typewriter.3"
cryptography = "0.6.0"
surrealdb-server = "3.3.0"
surrealdb-embedded = "3.1.5"
# Held: SDK 2.2.0 bundles SurrealDB 3.3, which refuses versioning on the memory engine that realm requests it for.
surrealdb-java-sdk = "2.1.2"

# Held: from 1.12.0 the default Json refuses nesting past 400, and skir client decodes through it
# below the 576 levels BoundedDecoding admits.
kotlin-serialize = "1.11.0"
kotlin-coroutines = "1.11.0"
jline = "4.7.0"
clikt = "5.2.1"
gradle-buildconfig = "6.1.2"

# Held: the 1.2.0 Gradle plugin drops exclude patterns from tasks without include patterns.
test-balloon = "1.1.0"
kotest = "6.2.7"
kctfork = "0.14.0"
kover = "0.9.11"
jacoco = "0.8.16"

run-task = "3.1.0"
fabric-loom = "1.19.4"
fabric-loader = "0.20.1"
fabric-api = "0.166.2+26.3"
minecraft = "26.3"
paper-build = "255"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
semver = { module = "io.github.z4kn4fein:semver", version.ref = "semver" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint-gradle" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
run-task-gradle-plugin = { module = "xyz.jpenilla:run-task", version.ref = "run-task" }

jline = { module = "org.jline:jline", version.ref = "jline" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }

test-balloon = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "test-balloon" }
test-balloon-gradle-plugin = { module = "de.infix.testBalloon:de.infix.testBalloon.gradle.plugin", version.ref = "test-balloon" }
test-balloon-kotest-assertions = {module = "de.infix.testBalloon:testBalloon-integration-kotest-assertions", version.ref = "test-balloon"}
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

skir-client = { module = "build.skir:skir-client", version.ref = "skir" }
okio = { module = "com.squareup.okio:okio-jvm", version.ref = "okio" }

nats-core = { module = "io.github.n-hass:natskt-core", version.ref = "nats" }
nats-jetstream = { module = "io.github.n-hass:natskt-jetstream", version.ref = "nats" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
surrealdb-java-sdk = { module = "com.surrealdb:surrealdb", version.ref = "surrealdb-java-sdk" }

kotlin-serialize-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlin-serialize" }
kotlin-serialize-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlin-serialize" }
kotlin-serialize-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialize" }

kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }

opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
opentelemetry-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetry-semconv" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialize = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

gradle-buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "gradle-buildconfig" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }

[bundles]
basic-test = ["test-balloon", "test-balloon-kotest-assertions", "kotest-assertions"]
