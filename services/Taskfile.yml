version: "3"

silent: true

set:
  - pipefail

tasks:
  test:all:
    desc: Run all tests across all services
    cmds:
      - |
        # Color definitions using bash $'...' syntax
        C_RESET=$'\033[0m'
        C_BOLD=$'\033[1m'
        C_DIM=$'\033[2m'
        C_GREEN=$'\033[32m'
        C_RED=$'\033[31m'
        C_YELLOW=$'\033[33m'
        C_BLUE=$'\033[34m'
        C_CYAN=$'\033[36m'
        C_MAGENTA=$'\033[35m'

        echo "${C_BOLD}${C_MAGENTA}▶ Running tests across all services${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo ""

        SERVICES="libs/service-communicator libs/service-registrar libs/service-telemetry libs/service-utils realm build-logic"

        TOTAL=0
        SUCCESS=0
        FAILED=""
        SKIPPED=0

        for service in $SERVICES; do
          TOTAL=$((TOTAL + 1))

          if [ ! -d "$service" ]; then
            echo "${C_DIM}⊘ $service (not found)${C_RESET}"
            SKIPPED=$((SKIPPED + 1))
            continue
          fi

          SERVICE_NAME=$(basename "$service")
          echo "${C_BOLD}→ $SERVICE_NAME${C_RESET} ${C_DIM}($service)${C_RESET}"

          if (cd "$service" && ./gradlew test) 2>&1 | sed 's/^/  /'; then
            echo "  ${C_GREEN}✓ Tests passed${C_RESET}"
            SUCCESS=$((SUCCESS + 1))
          else
            echo "  ${C_RED}✗ Tests failed${C_RESET}"
            FAILED="$FAILED\n  ${C_RED}✗ $SERVICE_NAME${C_RESET}"
          fi
          echo ""
        done

        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo "${C_BOLD}Results${C_RESET}"
        echo "  ${C_GREEN}✓ $SUCCESS passed${C_RESET}"
        FAILED_COUNT=$(echo -e "$FAILED" | grep -c '✗' || echo 0)
        echo "  ${C_RED}✗ $FAILED_COUNT failed${C_RESET}"
        echo "  ${C_YELLOW}⊘ $SKIPPED skipped${C_RESET}"
        echo "  ${C_DIM}• $TOTAL total${C_RESET}"

        if [ -n "$FAILED" ]; then
          echo ""
          echo "${C_BOLD}${C_RED}Failed services:${C_RESET}"
          echo -e "$FAILED"
          exit 1
        else
          echo ""
          echo "${C_GREEN}✓ All services tested successfully${C_RESET}"
        fi

  test:
    desc: Run tests for a specific service
    vars:
      SERVICE: '{{default "" .SERVICE}}'
    cmds:
      - |
        C_RESET=$'\033[0m'
        C_BOLD=$'\033[1m'
        C_DIM=$'\033[2m'
        C_GREEN=$'\033[32m'
        C_RED=$'\033[31m'
        C_CYAN=$'\033[36m'
        C_MAGENTA=$'\033[35m'

        if [ -z "{{.SERVICE}}" ]; then
          echo "${C_BOLD}${C_RED}Error: SERVICE is required${C_RESET}"
          echo ""
          echo "${C_DIM}Usage:${C_RESET} task test SERVICE=<service-name>"
          echo "${C_DIM}Example:${C_RESET} task test SERVICE=realm"
          echo ""
          echo "${C_BOLD}Available services:${C_RESET}"
          echo "  ${C_CYAN}• service-communicator${C_RESET}"
          echo "  ${C_CYAN}• service-registrar${C_RESET}"
          echo "  ${C_CYAN}• service-telemetry${C_RESET}"
          echo "  ${C_CYAN}• service-utils${C_RESET}"
          echo "  ${C_CYAN}• realm${C_RESET}"
          echo "  ${C_CYAN}• build-logic${C_RESET}"
          exit 1
        fi

        SERVICE_PATH=""
        case "{{.SERVICE}}" in
          "communicator"|"service-communicator")
            SERVICE_PATH="libs/service-communicator"
            ;;
          "registrar"|"service-registrar")
            SERVICE_PATH="libs/service-registrar"
            ;;
          "telemetry"|"service-telemetry")
            SERVICE_PATH="libs/service-telemetry"
            ;;
          "utils"|"service-utils")
            SERVICE_PATH="libs/service-utils"
            ;;
          "realm")
            SERVICE_PATH="realm"
            ;;
          "build-logic")
            SERVICE_PATH="build-logic"
            ;;
          *)
            echo "${C_BOLD}${C_RED}Error: Unknown service '{{.SERVICE}}'${C_RESET}"
            exit 1
            ;;
        esac

        if [ ! -d "$SERVICE_PATH" ]; then
          echo "${C_BOLD}${C_RED}Error: Service directory not found: $SERVICE_PATH${C_RESET}"
          exit 1
        fi

        echo "${C_BOLD}${C_MAGENTA}▶ Running tests for {{.SERVICE}}${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo ""

        if (cd "$SERVICE_PATH" && ./gradlew test); then
          echo ""
          echo "${C_GREEN}✓ Tests passed for {{.SERVICE}}${C_RESET}"
        else
          echo ""
          echo "${C_RED}✗ Tests failed for {{.SERVICE}}${C_RESET}"
          exit 1
        fi

  build:all:
    desc: Build all services
    cmds:
      - |
        C_RESET=$'\033[0m'
        C_BOLD=$'\033[1m'
        C_DIM=$'\033[2m'
        C_GREEN=$'\033[32m'
        C_RED=$'\033[31m'
        C_BLUE=$'\033[34m'

        echo "${C_BOLD}${C_BLUE}▶ Building all services${C_RESET}"
        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo ""

        SERVICES="libs/service-communicator libs/service-registrar libs/service-telemetry libs/service-utils realm build-logic"

        TOTAL=0
        SUCCESS=0
        FAILED=""

        for service in $SERVICES; do
          TOTAL=$((TOTAL + 1))

          if [ ! -d "$service" ]; then
            continue
          fi

          SERVICE_NAME=$(basename "$service")
          echo "${C_BOLD}→ Building $SERVICE_NAME${C_RESET}"

          if (cd "$service" && ./gradlew build -x test) 2>&1 | sed 's/^/  /'; then
            echo "  ${C_GREEN}✓ Build successful${C_RESET}"
            SUCCESS=$((SUCCESS + 1))
          else
            echo "  ${C_RED}✗ Build failed${C_RESET}"
            FAILED="$FAILED\n  ${C_RED}✗ $SERVICE_NAME${C_RESET}"
          fi
          echo ""
        done

        echo "${C_DIM}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${C_RESET}"
        echo "${C_BOLD}Results${C_RESET}"
        echo "  ${C_GREEN}✓ $SUCCESS successful${C_RESET}"
        FAILED_COUNT=$(echo -e "$FAILED" | grep -c '✗' || echo 0)
        echo "  ${C_RED}✗ $FAILED_COUNT failed${C_RESET}"
        echo "  ${C_DIM}• $TOTAL total${C_RESET}"

        if [ -n "$FAILED" ]; then
          echo ""
          echo "${C_BOLD}${C_RED}Failed builds:${C_RESET}"
          echo -e "$FAILED"
          exit 1
        else
          echo ""
          echo "${C_GREEN}✓ All services built successfully${C_RESET}"
        fi

  default:
    desc: Show available tasks
    cmds:
      - task --list
