[package]
name = "typewriter-transport-generator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
genco = "0.20.0"
proc-macro2 = "1.0.103"
prettyplease = "0.2.37"
quote = "1.0.41"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.145"
syn = { version = "2.0.106", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
