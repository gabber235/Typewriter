# Transport routes between the panel, Typewriter services and backend components.
#
# Each route declares its parties and one logical address per channel. The transport generator
# derives every subject family prefix and every role grant from the parties and the role
# declarations below; backend/AGENTS.md describes the subject families.

# Payload framing shared by every transport. A payload above chunk_bytes travels as frames of at
# most chunk_bytes in credit windows of window_frames: the receiver grants each next window.
# Requests are single messages unless a route raises request_max_bytes; replies may be framed up to
# reply_max_bytes. A payload above its ceiling fails as too large before any frame is sent.
# reply_ttl_ms bounds a whole exchange. The generator derives each role's NATS response limit from
# the largest framed reply it serves.
limits: { chunk_bytes: 524288, window_frames: 8, request_max_bytes: 524288, reply_max_bytes: 33554432, reply_ttl_ms: 300000 }

roles:
  authenticated_user: { side: panel, personal: user }
  organization_member: { side: panel, tenant: [organization], personal: user }
  registered_service: { side: service, personal: service }
  realm_coordinator: { side: service, tenant: [organization, realm] }
  realm_participant: { side: service, tenant: [organization, realm] }

# Backend components by deploy/base directory. For every component that serves or subscribes to
# routes, the generator emits a typed dispatcher (transport_routes::<component>) and writes its
# nats-subscriptions.generated.yaml ConfigMap into that directory.
components:
  user-organization: backend/organization/user-organization/deploy/base
  organization-members: backend/organization/organization-members/deploy/base
  organization-roles: backend/organization/organization-roles/deploy/base
  service-registration: backend/service/service-registration/deploy/base
  auth-typewriter-permissions: backend/access/auth-typewriter-permissions/deploy/base
  auth-callout: backend/access/auth-callout/deploy/base

routes:
  - name: user_organization_create
    scope: user
    callers: [{ role: authenticated_user }]
    server: { component: user-organization }
    flow:
      kind: unary
      method: "organization/v1/organization.skir:CreateOrganization"
      operation: user.organization.create
      request: user.{user}.organization.create

  - name: user_organizations_watch
