      operation: user.organization.watch
      request: user.{user}.organization.watch
      updates:
        payload: "organization/v1/organization.skir:UserOrganizationsChanged"
        address: user.{user}.organizations.changed
        delivery: { kind: persistent, stream: TYPEWRITER_MEMBERSHIP, projection: user_organizations_changed }

  - name: user_join_requests_watch
