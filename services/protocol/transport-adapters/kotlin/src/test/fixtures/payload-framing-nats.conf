# The broker of PayloadFramingOnNatsTest: users holding the kind of grants the backend hands out.
#
# Services hold allow_responses with the generated SERVICE_RESPONSE_LIMIT as max and REPLY_TTL_MS as expiry
# (backend/wasmcloud-utils transport_routes), so every frame and credit a service answers with must fit them.
# The panel user holds no response permission, as panel connections never do. The max_payload is the NATS
# default the deployment runs with, stated so a framed payload provably exceeds it.

port: 4222
max_payload: 1MB

authorization {
  users = [
    {
      # The Realm host: serves blob store and catalog fetch, and probes its participants.
      user: "realm", password: "fixture-secret"
      permissions: {
        publish: { allow: ["service.from.quests.organization.writers.realm.rollout.probe"] }
        subscribe: {
          allow: [
            "service.to.quests.organization.writers.realm.shared.blob.store",
            "service.to.quests.organization.writers.realm.editor.catalog.fetch",
            "_INBOX.realm.*",
          ]
        }
        allow_responses: { max: 256, expires: "300000ms" }
      }
    }
    {
      # A realm participant service: stores blobs and answers rollout probes.
      user: "quests", password: "fixture-secret"
      permissions: {
        publish: { allow: ["service.to.quests.organization.writers.realm.shared.blob.store"] }
        subscribe: { allow: ["service.from.quests.organization.writers.realm.rollout.probe", "_INBOX.quests.*"] }
        allow_responses: { max: 256, expires: "300000ms" }
      }
    }
    {
      # A panel user of the writers organization, with its session reply inbox and no response permission.
      user: "alice", password: "fixture-secret"
      permissions: {
        publish: { allow: ["service.to.quests.organization.writers.realm.editor.catalog.fetch"] }
        subscribe: { allow: ["_INBOX.alice.0123456789abcdef0123456789abcdef.*"] }
      }
    }
  ]
}
